COM_CSPAGEPROTECTOR_CHALLENGE_MESSAGE_DEFAULT="Bude to trvat jen chvilku. Pomáhá to udržet automatické scrapery mimo tuto stránku."

; Options - Exemptions
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS="Výjimky"
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_DESC="Kdo může kontrolu přeskočit."
