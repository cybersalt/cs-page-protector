COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT="Podpora"
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_DESC="Na koho se obrátit, když se něco pokazí."
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_SUBTITLE="Kontaktní údaje podpory zobrazené na ovládacím panelu (nikdy návštěvníkům webu)"
