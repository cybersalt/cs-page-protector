COM_CSPAGEPROTECTOR_CHALLENGE_WHY_BODY="Tento web žádá váš prohlížeč, aby před zobrazením některých stránek vyřešil malou úlohu. Člověku to zabere sekundu, ale pro automatické nástroje je pak kopírování celého webu drahé. Nějakou dobu už vás o to nebudeme žádat."

; Options - Modules
COM_CSPAGEPROTECTOR_FIELDSET_MODULES="Moduly"
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_DESC="Chraňte obsah modulů na každé stránce, kde se zobrazují. Dokud jsou moduly nebo obsah chráněné, vlastní mezipaměť zobrazení a modulů Joomla se obchází, aby se kopie z mezipaměti nikdy nedostala k návštěvníkovi, který kontrolou neprošel. Mezipaměť stránek se řeší zvlášť a pro ostatní stránky funguje dál."
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_SUBTITLE="Chraňte obsah modulů před scrapery, i na nechráněných stránkách"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_LABEL="Chráněné moduly"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_DESC="Tyto moduly se zobrazují pouze návštěvníkům, kteří prošli kontrolou (nebo ji přeskakují: přihlášení uživatelé, povolené IP adresy, ověřené vyhledávače), a to na každé stránce, kde se objeví. Hodí se pro kontaktní údaje, ceny nebo informace pro členy v patičce či postranním panelu."
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_LABEL="Chráněné pozice modulů"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_DESC="Chráněn je každý modul v těchto pozicích, včetně modulů přidaných později."
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES="%2$s (počet modulů: %1$d)"
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES_1="%2$s (1 modul)"
COM_CSPAGEPROTECTOR_NO_POSITION="(bez pozice)"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_LABEL="Návštěvníci, kteří kontrolou neprošli, uvidí"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_DESC="Zástupný blok zachová nadpis a rámeček modulu s tlačítkem „Zobrazit obsah“, které spustí kontrolu a hned se vrátí zpět. Skrytí modul zcela odstraní, takže se jeho pozice zavře; návštěvníci ho pak uvidí, až projdou kontrolou jinde, například na chráněné stránce. V obou případech se CAPTCHA uvnitř modulu nikdy nezobrazuje, takže stránka nikdy nemá víc než jednu."
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_PLACEHOLDER="Zástupný blok s tlačítkem „Zobrazit obsah“"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_HIDE="Nic: modul se zcela skryje"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_LABEL="Text zástupného bloku"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_DESC="Zobrazí se místo obsahu modulu. Pro výchozí hodnotu ponechte prázdné."
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_LABEL="Popisek tlačítka"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_DESC="Popisek tlačítka, které spouští kontrolu. Pro výchozí hodnotu ponechte prázdné."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_TEXT_DEFAULT="Tento obsah se zobrazí po rychlé kontrole prohlížeče."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_BUTTON_DEFAULT="Zobrazit obsah"

