COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_DESC="Zobrazuje se na ovládacím panelu, aby správci webu věděli, na koho se obrátit. Návštěvníkům webu se nikdy nezobrazuje."
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_LABEL="Stránka podpory"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_DESC="Odkaz na kontaktní formulář nebo stránku nápovědy."
