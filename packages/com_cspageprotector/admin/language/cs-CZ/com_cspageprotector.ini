COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_LABEL="Přihlášení uživatelé přeskakují kontrolu"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_DESC="Každý přihlášený na webu se dostane rovnou na chráněné stránky. Vypněte, chcete-li z kontroly vyjmout jen některé skupiny uživatelů."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_LABEL="Skupiny uživatelů, které přeskakují kontrolu"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_DESC="Přihlášení členové těchto skupin (nebo jakékoli podřízené skupiny) kontrolu přeskakují."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_LABEL="Vpustit ověřené vyhledávače"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_DESC="Googlebot, Bingbot, Applebot, YandexBot, Baiduspider a Yahoo Slurp kontrolu přeskakují, ale až poté, co zpětné a dopředné vyhledání v DNS potvrdí, že požadavek opravdu pochází od daného vyhledávače. Scraper, který se jen vydává za Googlebot, je kontrolován i nadále. AI crawlery jako GPTBot a ClaudeBot na tomto seznamu nejsou. Pokud tuto volbu vypnete, chráněné stránky vypadnou z výsledků vyhledávání."
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_LABEL="Zaznamenávat návštěvy vyhledávačů"
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_DESC="Zapsat záznam do protokolu pokaždé, když je vpuštěn ověřený vyhledávač. Ve výchozím stavu vypnuto, protože crawlery chodí často."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_LABEL="IP adresy, které přeskakují kontrolu"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_DESC="Jedna na řádek. Fungují jednotlivé adresy (203.0.113.7) i rozsahy (203.0.113.0/24, 2001:db8::/32). Řádky začínající znakem # se ignorují. Hodí se pro vaši kancelář, monitorování dostupnosti a partnery."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_HINT="203.0.113.7 nebo 198.51.100.0/24"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_LABEL="IP návštěvníka pochází z"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_DESC="Měňte pouze tehdy, pokud web běží za proxy nebo CDN. Vybrané hlavičce se věří jen tehdy, když požadavek opravdu přichází přes danou proxy: u Cloudflare z vlastních adres Cloudflare, u ostatních z adres v poli „Důvěryhodné proxy“ (nebo z proxy na stejném serveru či v privátní síti, pokud je toto pole prázdné). Pokud hlavičku pošle kdokoli jiný, je ignorována, takže se nikdo nemůže vydávat za povolenou adresu."
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_REMOTE_ADDR="Samotné připojení (bez proxy)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_CLOUDFLARE="Cloudflare (CF-Connecting-IP)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_XFF="Proxy / vyrovnávání zátěže (X-Forwarded-For)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_X_REAL_IP="Nginx proxy (X-Real-IP)"

; Options - Logging
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING="Protokolování"
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_DESC="Co se zapisuje do protokolu událostí a jak dlouho."
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_SUBTITLE="Protokol událostí, ze kterého čerpá ovládací panel"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_LABEL="Vést protokol událostí"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_DESC="Zaznamenávat každou kontrolu, úspěch, neúspěch a zablokování. Ovládací panel a protokol událostí to potřebují."
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_LABEL="Zkracovat IP adresy"
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_DESC="Ve výchozím stavu zapnuto. Ukládá pouze síťovou část každé adresy (203.0.113.0 místo 203.0.113.7), díky čemuž je protokol šetrnější k pravidlům ochrany soukromí, jako je GDPR. Během zpracování požadavku ochrana stále používá úplnou adresu; zkracuje se jen to, co se ukládá. Zapnutím této volby se zkrátí i adresy, které už v protokolu jsou. Vypněte ji, jen pokud potřebujete přesné adresy, například k zablokování jedné IP ve firewallu."
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_LABEL="Uchovávat záznamy (dní)"
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_DESC="Starší záznamy se mažou automaticky. 0 je uchovává navždy."

