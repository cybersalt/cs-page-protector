; Dashboard
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_HEADING="Jak Page Protector funguje"
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_BODY="Návštěvníci chráněné stránky nejprve uvidí krátkou kontrolu prohlížeče. Jejich prohlížeč vyřeší malou úlohu proof-of-work (pro člověka asi sekunda, pro scraper procházející tisíce stránek skutečná zátěž procesoru), pak dostanou propustku a mohou chráněné stránky normálně procházet, dokud nevyprší. Přihlášení uživatelé, povolené IP adresy a ověřené vyhledávače mohou kontrolu přeskočit."
COM_CSPAGEPROTECTOR_NO_GUARANTEE_LABEL="Bez záruky."
COM_CSPAGEPROTECTOR_NO_GUARANTEE_BODY="Boti a hackeři jsou vytrvalí. Cybersalt Page Protector dělá vše pro to, aby váš obsah ochránil, ale nemůžeme zaručit, že útočníci nenajdou jinou cestu, jak ho obejít. Jako vždy platí: informace, které nechcete mít na internetu, na internet nedávejte."
