COM_CSPAGEPROTECTOR_FIELD_AUTO_START_DESC="Začít řešit proof-of-work hned po načtení stránky, místo čekání, až návštěvník zaškrtne políčko. Platí pouze pro CAPTCHA Proof-of-Work."
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_LABEL="Po vyřešení automaticky pokračovat"
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_DESC="Přesměrovat návštěvníka na stránku hned po vyřešení kontroly, aniž by musel klikat na Pokračovat. Platí pouze pro CAPTCHA Proof-of-Work."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_LABEL="Platnost propustky"
