COM_CSPAGEPROTECTOR_FIELD_BIND_IP_LABEL="Svázat propustku s IP návštěvníka"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_DESC="Zkopírovaná propustka bude z jakékoli jiné adresy nepoužitelná. Nechte vypnuté, pokud mnoho vašich návštěvníků používá mobilní sítě, kde se IP často mění a byli by pokaždé kontrolováni znovu."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_LABEL="HTTP stav stránky s kontrolou"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_DESC="200 funguje všude. 403 botům jasně říká, že byli odmítnuti, ale někteří poskytovatelé hostingu nahrazují stránky 403 vlastní chybovou stránkou, což by kontrolu před skutečnými návštěvníky skrylo. Před přepnutím vyzkoušejte."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_200="200 OK (doporučeno)"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_403="403 Forbidden"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_LABEL="Nadpis"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_DESC="Nadpis zobrazený nad kontrolou. Pro výchozí hodnotu ponechte prázdné."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_LABEL="Zpráva"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_DESC="Text zobrazený pod nadpisem. Je povoleno základní HTML. Pro výchozí hodnotu ponechte prázdné."
