COM_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Autor: <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Postaví před vybrané stránky kontrolu typu proof-of-work, takže scrapery musí vynaložit skutečný výpočetní čas, než získají váš obsah. Skuteční návštěvníci jednou uvidí krátký krok &quot;kontrola prohlížeče&quot; a pak web procházejí normálně. Pro Joomla 5 a 6 (vestavěná CAPTCHA Proof-of-Work vyžaduje Joomla 6.1 nebo novější)."

