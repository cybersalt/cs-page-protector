COM_CSPAGEPROTECTOR_SUPPORT_COMMUNITY_HEADING="Rádi se od vás dozvíme"
COM_CSPAGEPROTECTOR_SUPPORT_COMMUNITY_BODY="Posílejte nám hlášení chyb, požadavky na funkce, dotazy a nápady - čteme každý z nich a zpětné vazby si vážíme. Cybersalt Page Protector je zdarma a open source a podpora je poskytována podle možností: na bezplatnou podporu máme omezený čas, takže odpověď může chvíli trvat. Pokud potřebujete zaručenou dobu odezvy nebo praktickou pomoc přímo na vašem webu, je k dispozici placená podpora přes formulář žádosti o podporu."
