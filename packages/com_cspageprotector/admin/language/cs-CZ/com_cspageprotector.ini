; Options - Protection
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION="Ochrana"
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_DESC="Které stránky dostanou kontrolu prohlížeče. Kontrola scrapování zpomalí a prodraží, ale nemůže slíbit, že váš obsah nebude nikdy zkopírován."
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_SUBTITLE="Vyberte, na kterých stránkách musí návštěvníci projít kontrolou"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_LABEL="Chránit"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_DESC="Chraňte jen vybrané položky menu, nebo chraňte celý web a vyberte položky menu, které zůstanou otevřené."
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_SELECTED="Pouze vybrané stránky"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_ALL_EXCEPT="Každou stránku kromě vybraných"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_LABEL="Položky menu"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_DESC="Stránky, na které se to vztahuje. Pokryto je i vše, co se zobrazuje pod položkou menu, například články otevřené z chráněného blogu kategorie."
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_LABEL="Zachytit i jiné cesty ke stejnému obsahu"
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_DESC="Scrapery se někdy ke stejnému článku dostanou přes jinou položku menu, prostý odkaz index.php, blog nebo seznam doporučených článků, seznam štítků, modul článků nebo kanál RSS. Když je tato volba zapnutá, je chráněný článek (nebo jakýkoli článek uvnitř chráněné kategorie) chráněn i na všech těchto místech: seznamy místo jeho textu zobrazí krátké upozornění a kanály, které by ho obsahovaly, jsou odmítnuty. Výsledky chytrého vyhledávání mohou stále zobrazit krátký úryvek, protože Joomla jej ukládá při indexování."

; Options - Challenge
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE="Kontrola"
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_DESC="Co návštěvníci uvidí a jak dlouho jejich propustka platí."
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_SUBTITLE="Samotná kontrola, její texty a doba platnosti propustky"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_LABEL="CAPTCHA"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_DESC="Který CAPTCHA plugin Joomla provádí kontrolu. Doporučujeme vlastní CAPTCHA Proof-of-Work od Joomla (Joomla 6.1+): žádná služba třetí strany, žádné cizí cookies a návštěvník nemusí nic klikat. Její obtížnost se nastavuje přímo v nastavení CAPTCHA pluginu. Místo ní lze použít jakýkoli jiný nainstalovaný CAPTCHA plugin."
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_DISABLED="%s (zakázán)"
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_POW_MISSING="CAPTCHA - Proof of Work (vyžaduje Joomla 6.1+, není nainstalován)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_LABEL="Pokud CAPTCHA nemůže běžet"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_DESC="Co se stane, když je vybraný CAPTCHA plugin zakázán nebo chybí. Vpuštění návštěvníků zachová web použitelný; blokování udrží obsah zamčený, ale každému návštěvníkovi zobrazí chybu."
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_ALLOW="Vpustit návštěvníky (a zaznamenat chybu)"
