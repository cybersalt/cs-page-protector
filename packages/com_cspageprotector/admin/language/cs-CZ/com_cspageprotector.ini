COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_DESC="Adresy nebo rozsahy vašich vlastních proxy nebo nástrojů pro vyrovnávání zátěže, jedna na řádek. Jejich hlavičce X-Forwarded-For / X-Real-IP se věří, hlavičce od kohokoli jiného ne. Pokud proxy běží na stejném serveru nebo v privátní síti, ponechte prázdné. Pro Cloudflare není potřeba."
