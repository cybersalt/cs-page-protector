; Options - Protection
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION="Schutz"
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_DESC="Welche Seiten die Browserprüfung erhalten."
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_SUBTITLE="Legen Sie fest, für welche Seiten Besucher eine Prüfung bestehen müssen"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_LABEL="Schützen"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_DESC="Schützen Sie nur die ausgewählten Menüeinträge, oder schützen Sie die ganze Website und wählen Sie die Menüeinträge aus, die offen bleiben sollen."
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_SELECTED="Nur die ausgewählten Seiten"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_ALL_EXCEPT="Alle Seiten außer den ausgewählten"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_LABEL="Menüeinträge"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_DESC="Die Seiten, für die dies gilt. Alles, was unter einem Menüeintrag angezeigt wird, ist ebenfalls abgedeckt, zum Beispiel die Beiträge, die aus einem geschützten Kategorieblog heraus geöffnet werden."
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_LABEL="Auch andere Wege zum selben Inhalt erfassen"
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_DESC="Scraper erreichen denselben Beitrag manchmal über einen anderen Menüeintrag, einen einfachen index.php-Link, einen Blog oder eine Liste der Haupteinträge, eine Schlagwortliste, ein Beitragsmodul oder einen Feed. Wenn diese Option aktiv ist, ist ein geschützter Beitrag (oder jeder Beitrag in einer geschützten Kategorie) auch an all diesen Stellen geschützt: Listen zeigen statt seines Textes einen kurzen Hinweis, und Feeds, die ihn enthalten würden, werden verweigert. Suchergebnisse von Smart Search können weiterhin einen kurzen Ausschnitt zeigen, weil Joomla diese beim Indexieren speichert."

; Options - Challenge
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE="Prüfung"
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_DESC="Was Besucher sehen und wie lange ihre Freigabe gilt."
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_SUBTITLE="Die Prüfung selbst, die Texte und wie lange eine Freigabe gilt"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_LABEL="Captcha"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_DESC="Welches Joomla-Captcha-Plugin die Prüfung durchführt. Empfohlen wird das Proof-of-Work-Captcha von Joomla selbst (Joomla 6.1+): kein Drittanbieterdienst, keine Cookies von anderen und nichts, was der Besucher anklicken muss. Der Schwierigkeitsgrad wird in den Einstellungen des Captcha-Plugins festgelegt. Stattdessen kann auch jedes andere installierte Captcha-Plugin verwendet werden."
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_DISABLED="%s (deaktiviert)"
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_POW_MISSING="CAPTCHA - Proof of Work (benötigt Joomla 6.1+, nicht installiert)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_LABEL="Wenn das Captcha nicht laufen kann"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_DESC="Was passiert, wenn das gewählte Captcha-Plugin deaktiviert ist oder fehlt. Besucher durchzulassen hält die Website nutzbar; Blockieren hält die Inhalte gesperrt, zeigt aber jedem Besucher eine Fehlermeldung."
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_ALLOW="Besucher durchlassen (und einen Fehler protokollieren)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_BLOCK="Seite blockieren"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_LABEL="Prüfung automatisch starten"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_DESC="Beginnt mit dem Lösen der Proof-of-Work-Aufgabe, sobald die Seite geladen ist, statt darauf zu warten, dass der Besucher das Kästchen anhakt. Gilt nur für das Proof-of-Work-Captcha."
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_LABEL="Nach dem Lösen automatisch fortfahren"
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_DESC="Leitet den Besucher zur Seite weiter, sobald die Prüfung gelöst ist, ohne dass er auf Weiter klicken muss. Gilt nur für das Proof-of-Work-Captcha."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_LABEL="Freigabe gilt"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_DESC="Nach einmaligem Bestehen kann ein Besucher so lange alle geschützten Seiten ohne erneute Prüfung öffnen."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_1H="1 Stunde"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_6H="6 Stunden"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_12H="12 Stunden"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_24H="24 Stunden"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_3D="3 Tage"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_7D="7 Tage"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_30D="30 Tage"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_LABEL="Freigabe an die IP des Besuchers binden"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_DESC="Macht eine kopierte Freigabe von jeder anderen Adresse aus nutzlos. Lassen Sie dies ausgeschaltet, wenn viele Ihrer Besucher Mobilfunknetze nutzen, in denen sich die IP-Adresse oft ändert und sie dann jedes Mal erneut geprüft würden."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_LABEL="HTTP-Status der Prüfseite"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_DESC="200 funktioniert überall. 403 teilt Bots deutlich mit, dass sie abgewiesen wurden, aber manche Hoster ersetzen 403-Seiten durch eine eigene Fehlerseite, wodurch echte Besucher die Prüfung nicht zu sehen bekämen. Testen Sie vor dem Umstellen."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_200="200 OK (empfohlen)"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_403="403 Forbidden"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_LABEL="Überschrift"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_DESC="Überschrift über der Prüfung. Leer lassen für den Standardtext."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_LABEL="Nachricht"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_DESC="Text unter der Überschrift. Einfaches HTML ist erlaubt. Leer lassen für den Standardtext."
COM_CSPAGEPROTECTOR_CHALLENGE_HEADING_DEFAULT="Ihr Browser wird überprüft"
COM_CSPAGEPROTECTOR_CHALLENGE_MESSAGE_DEFAULT="Das dauert nur einen Moment. Es hilft, automatisierte Scraper von dieser Seite fernzuhalten."

; Options - Exemptions
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS="Ausnahmen"
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_DESC="Wer die Prüfung überspringen darf."
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_SUBTITLE="Wer die Prüfung nie sieht"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_LABEL="Angemeldete Benutzer überspringen die Prüfung"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_DESC="Jeder, der auf der Website angemeldet ist, gelangt direkt zu geschützten Seiten. Schalten Sie dies aus, um nur bestimmte Benutzergruppen auszunehmen."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_LABEL="Benutzergruppen, die die Prüfung überspringen"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_DESC="Angemeldete Mitglieder dieser Gruppen (oder einer ihnen untergeordneten Gruppe) überspringen die Prüfung."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_LABEL="Verifizierte Suchmaschinen durchlassen"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_DESC="Googlebot, Bingbot, Applebot, YandexBot, Baiduspider und Yahoo Slurp überspringen die Prüfung, aber erst nachdem eine Reverse- und Forward-DNS-Abfrage bestätigt hat, dass die Anfrage wirklich von dieser Suchmaschine stammt. Ein Scraper, der sich nur als Googlebot ausgibt, wird weiterhin geprüft. KI-Crawler wie GPTBot und ClaudeBot stehen nicht auf dieser Liste. Wenn Sie dies ausschalten, verschwinden geschützte Seiten aus den Suchergebnissen."
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_LABEL="Besuche von Suchmaschinen protokollieren"
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_DESC="Schreibt jedes Mal einen Protokolleintrag, wenn eine verifizierte Suchmaschine durchgelassen wird. Standardmäßig aus, weil Crawler sehr häufig vorbeikommen."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_LABEL="IP-Adressen, die die Prüfung überspringen"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_DESC="Eine pro Zeile. Einzelne Adressen (203.0.113.7) und Bereiche (203.0.113.0/24, 2001:db8::/32) funktionieren beide. Zeilen, die mit # beginnen, werden ignoriert. Nützlich für Ihr Büro, Uptime-Monitore und Partner."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_HINT="203.0.113.7 oder 198.51.100.0/24"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_LABEL="Besucher-IP stammt aus"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_DESC="Ändern Sie dies nur, wenn die Website hinter einem Proxy oder CDN liegt. Dem gewählten Header wird nur vertraut, wenn die Anfrage tatsächlich über diesen Proxy kommt: bei Cloudflare über die eigenen Adressen von Cloudflare, bei den anderen über die Adressen unter \"Vertrauenswürdige Proxys\" (oder über einen Proxy auf demselben Server oder im privaten Netzwerk, wenn diese Liste leer ist). Sendet jemand anderes den Header, wird er ignoriert, sodass sich niemand als freigegebene Adresse ausgeben kann."
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_REMOTE_ADDR="Der Verbindung selbst (kein Proxy)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_CLOUDFLARE="Cloudflare (CF-Connecting-IP)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_XFF="Proxy / Load Balancer (X-Forwarded-For)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_X_REAL_IP="Nginx-Proxy (X-Real-IP)"

; Options - Logging
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING="Protokollierung"
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_DESC="Was in das Ereignisprotokoll geschrieben wird und wie lange."
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_SUBTITLE="Das Ereignisprotokoll hinter dem Dashboard"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_LABEL="Ereignisprotokoll führen"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_DESC="Zeichnet jede Prüfung, jedes Bestehen, jeden Fehlschlag und jede Blockierung auf. Das Dashboard und das Ereignisprotokoll benötigen dies."
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_LABEL="IP-Adressen kürzen"
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_DESC="Standardmäßig an. Speichert nur den Netzwerkteil jeder Adresse (203.0.113.0 statt 203.0.113.7), wodurch das Protokoll datenschutzfreundlicher im Sinne von Regeln wie der DSGVO ist. Der Schutz verwendet während der Anfrage weiterhin die vollständige Adresse; nur was gespeichert wird, ist gekürzt. Beim Einschalten werden auch die bereits im Protokoll vorhandenen Adressen gekürzt. Schalten Sie dies nur aus, wenn Sie genaue Adressen benötigen, zum Beispiel um eine einzelne IP-Adresse in Ihrer Firewall zu sperren."
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_LABEL="Einträge aufbewahren (Tage)"
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_DESC="Ältere Einträge werden automatisch gelöscht. 0 bewahrt sie für immer auf."

; Options - Support
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT="Support"
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_DESC="An wen man sich wendet, wenn etwas schiefgeht."
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_SUBTITLE="Support-Kontaktdaten, die im Dashboard angezeigt werden (niemals für Besucher der Website)"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_LABEL="Support-E-Mail"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_DESC="Wird im Dashboard angezeigt, damit Administratoren wissen, an wen sie sich wenden können. Wird Besuchern der Website nie angezeigt."
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_LABEL="Support-Seite"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_DESC="Link zu einem Kontaktformular oder einer Hilfeseite."
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_LABEL_LABEL="Name des Supports"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_LABEL_DESC="Wie der Support in Meldungen genannt wird, zum Beispiel \"Cybersalt-Support\" oder \"das Website-Team\"."

; Challenge page strings also used from admin (shared helpers)
COM_CSPAGEPROTECTOR_CHALLENGE_CONTINUE="Weiter"
COM_CSPAGEPROTECTOR_CHALLENGE_WORKING="Ihr Browser wird überprüft ..."
COM_CSPAGEPROTECTOR_CHALLENGE_DONE="Fertig - Sie werden zur Seite weitergeleitet."
COM_CSPAGEPROTECTOR_CHALLENGE_EXPIRED="Die Prüfung ist abgelaufen. Bitte versuchen Sie es erneut."
COM_CSPAGEPROTECTOR_CHALLENGE_FAILED="Die Prüfung ist nicht durchgegangen. Bitte versuchen Sie es erneut."
COM_CSPAGEPROTECTOR_CHALLENGE_UNAVAILABLE="Die Browserprüfung ist gerade nicht verfügbar. Bitte versuchen Sie es später erneut."
COM_CSPAGEPROTECTOR_CHALLENGE_NOSCRIPT="Für diese Seite muss JavaScript aktiviert sein, um die Prüfung abzuschließen."
COM_CSPAGEPROTECTOR_CHALLENGE_WHY="Warum sehe ich das?"
COM_CSPAGEPROTECTOR_CHALLENGE_WHY_BODY="Diese Website bittet Ihren Browser, ein kleines Rätsel zu lösen, bevor einige Seiten angezeigt werden. Für einen Menschen dauert das eine Sekunde, für automatisierte Tools wird es dadurch aber teuer, die ganze Website zu kopieren. Sie werden für eine Weile nicht erneut gefragt."

; Options - Modules
COM_CSPAGEPROTECTOR_FIELDSET_MODULES="Module"
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_DESC="Schützt den Inhalt von Modulen auf jeder Seite, auf der sie erscheinen. Solange Module oder Inhalte geschützt sind, werden Joomlas eigener Ansichts- und Modulcache umgangen, damit eine zwischengespeicherte Kopie nie einen Besucher erreicht, der die Prüfung nicht bestanden hat. Der Seitencache wird gesondert behandelt und funktioniert für andere Seiten weiter."
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_SUBTITLE="Halten Sie Modulinhalte von Scrapern fern, auch auf Seiten, die nicht geschützt sind"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_LABEL="Geschützte Module"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_DESC="Diese Module werden nur Besuchern angezeigt, die die Prüfung bestanden haben (oder sie überspringen: angemeldete Benutzer, freigegebene IP-Adressen, verifizierte Suchmaschinen), und zwar auf jeder Seite, auf der sie erscheinen. Nützlich für Kontaktdaten, Preise oder Mitgliederinformationen in einer Fußzeile oder Seitenleiste."
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_LABEL="Geschützte Modulpositionen"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_DESC="Jedes Modul an diesen Positionen ist geschützt, auch Module, die später dort hinzugefügt werden."
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES="%2$s (%1$d Module)"
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES_1="%2$s (1 Modul)"
COM_CSPAGEPROTECTOR_NO_POSITION="(keine Position)"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_LABEL="Besucher, die die Prüfung nicht bestanden haben, sehen"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_DESC="Ein Platzhalter behält den Titel und den Rahmen des Moduls bei, mit einer Schaltfläche \"Inhalt anzeigen\", die die Prüfung durchführt und direkt zurückkehrt. Beim Ausblenden wird das Modul vollständig entfernt, sodass sich seine Position schließt; Besucher sehen es dann erst, nachdem sie die Prüfung an anderer Stelle bestanden haben, zum Beispiel auf einer geschützten Seite. In beiden Fällen wird das Captcha nie innerhalb eines Moduls angezeigt, sodass eine Seite nie mehr als eines hat."
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_PLACEHOLDER="Einen Platzhalter mit einer Schaltfläche \"Inhalt anzeigen\""
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_HIDE="Nichts: das Modul vollständig ausblenden"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_LABEL="Platzhaltertext"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_DESC="Wird anstelle des Modulinhalts angezeigt. Leer lassen für den Standardtext."
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_LABEL="Beschriftung der Schaltfläche"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_DESC="Beschriftung der Schaltfläche, die die Prüfung durchführt. Leer lassen für den Standardtext."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_TEXT_DEFAULT="Dieser Inhalt erscheint nach einer kurzen Browserprüfung."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_BUTTON_DEFAULT="Inhalt anzeigen"

; Dashboard - modules
COM_CSPAGEPROTECTOR_DASHBOARD_PROTECTED_MODULES="Geschützte Module"
COM_CSPAGEPROTECTOR_DASHBOARD_NO_MODULES="Es sind keine Module geschützt. Wählen Sie Module oder Positionen im Tab Module in den Optionen aus."
COM_CSPAGEPROTECTOR_HEADING_MODULE="Modul"
COM_CSPAGEPROTECTOR_HEADING_POSITION="Position"
COM_CSPAGEPROTECTOR_PROTECTED_BY_POSITION="ganze Position"
COM_CSPAGEPROTECTOR_CHOOSE_MODULES="Module auswählen"
COM_CSPAGEPROTECTOR_CHECK_MODULES_N="%d Module sind geschützt."
COM_CSPAGEPROTECTOR_CHECK_MODULES_N_1="1 Modul ist geschützt."
COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_LABEL="Vertrauenswürdige Proxys"
COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_DESC="Die Adressen oder Bereiche Ihrer eigenen Proxys oder Load Balancer, eine pro Zeile. Deren Header X-Forwarded-For / X-Real-IP wird vertraut, dem von anderen nicht. Leer lassen, wenn der Proxy auf demselben Server oder in einem privaten Netzwerk läuft. Für Cloudflare nicht nötig."
COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_HINT="10.0.0.0/8 oder 192.0.2.10"
