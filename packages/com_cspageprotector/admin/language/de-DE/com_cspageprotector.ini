COM_CSPAGEPROTECTOR_ACL_VIEW_DESC="Erlaubt Benutzern dieser Gruppe, das Page-Protector-Dashboard zu öffnen und das Ereignisprotokoll zu lesen."
COM_CSPAGEPROTECTOR_ACL_WRITE="Ereignisprotokoll verwalten"
COM_CSPAGEPROTECTOR_ACL_WRITE_DESC="Erlaubt Benutzern dieser Gruppe, Einträge im Ereignisprotokoll zu löschen und das Protokoll zu leeren."

; Dashboard
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_HEADING="So funktioniert Page Protector"
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_BODY="Besucher einer geschützten Seite sehen zuerst eine kurze Browserprüfung. Ihr Browser löst ein kleines Proof-of-Work-Rätsel (für einen Menschen etwa eine Sekunde, für einen Scraper, der Tausende Seiten abruft, echter CPU-Aufwand). Danach erhalten sie eine Freigabe und können geschützte Seiten ganz normal aufrufen, bis diese abläuft. Angemeldete Benutzer, freigegebene IP-Adressen und verifizierte Suchmaschinen können die Prüfung überspringen."
COM_CSPAGEPROTECTOR_DASHBOARD_HEALTH="Status"
COM_CSPAGEPROTECTOR_DASHBOARD_LAST_24H="Letzte 24 Stunden"
COM_CSPAGEPROTECTOR_DASHBOARD_ALL_TIME="Insgesamt %d Ereignisse im Protokoll - Ereignisprotokoll öffnen"
COM_CSPAGEPROTECTOR_DASHBOARD_PROTECTED_PAGES="Geschützte Seiten"
COM_CSPAGEPROTECTOR_DASHBOARD_EXCLUDED_PAGES="Ungeschützte Seiten"
COM_CSPAGEPROTECTOR_DASHBOARD_NO_PAGES="Es sind noch keine Seiten geschützt. Wählen Sie die zu schützenden Menüeinträge in den Optionen aus."
COM_CSPAGEPROTECTOR_DASHBOARD_NO_EXCLUDED_PAGES="Alle Seiten der Website sind geschützt. Fügen Sie in den Optionen Menüeinträge hinzu, um diese offen zu lassen."
COM_CSPAGEPROTECTOR_DASHBOARD_TOP_IPS="Am häufigsten geprüfte IP-Adressen (7 Tage)"
COM_CSPAGEPROTECTOR_DASHBOARD_TOP_IPS_HINT="Viele Prüfungen ohne eine einzige bestandene deuten meist auf einen Scraper hin. Die Kopieren-Schaltfläche liefert Ihnen die Adresse (oder ihren Bereich, wenn IP-Adressen gekürzt werden), fertig zum Sperren in Ihrer Firewall."
COM_CSPAGEPROTECTOR_DASHBOARD_RECENT="Neueste Ereignisse"
