COM_CSPAGEPROTECTOR_CLEAR_MY_PASS_DESC="Vergisst die Freigabe nur in diesem Browser, damit Sie die Prüfung beim Testen erneut sehen"
COM_CSPAGEPROTECTOR_CLEAR_MY_PASS_DONE="Die Freigabe in diesem Browser wurde gelöscht. Öffnen Sie eine geschützte Seite, während Sie im Frontend abgemeldet sind (angemeldete Benutzer überspringen die Prüfung), um die Prüfung erneut zu sehen."
