COM_CSPAGEPROTECTOR_CHECK_CLOUDFLARE="Diese Website scheint hinter Cloudflare zu laufen, aber Page Protector liest die IP-Adresse der Verbindung. Jeder Besucher erscheint dann mit einer Cloudflare-Adresse, und die IP-Freigabeliste funktioniert nicht. Stellen Sie in den Optionen \"Besucher-IP stammt aus\" auf Cloudflare."
