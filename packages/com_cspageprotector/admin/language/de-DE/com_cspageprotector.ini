; Support
COM_CSPAGEPROTECTOR_SUPPORT_HEADING="Hilfe und Support"
COM_CSPAGEPROTECTOR_SUPPORT_COMMUNITY_HEADING="Wir freuen uns, von Ihnen zu hören"
COM_CSPAGEPROTECTOR_SUPPORT_COMMUNITY_BODY="Schicken Sie uns Ihre Fehlerberichte, Funktionswünsche, Fragen und Ideen - wir lesen jede Nachricht und sind dankbar für Rückmeldungen. Cybersalt Page Protector ist kostenlos und Open Source, und der Support dafür erfolgt nach bestem Bemühen: Unsere Zeit für kostenlosen Support ist begrenzt, daher kann eine Antwort etwas dauern. Wenn Sie eine garantierte Antwortzeit oder direkte Hilfe auf Ihrer Website benötigen, ist kostenpflichtiger Support über das Support-Anfrageformular erhältlich."
