COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_DESC="Προστατέψτε μόνο τα στοιχεία μενού που επιλέγετε ή προστατέψτε ολόκληρο τον ιστότοπο και επιλέξτε τα στοιχεία μενού που θα μείνουν ανοιχτά."
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_SELECTED="Μόνο οι επιλεγμένες σελίδες"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_ALL_EXCEPT="Όλες οι σελίδες εκτός από τις επιλεγμένες"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_LABEL="Στοιχεία μενού"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_DESC="Οι σελίδες στις οποίες εφαρμόζεται. Καλύπτεται επίσης ό,τι εμφανίζεται κάτω από ένα στοιχείο μενού, για παράδειγμα τα άρθρα που ανοίγουν από ένα προστατευμένο ιστολόγιο κατηγορίας."
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_LABEL="Εντοπισμός και άλλων διαδρομών προς το ίδιο περιεχόμενο"
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_DESC="Τα scrapers μερικές φορές φτάνουν στο ίδιο άρθρο μέσω άλλου στοιχείου μενού, ενός απλού συνδέσμου index.php, ενός ιστολογίου ή λίστας προβεβλημένων άρθρων, μιας λίστας ετικετών, ενός ενθέματος άρθρων ή μιας ροής RSS. Με αυτή την επιλογή ενεργή, ένα προστατευμένο άρθρο (ή οποιοδήποτε άρθρο μέσα σε προστατευμένη κατηγορία) προστατεύεται και σε όλα αυτά: οι λίστες δείχνουν μια σύντομη ειδοποίηση αντί για το κείμενό του και οι ροές που θα το περιλάμβαναν απορρίπτονται. Τα αποτελέσματα της Έξυπνης αναζήτησης μπορεί ακόμη να δείχνουν ένα σύντομο απόσπασμα, επειδή το Joomla το αποθηκεύει κατά τη δημιουργία του ευρετηρίου."

; Options - Challenge
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE="Έλεγχος"
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_DESC="Τι βλέπουν οι επισκέπτες και πόσο διαρκεί η άδειά τους."
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_SUBTITLE="Ο ίδιος ο έλεγχος, η διατύπωση και η διάρκεια της άδειας"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_LABEL="Captcha"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_DESC="Ποιο πρόσθετο captcha του Joomla εκτελεί τον έλεγχο. Συνιστάται το ενσωματωμένο captcha Proof-of-Work του Joomla (Joomla 6.1+): καμία υπηρεσία τρίτων, κανένα cookie από άλλους και τίποτα για να πατήσει ο επισκέπτης. Η δυσκολία του ορίζεται στις ρυθμίσεις του ίδιου του πρόσθετου captcha. Μπορεί να χρησιμοποιηθεί και οποιοδήποτε άλλο εγκατεστημένο πρόσθετο captcha."
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_DISABLED="%s (απενεργοποιημένο)"
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_POW_MISSING="CAPTCHA - Proof of Work (απαιτεί Joomla 6.1+, δεν είναι εγκατεστημένο)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_LABEL="Αν το captcha δεν μπορεί να εκτελεστεί"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_DESC="Τι συμβαίνει όταν το επιλεγμένο πρόσθετο captcha είναι απενεργοποιημένο ή λείπει. Αν αφήνετε τους επισκέπτες να περνούν, ο ιστότοπος παραμένει λειτουργικός· ο αποκλεισμός κρατά το περιεχόμενο κλειδωμένο, αλλά δείχνει σφάλμα σε κάθε επισκέπτη."
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_ALLOW="Οι επισκέπτες περνούν (και καταγράφεται σφάλμα)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_BLOCK="Αποκλεισμός της σελίδας"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_LABEL="Αυτόματη έναρξη του ελέγχου"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_DESC="Η επίλυση του proof-of-work ξεκινά μόλις φορτωθεί η σελίδα, αντί να περιμένει τον επισκέπτη να τσεκάρει το πλαίσιο. Ισχύει μόνο για το captcha Proof-of-Work."
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_LABEL="Αυτόματη συνέχεια μετά την επίλυση"
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_DESC="Ο επισκέπτης μεταφέρεται στη σελίδα μόλις λυθεί ο έλεγχος, χωρίς να χρειάζεται να πατήσει Συνέχεια. Ισχύει μόνο για το captcha Proof-of-Work."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_LABEL="Διάρκεια άδειας"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_DESC="Αφού περάσει τον έλεγχο μία φορά, ο επισκέπτης μπορεί για αυτό το διάστημα να ανοίγει κάθε προστατευμένη σελίδα χωρίς νέο έλεγχο."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_1H="1 ώρα"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_6H="6 ώρες"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_12H="12 ώρες"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_24H="24 ώρες"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_3D="3 ημέρες"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_7D="7 ημέρες"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_30D="30 ημέρες"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_LABEL="Σύνδεση της άδειας με την IP του επισκέπτη"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_DESC="Μια αντιγραμμένη άδεια γίνεται άχρηστη από οποιαδήποτε άλλη διεύθυνση. Αφήστε το απενεργοποιημένο αν πολλοί επισκέπτες σας χρησιμοποιούν δίκτυα κινητής τηλεφωνίας, όπου η IP αλλάζει συχνά και θα ελέγχονταν ξανά κάθε φορά."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_LABEL="Κωδικός κατάστασης HTTP της σελίδας ελέγχου"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_DESC="Το 200 λειτουργεί παντού. Το 403 λέει ξεκάθαρα στα bots ότι απορρίφθηκαν, αλλά ορισμένοι πάροχοι φιλοξενίας αντικαθιστούν τις σελίδες 403 με δική τους σελίδα σφάλματος, κάτι που θα έκρυβε τον έλεγχο από τους πραγματικούς επισκέπτες. Δοκιμάστε πριν το αλλάξετε."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_200="200 OK (συνιστάται)"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_403="403 Forbidden"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_LABEL="Επικεφαλίδα"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_DESC="Επικεφαλίδα που εμφανίζεται πάνω από τον έλεγχο. Αφήστε το κενό για την προεπιλογή."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_LABEL="Μήνυμα"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_DESC="Κείμενο που εμφανίζεται κάτω από την επικεφαλίδα. Επιτρέπεται βασική HTML. Αφήστε το κενό για την προεπιλογή."
COM_CSPAGEPROTECTOR_CHALLENGE_HEADING_DEFAULT="Έλεγχος του προγράμματος περιήγησής σας"
COM_CSPAGEPROTECTOR_CHALLENGE_MESSAGE_DEFAULT="Θα πάρει μόνο μια στιγμή. Βοηθά να μένουν τα αυτοματοποιημένα scrapers μακριά από αυτή τη σελίδα."

; Options - Exemptions
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS="Εξαιρέσεις"
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_DESC="Ποιος μπορεί να παρακάμψει τον έλεγχο."
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_SUBTITLE="Ποιος δεν βλέπει ποτέ τον έλεγχο"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_LABEL="Οι συνδεδεμένοι χρήστες παρακάμπτουν τον έλεγχο"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_DESC="Όποιος είναι συνδεδεμένος στον ιστότοπο πηγαίνει κατευθείαν στις προστατευμένες σελίδες. Απενεργοποιήστε το για να εξαιρέσετε μόνο ορισμένες ομάδες χρηστών."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_LABEL="Ομάδες χρηστών που παρακάμπτουν τον έλεγχο"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_DESC="Τα συνδεδεμένα μέλη αυτών των ομάδων (ή οποιασδήποτε υποομάδας τους) παρακάμπτουν τον έλεγχο."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_LABEL="Να περνούν οι επαληθευμένες μηχανές αναζήτησης"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_DESC="Τα Googlebot, Bingbot, Applebot, YandexBot, Baiduspider και Yahoo Slurp παρακάμπτουν τον έλεγχο, αλλά μόνο αφού ένας αντίστροφος και ευθύς έλεγχος DNS αποδείξει ότι το αίτημα προέρχεται πράγματι από τη συγκεκριμένη μηχανή αναζήτησης. Ένα scraper που απλώς δηλώνει ότι είναι Googlebot ελέγχεται κανονικά. Οι crawlers τεχνητής νοημοσύνης, όπως οι GPTBot και ClaudeBot, δεν περιλαμβάνονται σε αυτή τη λίστα. Αν το απενεργοποιήσετε, οι προστατευμένες σελίδες θα εξαφανιστούν από τα αποτελέσματα αναζήτησης."
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_LABEL="Καταγραφή επισκέψεων μηχανών αναζήτησης"
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_DESC="Γράφεται μια εγγραφή στο αρχείο κάθε φορά που περνά μια επαληθευμένη μηχανή αναζήτησης. Απενεργοποιημένο από προεπιλογή, επειδή οι crawlers επισκέπτονται πολύ συχνά."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_LABEL="Διευθύνσεις IP που παρακάμπτουν τον έλεγχο"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_DESC="Μία ανά γραμμή. Λειτουργούν και μεμονωμένες διευθύνσεις (203.0.113.7) και εύρη (203.0.113.0/24, 2001:db8::/32). Οι γραμμές που ξεκινούν με # αγνοούνται. Χρήσιμο για το γραφείο σας, υπηρεσίες παρακολούθησης διαθεσιμότητας και συνεργάτες."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_HINT="203.0.113.7 ή 198.51.100.0/24"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_LABEL="Η IP του επισκέπτη προέρχεται από"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_DESC="Αλλάξτε το μόνο αν ο ιστότοπος βρίσκεται πίσω από διακομιστή μεσολάβησης (proxy) ή CDN. Η κεφαλίδα που επιλέγετε γίνεται δεκτή μόνο όταν το αίτημα περνά πραγματικά από αυτό το proxy: για το Cloudflare, από τις διευθύνσεις του ίδιου του Cloudflare· για τα υπόλοιπα, από τις διευθύνσεις στο πεδίο «Αξιόπιστα proxy» (ή από proxy στον ίδιο διακομιστή ή σε ιδιωτικό δίκτυο, όταν το πεδίο είναι κενό). Αν την κεφαλίδα τη στείλει οποιοσδήποτε άλλος, αγνοείται, οπότε κανείς δεν μπορεί να παραστήσει μια επιτρεπόμενη διεύθυνση."
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_REMOTE_ADDR="Η ίδια η σύνδεση (χωρίς proxy)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_CLOUDFLARE="Cloudflare (CF-Connecting-IP)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_XFF="Proxy / εξισορρόπηση φορτίου (X-Forwarded-For)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_X_REAL_IP="Proxy Nginx (X-Real-IP)"

; Options - Logging
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING="Καταγραφή"
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_DESC="Τι γράφεται στο αρχείο συμβάντων και για πόσο διάστημα."
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_SUBTITLE="Το αρχείο συμβάντων πίσω από τον πίνακα ελέγχου"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_LABEL="Τήρηση αρχείου συμβάντων"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_DESC="Καταγράφεται κάθε έλεγχος, επιτυχία, αποτυχία και αποκλεισμός. Ο πίνακας ελέγχου και το αρχείο συμβάντων το χρειάζονται."
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_LABEL="Συντόμευση διευθύνσεων IP"
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_DESC="Ενεργό από προεπιλογή. Αποθηκεύεται μόνο το τμήμα δικτύου κάθε διεύθυνσης (203.0.113.0 αντί για 203.0.113.7), ώστε το αρχείο να συμβαδίζει καλύτερα με κανόνες απορρήτου όπως ο ΓΚΠΔ (GDPR). Η προστασία εξακολουθεί να χρησιμοποιεί την πλήρη διεύθυνση όσο εκτελείται το αίτημα· συντομεύεται μόνο ό,τι αποθηκεύεται. Η ενεργοποίηση συντομεύει επίσης τις διευθύνσεις που υπάρχουν ήδη στο αρχείο. Απενεργοποιήστε το μόνο αν χρειάζεστε ακριβείς διευθύνσεις, για παράδειγμα για να αποκλείσετε μία IP στο τείχος προστασίας σας."
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_LABEL="Διατήρηση εγγραφών για (ημέρες)"
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_DESC="Οι παλαιότερες εγγραφές διαγράφονται αυτόματα. Με 0 διατηρούνται για πάντα."

; Options - Support
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT="Υποστήριξη"
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_DESC="Με ποιον να επικοινωνήσετε όταν κάτι πάει στραβά."
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_SUBTITLE="Στοιχεία επικοινωνίας υποστήριξης που εμφανίζονται στον πίνακα ελέγχου (ποτέ στους επισκέπτες του ιστότοπου)"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_LABEL="Email υποστήριξης"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_DESC="Εμφανίζεται στον πίνακα ελέγχου, ώστε οι διαχειριστές του ιστότοπου να ξέρουν με ποιον να επικοινωνήσουν. Δεν εμφανίζεται ποτέ στους επισκέπτες του ιστότοπου."
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_LABEL="Σελίδα υποστήριξης"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_DESC="Σύνδεσμος προς φόρμα επικοινωνίας ή σελίδα βοήθειας."
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_LABEL_LABEL="Όνομα υποστήριξης"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_LABEL_DESC="Πώς αναφέρεται η υποστήριξη στα μηνύματα, για παράδειγμα «Υποστήριξη Cybersalt» ή «η ομάδα του ιστότοπου»."

; Challenge page strings also used from admin (shared helpers)
COM_CSPAGEPROTECTOR_CHALLENGE_CONTINUE="Συνέχεια"
COM_CSPAGEPROTECTOR_CHALLENGE_WORKING="Έλεγχος του προγράμματος περιήγησής σας..."
COM_CSPAGEPROTECTOR_CHALLENGE_DONE="Έγινε - σας μεταφέρουμε στη σελίδα."
COM_CSPAGEPROTECTOR_CHALLENGE_EXPIRED="Ο έλεγχος έληξε. Δοκιμάστε ξανά."
COM_CSPAGEPROTECTOR_CHALLENGE_FAILED="Ο έλεγχος δεν ολοκληρώθηκε. Δοκιμάστε ξανά."
COM_CSPAGEPROTECTOR_CHALLENGE_UNAVAILABLE="Ο έλεγχος του προγράμματος περιήγησης δεν είναι διαθέσιμος αυτή τη στιγμή. Δοκιμάστε ξανά αργότερα."
COM_CSPAGEPROTECTOR_CHALLENGE_NOSCRIPT="Αυτή η σελίδα χρειάζεται ενεργοποιημένη JavaScript για να ολοκληρωθεί ο έλεγχος."
COM_CSPAGEPROTECTOR_CHALLENGE_WHY="Γιατί το βλέπω αυτό;"
COM_CSPAGEPROTECTOR_CHALLENGE_WHY_BODY="Αυτός ο ιστότοπος ζητά από το πρόγραμμα περιήγησής σας να λύσει έναν μικρό γρίφο πριν εμφανίσει ορισμένες σελίδες. Σε έναν άνθρωπο παίρνει ένα δευτερόλεπτο, αλλά κάνει ακριβή την αντιγραφή ολόκληρου του ιστότοπου από αυτοματοποιημένα εργαλεία. Δεν θα σας ζητηθεί ξανά για αρκετό καιρό."

; Options - Modules
COM_CSPAGEPROTECTOR_FIELDSET_MODULES="Ενθέματα"
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_DESC="Προστασία του περιεχομένου των ενθεμάτων σε κάθε σελίδα όπου εμφανίζονται. Όσο προστατεύονται ενθέματα ή περιεχόμενο, η προσωρινή αποθήκευση προβολών και ενθεμάτων του Joomla παρακάμπτεται, ώστε ένα αποθηκευμένο αντίγραφο να μη φτάσει ποτέ σε επισκέπτη που δεν έχει περάσει τον έλεγχο. Η προσωρινή αποθήκευση σελίδων αντιμετωπίζεται ξεχωριστά και συνεχίζει να λειτουργεί για τις άλλες σελίδες."
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_SUBTITLE="Κρατήστε το περιεχόμενο των ενθεμάτων μακριά από scrapers, ακόμη και σε σελίδες χωρίς προστασία"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_LABEL="Προστατευμένα ενθέματα"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_DESC="Αυτά τα ενθέματα εμφανίζονται μόνο σε επισκέπτες που έχουν περάσει τον έλεγχο (ή τον παρακάμπτουν: συνδεδεμένοι χρήστες, επιτρεπόμενες IP, επαληθευμένες μηχανές αναζήτησης), σε κάθε σελίδα όπου εμφανίζονται. Χρήσιμο για στοιχεία επικοινωνίας, τιμές ή πληροφορίες μελών σε υποσέλιδο ή πλαϊνή στήλη."
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_LABEL="Προστατευμένες θέσεις ενθεμάτων"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_DESC="Προστατεύεται κάθε ένθεμα σε αυτές τις θέσεις, ακόμη και όσα προστεθούν εκεί αργότερα."
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES="%2$s (%1$d ενθέματα)"
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES_1="%2$s (1 ένθεμα)"
COM_CSPAGEPROTECTOR_NO_POSITION="(χωρίς θέση)"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_LABEL="Οι επισκέπτες που δεν έχουν περάσει τον έλεγχο βλέπουν"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_DESC="Ένα σύμβολο κράτησης θέσης διατηρεί τον τίτλο και το πλαίσιο του ενθέματος με ένα κουμπί «Εμφάνιση περιεχομένου» που εκτελεί τον έλεγχο και επιστρέφει αμέσως. Η απόκρυψη αφαιρεί εντελώς το ένθεμα, οπότε η θέση του κλείνει· οι επισκέπτες το βλέπουν τότε μόνο αφού περάσουν τον έλεγχο κάπου αλλού, για παράδειγμα σε μια προστατευμένη σελίδα. Σε κάθε περίπτωση το captcha δεν εμφανίζεται ποτέ μέσα σε ένθεμα, οπότε μια σελίδα δεν έχει ποτέ περισσότερα από ένα."
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_PLACEHOLDER="Ένα σύμβολο κράτησης θέσης με κουμπί «Εμφάνιση περιεχομένου»"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_HIDE="Τίποτα: το ένθεμα κρύβεται εντελώς"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_LABEL="Κείμενο κράτησης θέσης"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_DESC="Εμφανίζεται στη θέση του περιεχομένου του ενθέματος. Αφήστε το κενό για την προεπιλογή."
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_LABEL="Ετικέτα κουμπιού"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_DESC="Ετικέτα του κουμπιού που εκτελεί τον έλεγχο. Αφήστε το κενό για την προεπιλογή."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_TEXT_DEFAULT="Αυτό το περιεχόμενο εμφανίζεται μετά από έναν γρήγορο έλεγχο του προγράμματος περιήγησης."
