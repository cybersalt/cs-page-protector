COM_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Από την <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Τοποθετεί έναν έλεγχο proof-of-work μπροστά από τις σελίδες που επιλέγετε, ώστε τα scrapers να πρέπει να ξοδέψουν πραγματικό υπολογιστικό χρόνο πριν πάρουν το περιεχόμενό σας. Οι πραγματικοί επισκέπτες βλέπουν μία φορά ένα σύντομο βήμα &quot;έλεγχος του προγράμματος περιήγησης&quot; και μετά περιηγούνται κανονικά. Για Joomla 5 και 6 (το ενσωματωμένο captcha Proof-of-Work απαιτεί Joomla 6.1 ή νεότερο)."

