; Dashboard
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_HEADING="Πώς λειτουργεί το Page Protector"
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_BODY="Οι επισκέπτες μιας προστατευμένης σελίδας βλέπουν πρώτα έναν σύντομο έλεγχο του προγράμματος περιήγησης. Το πρόγραμμα περιήγησής τους λύνει έναν μικρό γρίφο proof-of-work (περίπου ένα δευτερόλεπτο για έναν άνθρωπο, πραγματικό κόστος CPU για ένα scraper που επισκέπτεται χιλιάδες σελίδες), και μετά παίρνουν μια άδεια πρόσβασης και περιηγούνται κανονικά στις προστατευμένες σελίδες μέχρι να λήξει. Οι συνδεδεμένοι χρήστες, οι επιτρεπόμενες διευθύνσεις IP και οι επαληθευμένες μηχανές αναζήτησης μπορούν να παρακάμψουν τον έλεγχο."
COM_CSPAGEPROTECTOR_NO_GUARANTEE_LABEL="Καμία εγγύηση."
COM_CSPAGEPROTECTOR_NO_GUARANTEE_BODY="Τα bots και οι χάκερ είναι επίμονοι. Το Cybersalt Page Protector κάνει ό,τι μπορεί για να προστατεύσει το περιεχόμενό σας, αλλά δεν μπορούμε να εγγυηθούμε ότι κακόβουλοι χρήστες δεν θα βρουν άλλο τρόπο να το παρακάμψουν. Όπως πάντα: αν υπάρχουν πληροφορίες που δεν θέλετε να βρίσκονται στο διαδίκτυο, μην τις ανεβάζετε στο διαδίκτυο."
COM_CSPAGEPROTECTOR_NOTICE_ACCEPT="Κατάλαβα, να μην εμφανιστεί ξανά"
COM_CSPAGEPROTECTOR_NOTICE_ADMIN_ONLY="Αυτή την ειδοποίηση πρέπει να την αποδεχτεί ένας διαχειριστής που μπορεί να αλλάξει τις Επιλογές του Page Protector."
COM_CSPAGEPROTECTOR_NOTICE_ACCEPTED="Έγινε αποδεκτή από %1$s στις %2$s."
COM_CSPAGEPROTECTOR_NOTICE_ACCEPTED_DONE="Ευχαριστούμε. Αυτή η ειδοποίηση δεν θα εμφανιστεί ξανά σε αυτόν τον ιστότοπο."
