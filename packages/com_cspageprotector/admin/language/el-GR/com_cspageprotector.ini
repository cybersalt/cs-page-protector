COM_CSPAGEPROTECTOR_SUPPORT_COMMUNITY_HEADING="Χαιρόμαστε να ακούμε τη γνώμη σας"
COM_CSPAGEPROTECTOR_SUPPORT_COMMUNITY_BODY="Στείλτε μας αναφορές σφαλμάτων, αιτήματα για νέες λειτουργίες, ερωτήσεις και ιδέες - διαβάζουμε κάθε μήνυμα και εκτιμούμε τα σχόλιά σας. Το Cybersalt Page Protector είναι δωρεάν και ανοιχτού κώδικα, και η υποστήριξή του παρέχεται στο μέτρο του δυνατού: ο χρόνος μας για δωρεάν υποστήριξη είναι περιορισμένος, οπότε οι απαντήσεις μπορεί να αργήσουν. Αν χρειάζεστε εγγυημένο χρόνο απόκρισης ή πρακτική βοήθεια στον ιστότοπό σας, διατίθεται υποστήριξη επί πληρωμή μέσω της φόρμας αιτήματος υποστήριξης."
