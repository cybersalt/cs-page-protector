; Dashboard
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_HEADING="How Page Protector works"
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_BODY="Visitors to a protected page see a short browser check first. Their browser solves a small proof-of-work puzzle (about a second for a person, real CPU cost for a scraper hitting thousands of pages), then they get a pass and browse protected pages normally until it expires. Logged-in users, allow-listed IPs and verified search engines can skip the check."
