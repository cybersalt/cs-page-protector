COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_30D="30 days"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_LABEL="Tie the pass to the visitor's IP"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_DESC="Makes a copied pass useless from any other address. Leave this off if many of your visitors are on mobile networks, where the IP changes often and they'd be checked again each time."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_LABEL="HTTP status of the check page"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_DESC="200 works everywhere. 403 tells bots plainly that they were refused, but some hosts replace 403 pages with their own error page, which would hide the check from real visitors. Test before switching."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_200="200 OK (recommended)"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_403="403 Forbidden"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_LABEL="Heading"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_DESC="Heading shown above the check. Leave empty for the default."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_LABEL="Message"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_DESC="Text shown under the heading. Basic HTML is allowed. Leave empty for the default."
COM_CSPAGEPROTECTOR_CHALLENGE_HEADING_DEFAULT="Checking your browser"
COM_CSPAGEPROTECTOR_CHALLENGE_MESSAGE_DEFAULT="This only takes a moment. It helps keep automated scrapers away from this page."

; Options - Exemptions
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS="Exemptions"
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_DESC="Who can skip the check."
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_SUBTITLE="Who never sees the check"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_LABEL="Logged-in users skip the check"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_DESC="Anyone logged in to the site goes straight to protected pages. Turn this off to exempt only some user groups."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_LABEL="User groups that skip the check"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_DESC="Logged-in members of these groups (or any group below them) skip the check."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_LABEL="Let verified search engines in"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_DESC="Googlebot, Bingbot, Applebot, YandexBot, Baiduspider and Yahoo Slurp skip the check, but only after a reverse-and-forward DNS lookup proves the request really comes from that search engine. A scraper that just claims to be Googlebot is still checked. AI crawlers such as GPTBot and ClaudeBot are not on this list. Turn this off and protected pages will drop out of search results."
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_LABEL="Log search engine visits"
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_DESC="Write a log entry each time a verified search engine is let in. Off by default because crawlers visit a lot."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_LABEL="IP addresses that skip the check"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_DESC="One per line. Single addresses (203.0.113.7) and ranges (203.0.113.0/24, 2001:db8::/32) both work. Lines starting with # are ignored. Useful for your office, uptime monitors and partners."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_HINT="203.0.113.7 or 198.51.100.0/24"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_LABEL="Visitor IP comes from"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_DESC="Only change this if the site sits behind a proxy or CDN. A header is trusted only when you pick it here, because anyone can send a fake one. Choosing a header the proxy doesn't set lets visitors pretend to be any IP."
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_REMOTE_ADDR="The connection itself (no proxy)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_CLOUDFLARE="Cloudflare (CF-Connecting-IP)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_XFF="Proxy / load balancer (X-Forwarded-For)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_X_REAL_IP="Nginx proxy (X-Real-IP)"

; Options - Logging
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING="Logging"
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_DESC="What gets written to the event log and for how long."
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_SUBTITLE="The event log behind the dashboard"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_LABEL="Keep an event log"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_DESC="Record each challenge, pass, failure and block. The dashboard and event log need this."
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_LABEL="Shorten IP addresses"
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_DESC="On by default. Store only the network part of each address (203.0.113.0 instead of 203.0.113.7), which keeps the log friendlier to privacy rules such as GDPR. Protection still uses the full address while the request is running; only what is saved is shortened. Switching this on also shortens the addresses already in the log. Turn it off only if you need exact addresses, for example to block a single IP at your firewall."
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_LABEL="Keep entries for (days)"
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_DESC="Older entries are deleted automatically. 0 keeps them forever."

