COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION="Protection"
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_DESC="Which pages get the browser check."
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_SUBTITLE="Choose which pages visitors must pass a check to see"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_LABEL="Protect"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_DESC="Protect only the menu items you pick, or protect the whole site and pick the menu items to leave open."
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_SELECTED="Only the selected pages"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_ALL_EXCEPT="Every page except the selected ones"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_LABEL="Menu items"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_DESC="The pages this applies to. Anything shown under a menu item is covered too, for example the articles opened from a protected category blog."
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_LABEL="Also catch other routes to the same content"
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_DESC="Scrapers sometimes reach the same article through a different menu item or a plain index.php link. With this on, a request for the same component, view and item as a protected menu item is protected too, and so is any article or subcategory inside a protected category."

; Options - Challenge
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE="Challenge"
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_DESC="What visitors see and how long their pass lasts."
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_SUBTITLE="The check itself, the wording, and how long a pass lasts"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_LABEL="Captcha"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_DESC="Which Joomla captcha plugin runs the check. Joomla's own Proof-of-Work captcha (Joomla 6.1+) is recommended: no third-party service, no cookies from anyone else, and nothing for the visitor to click. Its difficulty is set in the captcha plugin's own settings. Any other installed captcha plugin can be used instead."
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_DISABLED="%s (disabled)"
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_POW_MISSING="CAPTCHA - Proof of Work (needs Joomla 6.1+, not installed)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_LABEL="If the captcha can't run"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_DESC="What happens when the chosen captcha plugin is disabled or missing. Letting visitors through keeps the site usable; blocking keeps the content locked but shows every visitor an error."
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_ALLOW="Let visitors through (and log an error)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_BLOCK="Block the page"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_LABEL="Start the check automatically"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_DESC="Start solving the proof-of-work as soon as the page loads, instead of waiting for the visitor to tick the box. Only applies to the Proof-of-Work captcha."
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_LABEL="Continue automatically when solved"
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_DESC="Send the visitor on to the page as soon as the check is solved, without making them click Continue. Only applies to the Proof-of-Work captcha."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_LABEL="Pass lasts"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_DESC="After passing once, a visitor can open every protected page without another check for this long."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_1H="1 hour"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_6H="6 hours"
