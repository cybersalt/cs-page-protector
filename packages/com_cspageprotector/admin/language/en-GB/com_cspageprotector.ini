COM_CSPAGEPROTECTOR="Cybersalt Page Protector"
COM_CSPAGEPROTECTOR_MENU="Cybersalt Page Protector"
COM_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>By <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Puts a proof-of-work check in front of the pages you choose, so scrapers have to spend real computing time before they get your content. Real visitors see a short &quot;checking your browser&quot; step once, then browse normally. For Joomla 5 and 6 (the core Proof-of-Work captcha needs Joomla 6.1 or later)."

