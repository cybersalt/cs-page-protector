; Options - Protection
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION="Protección"
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_DESC="Qué páginas tienen la comprobación del navegador."
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_SUBTITLE="Elija qué páginas exigen superar una comprobación para verlas"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_LABEL="Proteger"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_DESC="Proteja solo los elementos de menú que elija, o proteja todo el sitio y elija los elementos de menú que quedan abiertos."
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_SELECTED="Solo las páginas seleccionadas"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_ALL_EXCEPT="Todas las páginas excepto las seleccionadas"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_LABEL="Elementos de menú"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_DESC="Las páginas a las que se aplica. Todo lo que se muestra bajo un elemento de menú también queda incluido, por ejemplo los artículos abiertos desde un blog de categoría protegido."
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_LABEL="Detectar también otras rutas al mismo contenido"
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_DESC="A veces los scrapers llegan al mismo artículo a través de otro elemento de menú, un enlace index.php simple, un blog o una lista de destacados, una lista de etiquetas, un módulo de artículos o un canal (feed). Con esta opción activada, un artículo protegido (o cualquier artículo dentro de una categoría protegida) queda protegido también en todos esos casos: las listas muestran un breve aviso en lugar de su texto y se rechazan los canales que lo incluirían. Los resultados de la Búsqueda inteligente aún pueden mostrar un breve fragmento, porque Joomla los guarda al indexar."

; Options - Challenge
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE="Comprobación"
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_DESC="Qué ven los visitantes y cuánto dura su pase."
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_SUBTITLE="La comprobación en sí, los textos y cuánto dura un pase"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_LABEL="Captcha"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_DESC="Qué plugin de captcha de Joomla realiza la comprobación. Se recomienda el captcha Proof-of-Work propio de Joomla (Joomla 6.1+): sin servicios de terceros, sin cookies ajenas y sin nada en lo que el visitante tenga que hacer clic. Su dificultad se ajusta en la configuración del propio plugin de captcha. Puede usarse en su lugar cualquier otro plugin de captcha instalado."
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_DISABLED="%s (desactivado)"
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_POW_MISSING="CAPTCHA - Proof of Work (requiere Joomla 6.1+, no instalado)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_LABEL="Si el captcha no puede ejecutarse"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_DESC="Qué ocurre cuando el plugin de captcha elegido está desactivado o no existe. Dejar pasar a los visitantes mantiene el sitio utilizable; bloquear mantiene el contenido cerrado, pero muestra un error a todos los visitantes."
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_ALLOW="Dejar pasar a los visitantes (y registrar un error)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_BLOCK="Bloquear la página"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_LABEL="Iniciar la comprobación automáticamente"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_DESC="Empezar a resolver la prueba de trabajo en cuanto se carga la página, en lugar de esperar a que el visitante marque la casilla. Solo se aplica al captcha Proof-of-Work."
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_LABEL="Continuar automáticamente al resolverla"
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_DESC="Llevar al visitante a la página en cuanto se resuelve la comprobación, sin que tenga que hacer clic en Continuar. Solo se aplica al captcha Proof-of-Work."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_LABEL="Duración del pase"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_DESC="Tras superarla una vez, el visitante puede abrir todas las páginas protegidas sin otra comprobación durante este tiempo."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_1H="1 hora"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_6H="6 horas"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_12H="12 horas"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_24H="24 horas"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_3D="3 días"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_7D="7 días"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_30D="30 días"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_LABEL="Vincular el pase a la IP del visitante"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_DESC="Hace que un pase copiado no sirva desde ninguna otra dirección. Déjelo desactivado si muchos de sus visitantes usan redes móviles, donde la IP cambia a menudo y se les volvería a comprobar cada vez."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_LABEL="Estado HTTP de la página de comprobación"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_DESC="200 funciona en todas partes. 403 indica claramente a los bots que se les ha denegado el acceso, pero algunos alojamientos sustituyen las páginas 403 por su propia página de error, lo que ocultaría la comprobación a los visitantes reales. Pruébelo antes de cambiarlo."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_200="200 OK (recomendado)"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_403="403 Forbidden"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_LABEL="Encabezado"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_DESC="Encabezado que se muestra sobre la comprobación. Déjelo vacío para usar el predeterminado."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_LABEL="Mensaje"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_DESC="Texto que se muestra bajo el encabezado. Se permite HTML básico. Déjelo vacío para usar el predeterminado."
COM_CSPAGEPROTECTOR_CHALLENGE_HEADING_DEFAULT="Comprobando su navegador"
COM_CSPAGEPROTECTOR_CHALLENGE_MESSAGE_DEFAULT="Solo tardará un momento. Ayuda a mantener los scrapers automáticos alejados de esta página."

; Options - Exemptions
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS="Exenciones"
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_DESC="Quién puede saltarse la comprobación."
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_SUBTITLE="Quién no ve nunca la comprobación"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_LABEL="Los usuarios conectados se saltan la comprobación"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_DESC="Cualquiera que haya iniciado sesión en el sitio accede directamente a las páginas protegidas. Desactívelo para eximir solo a algunos grupos de usuarios."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_LABEL="Grupos de usuarios que se saltan la comprobación"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_DESC="Los miembros conectados de estos grupos (o de cualquier grupo por debajo de ellos) se saltan la comprobación."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_LABEL="Dejar entrar a los buscadores verificados"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_DESC="Googlebot, Bingbot, Applebot, YandexBot, Baiduspider y Yahoo Slurp se saltan la comprobación, pero solo después de que una búsqueda DNS inversa y directa demuestre que la petición procede realmente de ese buscador. Un scraper que solo dice ser Googlebot se sigue comprobando. Los rastreadores de IA como GPTBot y ClaudeBot no están en esta lista. Si lo desactiva, las páginas protegidas desaparecerán de los resultados de búsqueda."
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_LABEL="Registrar las visitas de buscadores"
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_DESC="Escribir una entrada en el registro cada vez que se deja entrar a un buscador verificado. Desactivado por defecto porque los rastreadores visitan mucho."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_LABEL="Direcciones IP que se saltan la comprobación"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_DESC="Una por línea. Funcionan tanto direcciones sueltas (203.0.113.7) como rangos (203.0.113.0/24, 2001:db8::/32). Las líneas que empiezan por # se ignoran. Útil para su oficina, los monitores de disponibilidad y los socios."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_HINT="203.0.113.7 o 198.51.100.0/24"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_LABEL="La IP del visitante procede de"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_DESC="Cámbielo solo si el sitio está detrás de un proxy o una CDN. Solo se confía en la cabecera elegida cuando la petición llega realmente a través de ese proxy: para Cloudflare, desde las propias direcciones de Cloudflare; para las demás, desde las direcciones indicadas en \"Proxies de confianza\" (o desde un proxy en el mismo servidor o en una red privada si esa lista está vacía). Si la envía cualquier otro, la cabecera se ignora, de modo que nadie puede hacerse pasar por una dirección permitida."
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_REMOTE_ADDR="La propia conexión (sin proxy)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_CLOUDFLARE="Cloudflare (CF-Connecting-IP)"
