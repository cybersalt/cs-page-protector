COM_CSPAGEPROTECTOR_DASHBOARD_NO_EXCLUDED_PAGES="Todas las páginas del sitio están protegidas. Añada elementos de menú en Opciones para dejarlos abiertos."
COM_CSPAGEPROTECTOR_DASHBOARD_TOP_IPS="Direcciones IP con más comprobaciones (7 días)"
COM_CSPAGEPROTECTOR_DASHBOARD_TOP_IPS_HINT="Muchas comprobaciones y ningún pase suele indicar un scraper. El botón de copiar le da la dirección (o su rango, cuando las IP se acortan) lista para bloquearla en su cortafuegos."
