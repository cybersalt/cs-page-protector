COM_CSPAGEPROTECTOR_CHALLENGE_NOSCRIPT="Esta página necesita JavaScript activado para terminar la comprobación."
COM_CSPAGEPROTECTOR_CHALLENGE_WHY="¿Por qué veo esto?"
COM_CSPAGEPROTECTOR_CHALLENGE_WHY_BODY="Este sitio pide a su navegador que resuelva un pequeño rompecabezas antes de mostrar algunas páginas. A una persona le lleva un segundo, pero a las herramientas automáticas les sale caro copiar todo el sitio. No se le volverá a pedir durante un tiempo."

; Options - Modules
COM_CSPAGEPROTECTOR_FIELDSET_MODULES="Módulos"
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_DESC="Proteger el contenido de los módulos en todas las páginas en las que aparecen. Mientras haya módulos o contenido protegidos, se omiten las cachés de vistas y de módulos de Joomla, para que una copia en caché nunca llegue a un visitante que no haya superado la comprobación. La caché de páginas se gestiona por separado y sigue funcionando para las demás páginas."
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_SUBTITLE="Mantener el contenido de los módulos alejado de los scrapers, incluso en páginas no protegidas"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_LABEL="Módulos protegidos"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_DESC="Estos módulos solo se muestran a los visitantes que han superado la comprobación (o que se la saltan: usuarios conectados, IP permitidas, buscadores verificados), en todas las páginas en las que aparecen. Útil para datos de contacto, precios o información de miembros en un pie de página o una barra lateral."
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_LABEL="Posiciones de módulo protegidas"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_DESC="Todos los módulos de estas posiciones quedan protegidos, incluidos los que se añadan más adelante."
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES="%2$s (%1$d módulos)"
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES_1="%2$s (1 módulo)"
COM_CSPAGEPROTECTOR_NO_POSITION="(sin posición)"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_LABEL="Los visitantes que no la han superado ven"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_DESC="Un marcador de posición conserva el título y el recuadro del módulo con un botón \"Mostrar contenido\" que realiza la comprobación y vuelve directamente. Ocultar elimina el módulo por completo, de modo que su posición se cierra; los visitantes solo lo ven tras superar la comprobación en otro lugar, por ejemplo en una página protegida. En ambos casos el captcha nunca se muestra dentro de un módulo, así que una página nunca tiene más de uno."
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_PLACEHOLDER="Un marcador de posición con un botón \"Mostrar contenido\""
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_HIDE="Nada: ocultar el módulo por completo"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_LABEL="Texto del marcador de posición"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_DESC="Se muestra en lugar del contenido del módulo. Déjelo vacío para usar el predeterminado."
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_LABEL="Texto del botón"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_DESC="Texto del botón que realiza la comprobación. Déjelo vacío para usar el predeterminado."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_TEXT_DEFAULT="Este contenido aparece tras una rápida comprobación del navegador."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_BUTTON_DEFAULT="Mostrar contenido"

