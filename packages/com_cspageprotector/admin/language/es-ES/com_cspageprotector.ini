; Options - Logging
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING="Registro"
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_DESC="Qué se escribe en el registro de eventos y durante cuánto tiempo."
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_SUBTITLE="El registro de eventos en el que se basa el panel"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_LABEL="Llevar un registro de eventos"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_DESC="Registrar cada comprobación, pase, fallo y bloqueo. El panel y el registro de eventos lo necesitan."
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_LABEL="Acortar las direcciones IP"
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_DESC="Activado por defecto. Guarda solo la parte de red de cada dirección (203.0.113.0 en lugar de 203.0.113.7), lo que hace el registro más respetuoso con normas de privacidad como el RGPD. La protección sigue usando la dirección completa mientras se procesa la petición; solo se acorta lo que se guarda. Al activarlo también se acortan las direcciones que ya están en el registro. Desactívelo solo si necesita direcciones exactas, por ejemplo para bloquear una IP concreta en su cortafuegos."
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_LABEL="Conservar las entradas durante (días)"
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_DESC="Las entradas más antiguas se eliminan automáticamente. 0 las conserva para siempre."

