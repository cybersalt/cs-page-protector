; Dashboard
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_HEADING="Cómo funciona Page Protector"
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_BODY="Quien visita una página protegida ve primero una breve comprobación del navegador. Su navegador resuelve un pequeño rompecabezas de prueba de trabajo (alrededor de un segundo para una persona, un coste de CPU real para un scraper que recorre miles de páginas) y después recibe un pase con el que navega por las páginas protegidas con normalidad hasta que caduca. Los usuarios conectados, las IP de la lista de permitidas y los buscadores verificados pueden saltarse la comprobación."
