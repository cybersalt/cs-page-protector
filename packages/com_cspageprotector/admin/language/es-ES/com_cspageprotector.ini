COM_CSPAGEPROTECTOR_SUPPORT_HEADING="Ayuda y soporte"
COM_CSPAGEPROTECTOR_SUPPORT_COMMUNITY_HEADING="Nos encanta saber de usted"
COM_CSPAGEPROTECTOR_SUPPORT_COMMUNITY_BODY="Envíenos sus informes de errores, peticiones de funciones, preguntas e ideas: los leemos todos y agradecemos los comentarios. Cybersalt Page Protector es gratuito y de código abierto, y el soporte se presta en la medida de lo posible: nuestro tiempo para el soporte gratuito es limitado, así que las respuestas pueden tardar. Si necesita un tiempo de respuesta garantizado o ayuda directa en su sitio, hay soporte de pago disponible a través del formulario de solicitud de soporte."
