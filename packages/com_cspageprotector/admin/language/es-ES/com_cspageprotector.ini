COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_DESC="A quién contactar cuando algo va mal."
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_SUBTITLE="Datos de contacto de soporte que se muestran en el panel (nunca a los visitantes del sitio)"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_LABEL="Correo de soporte"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_DESC="Se muestra en el panel para que los administradores del sitio sepan a quién contactar. Nunca se muestra a los visitantes del sitio."
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_LABEL="Página de soporte"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_DESC="Enlace a un formulario de contacto o a una página de ayuda."
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_LABEL_LABEL="Nombre del soporte"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_LABEL_DESC="Cómo se nombra al soporte en los mensajes, por ejemplo \"Soporte de Cybersalt\" o \"el equipo del sitio\"."

