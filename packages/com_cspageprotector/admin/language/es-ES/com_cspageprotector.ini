COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_LABEL="Proxies de confianza"
COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_DESC="Las direcciones o rangos de sus propios proxies o balanceadores de carga, uno por línea. Se confía en su cabecera X-Forwarded-For / X-Real-IP, y en la de nadie más. Déjelo vacío si el proxy se ejecuta en el mismo servidor o en una red privada. No es necesario para Cloudflare."
