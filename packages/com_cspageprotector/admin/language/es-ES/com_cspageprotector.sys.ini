COM_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Por <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Coloca una comprobación de prueba de trabajo delante de las páginas que elija, de modo que los scrapers tengan que gastar tiempo de cálculo real antes de obtener su contenido. Los visitantes reales ven una vez un breve paso de &quot;comprobando su navegador&quot; y después navegan con normalidad. Para Joomla 5 y 6 (el captcha Proof-of-Work del núcleo requiere Joomla 6.1 o posterior)."
