; Options - Protection
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION="Protection"
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_DESC="Les pages soumises à la vérification du navigateur. La vérification rend le scraping plus lent et plus coûteux, mais elle ne peut pas promettre que votre contenu ne sera jamais copié."
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_SUBTITLE="Choisissez les pages pour lesquelles les visiteurs doivent réussir une vérification"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_LABEL="Protéger"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_DESC="Protéger uniquement les éléments de menu choisis, ou protéger tout le site et choisir les éléments de menu à laisser ouverts."
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_SELECTED="Uniquement les pages sélectionnées"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_ALL_EXCEPT="Toutes les pages sauf celles sélectionnées"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_LABEL="Éléments de menu"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_DESC="Les pages concernées. Tout ce qui s'affiche sous un élément de menu est aussi couvert, par exemple les articles ouverts depuis un blog de catégorie protégé."
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_LABEL="Couvrir aussi les autres chemins vers le même contenu"
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_DESC="Les scrapers atteignent parfois le même article par un autre élément de menu, un simple lien index.php, un blog ou une liste d'articles en vedette, une liste de tags, un module d'articles ou un flux. Avec cette option activée, un article protégé (ou tout article d'une catégorie protégée) est aussi protégé dans tous ces cas : les listes affichent un court avis à la place de son texte, et les flux qui l'incluraient sont refusés. Les résultats de la Recherche avancée peuvent encore afficher un court extrait, car Joomla les enregistre lors de l'indexation."

; Options - Challenge
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE="Vérification"
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_DESC="Ce que voient les visiteurs et la durée de leur laissez-passer."
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_SUBTITLE="La vérification elle-même, les textes et la durée d'un laissez-passer"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_LABEL="Captcha"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_DESC="Le plugin de captcha Joomla qui effectue la vérification. Le captcha Proof-of-Work de Joomla (Joomla 6.1+) est recommandé : aucun service tiers, aucun cookie d'un tiers et rien sur quoi le visiteur doit cliquer. Sa difficulté se règle dans les paramètres du plugin de captcha lui-même. Tout autre plugin de captcha installé peut être utilisé à la place."
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_DISABLED="%s (désactivé)"
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_POW_MISSING="CAPTCHA - Proof of Work (nécessite Joomla 6.1+, non installé)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_LABEL="Si le captcha ne peut pas fonctionner"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_DESC="Ce qui se passe lorsque le plugin de captcha choisi est désactivé ou absent. Laisser passer les visiteurs garde le site utilisable ; bloquer garde le contenu verrouillé mais affiche une erreur à chaque visiteur."
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_ALLOW="Laisser passer les visiteurs (et journaliser une erreur)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_BLOCK="Bloquer la page"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_LABEL="Lancer la vérification automatiquement"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_DESC="Commencer à résoudre la preuve de travail dès le chargement de la page, au lieu d'attendre que le visiteur coche la case. S'applique uniquement au captcha Proof-of-Work."
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_LABEL="Continuer automatiquement une fois résolue"
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_DESC="Envoyer le visiteur vers la page dès que la vérification est résolue, sans qu'il ait à cliquer sur Continuer. S'applique uniquement au captcha Proof-of-Work."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_LABEL="Durée du laissez-passer"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_DESC="Après une réussite, un visiteur peut ouvrir toutes les pages protégées sans nouvelle vérification pendant cette durée."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_1H="1 heure"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_6H="6 heures"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_12H="12 heures"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_24H="24 heures"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_3D="3 jours"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_7D="7 jours"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_30D="30 jours"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_LABEL="Lier le laissez-passer à l'IP du visiteur"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_DESC="Rend un laissez-passer copié inutilisable depuis toute autre adresse. Laissez cette option désactivée si beaucoup de vos visiteurs utilisent des réseaux mobiles, où l'IP change souvent et où ils seraient vérifiés à nouveau à chaque fois."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_LABEL="Statut HTTP de la page de vérification"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_DESC="200 fonctionne partout. 403 indique clairement aux robots qu'ils ont été refusés, mais certains hébergeurs remplacent les pages 403 par leur propre page d'erreur, ce qui masquerait la vérification aux vrais visiteurs. Testez avant de changer."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_200="200 OK (recommandé)"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_403="403 Forbidden"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_LABEL="Titre"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_DESC="Titre affiché au-dessus de la vérification. Laissez vide pour utiliser le titre par défaut."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_LABEL="Message"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_DESC="Texte affiché sous le titre. Le HTML de base est autorisé. Laissez vide pour utiliser le texte par défaut."
COM_CSPAGEPROTECTOR_CHALLENGE_HEADING_DEFAULT="Vérification de votre navigateur"
COM_CSPAGEPROTECTOR_CHALLENGE_MESSAGE_DEFAULT="Cela ne prend qu'un instant. Cela aide à tenir les scrapers automatisés à l'écart de cette page."

; Options - Exemptions
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS="Exemptions"
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_DESC="Qui peut passer outre la vérification."
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_SUBTITLE="Qui ne voit jamais la vérification"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_LABEL="Les utilisateurs connectés passent outre la vérification"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_DESC="Toute personne connectée au site accède directement aux pages protégées. Désactivez cette option pour n'exempter que certains groupes d'utilisateurs."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_LABEL="Groupes d'utilisateurs exemptés de la vérification"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_DESC="Les membres connectés de ces groupes (ou de tout groupe placé en dessous) passent outre la vérification."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_LABEL="Laisser entrer les moteurs de recherche vérifiés"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_DESC="Googlebot, Bingbot, Applebot, YandexBot, Baiduspider et Yahoo Slurp passent outre la vérification, mais seulement après qu'une recherche DNS inverse puis directe a prouvé que la requête provient bien de ce moteur de recherche. Un scraper qui se contente de se présenter comme Googlebot est quand même vérifié. Les robots d'IA comme GPTBot et ClaudeBot ne figurent pas dans cette liste. Si vous désactivez cette option, les pages protégées disparaîtront des résultats de recherche."
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_LABEL="Journaliser les visites des moteurs de recherche"
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_DESC="Écrire une entrée dans le journal chaque fois qu'un moteur de recherche vérifié est admis. Désactivé par défaut, car les robots d'exploration passent souvent."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_LABEL="Adresses IP exemptées de la vérification"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_DESC="Une par ligne. Les adresses seules (203.0.113.7) comme les plages (203.0.113.0/24, 2001:db8::/32) fonctionnent. Les lignes commençant par # sont ignorées. Pratique pour votre bureau, les outils de surveillance de disponibilité et les partenaires."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_HINT="203.0.113.7 ou 198.51.100.0/24"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_LABEL="L'IP du visiteur provient de"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_DESC="Ne modifiez ce réglage que si le site se trouve derrière un proxy ou un CDN. L'en-tête choisi n'est pris en compte que si la requête passe réellement par ce proxy : pour Cloudflare, les propres adresses de Cloudflare ; pour les autres, les adresses indiquées dans \"Proxies de confiance\" (ou un proxy sur le même serveur ou le même réseau privé quand cette liste est vide). Si quelqu'un d'autre envoie cet en-tête, il est ignoré : personne ne peut donc se faire passer pour une adresse autorisée."
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_REMOTE_ADDR="La connexion elle-même (sans proxy)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_CLOUDFLARE="Cloudflare (CF-Connecting-IP)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_XFF="Proxy / répartiteur de charge (X-Forwarded-For)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_X_REAL_IP="Proxy Nginx (X-Real-IP)"

; Options - Logging
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING="Journalisation"
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_DESC="Ce qui est écrit dans le journal des événements et pendant combien de temps."
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_SUBTITLE="Le journal des événements sur lequel repose le tableau de bord"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_LABEL="Tenir un journal des événements"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_DESC="Enregistrer chaque vérification, réussite, échec et blocage. Le tableau de bord et le journal des événements en ont besoin."
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_LABEL="Raccourcir les adresses IP"
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_DESC="Activé par défaut. Enregistre uniquement la partie réseau de chaque adresse (203.0.113.0 au lieu de 203.0.113.7), ce qui rend le journal plus respectueux des règles de confidentialité comme le RGPD. La protection utilise toujours l'adresse complète pendant le traitement de la requête ; seul ce qui est enregistré est raccourci. Activer cette option raccourcit aussi les adresses déjà présentes dans le journal. Ne la désactivez que si vous avez besoin des adresses exactes, par exemple pour bloquer une IP précise sur votre pare-feu."
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_LABEL="Conserver les entrées pendant (jours)"
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_DESC="Les entrées plus anciennes sont supprimées automatiquement. 0 les conserve indéfiniment."

; Options - Support
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT="Support"
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_DESC="Qui contacter en cas de problème."
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_SUBTITLE="Coordonnées du support affichées sur le tableau de bord (jamais aux visiteurs du site)"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_LABEL="E-mail du support"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_DESC="Affiché sur le tableau de bord pour que les administrateurs du site sachent qui contacter. Jamais affiché aux visiteurs du site."
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_LABEL="Page de support"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_DESC="Lien vers un formulaire de contact ou une page d'aide."
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_LABEL_LABEL="Nom du support"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_LABEL_DESC="Comment le support est désigné dans les messages, par exemple \"Support Cybersalt\" ou \"l'équipe du site\"."

; Challenge page strings also used from admin (shared helpers)
COM_CSPAGEPROTECTOR_CHALLENGE_CONTINUE="Continuer"
COM_CSPAGEPROTECTOR_CHALLENGE_WORKING="Vérification de votre navigateur..."
COM_CSPAGEPROTECTOR_CHALLENGE_DONE="C'est fait - redirection vers la page."
COM_CSPAGEPROTECTOR_CHALLENGE_EXPIRED="La vérification a expiré. Veuillez réessayer."
COM_CSPAGEPROTECTOR_CHALLENGE_FAILED="La vérification n'a pas abouti. Veuillez réessayer."
COM_CSPAGEPROTECTOR_CHALLENGE_UNAVAILABLE="La vérification du navigateur n'est pas disponible pour le moment. Veuillez réessayer plus tard."
COM_CSPAGEPROTECTOR_CHALLENGE_NOSCRIPT="Cette page a besoin que JavaScript soit activé pour terminer la vérification."
COM_CSPAGEPROTECTOR_CHALLENGE_WHY="Pourquoi est-ce que je vois ceci ?"
COM_CSPAGEPROTECTOR_CHALLENGE_WHY_BODY="Ce site demande à votre navigateur de résoudre un petit casse-tête avant d'afficher certaines pages. Cela prend une seconde à une personne, mais rend coûteuse la copie de tout le site par des outils automatisés. On ne vous le redemandera pas avant un moment."

; Options - Modules
COM_CSPAGEPROTECTOR_FIELDSET_MODULES="Modules"
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_DESC="Protéger le contenu des modules, sur toutes les pages où ils apparaissent. Tant que des modules ou du contenu sont protégés, les caches de vues et de modules de Joomla sont contournés, afin qu'une copie en cache ne puisse jamais parvenir à un visiteur qui n'a pas réussi la vérification. Le cache de pages est géré séparément et continue de fonctionner pour les autres pages."
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_SUBTITLE="Tenir le contenu des modules à l'écart des scrapers, même sur les pages non protégées"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_LABEL="Modules protégés"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_DESC="Ces modules ne s'affichent qu'aux visiteurs qui ont réussi la vérification (ou qui en sont exemptés : utilisateurs connectés, IP autorisées, moteurs de recherche vérifiés), sur toutes les pages où ils apparaissent. Pratique pour des coordonnées, des prix ou des informations réservées aux membres dans un pied de page ou une barre latérale."
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_LABEL="Positions de module protégées"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_DESC="Tous les modules de ces positions sont protégés, y compris ceux qui y seront ajoutés plus tard."
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES="%2$s (%1$d modules)"
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES_1="%2$s (1 module)"
COM_CSPAGEPROTECTOR_NO_POSITION="(aucune position)"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_LABEL="Les visiteurs non vérifiés voient"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_DESC="Un espace réservé conserve le titre et le cadre du module avec un bouton \"Afficher le contenu\" qui lance la vérification et revient directement. Masquer retire complètement le module, et sa position se referme ; les visiteurs ne le voient alors qu'après avoir réussi la vérification ailleurs, par exemple sur une page protégée. Dans les deux cas, le captcha n'est jamais affiché dans un module, si bien qu'une page n'en contient jamais plus d'un."
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_PLACEHOLDER="Un espace réservé avec un bouton \"Afficher le contenu\""
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_HIDE="Rien : masquer complètement le module"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_LABEL="Texte de l'espace réservé"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_DESC="Affiché à la place du contenu du module. Laissez vide pour utiliser le texte par défaut."
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_LABEL="Libellé du bouton"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_DESC="Libellé du bouton qui lance la vérification. Laissez vide pour utiliser le libellé par défaut."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_TEXT_DEFAULT="Ce contenu s'affiche après une rapide vérification du navigateur."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_BUTTON_DEFAULT="Afficher le contenu"

; Dashboard - modules
COM_CSPAGEPROTECTOR_DASHBOARD_PROTECTED_MODULES="Modules protégés"
COM_CSPAGEPROTECTOR_DASHBOARD_NO_MODULES="Aucun module n'est protégé. Choisissez des modules ou des positions dans l'onglet Modules des Options."
COM_CSPAGEPROTECTOR_HEADING_MODULE="Module"
COM_CSPAGEPROTECTOR_HEADING_POSITION="Position"
COM_CSPAGEPROTECTOR_PROTECTED_BY_POSITION="position entière"
COM_CSPAGEPROTECTOR_CHOOSE_MODULES="Choisir les modules"
COM_CSPAGEPROTECTOR_CHECK_MODULES_N="%d modules sont protégés."
COM_CSPAGEPROTECTOR_CHECK_MODULES_N_1="1 module est protégé."
COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_LABEL="Proxies de confiance"
COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_DESC="Les adresses ou plages de vos propres proxies ou répartiteurs de charge, une par ligne. Leur en-tête X-Forwarded-For / X-Real-IP est pris en compte ; celui des autres ne l'est pas. Laissez vide si le proxy tourne sur le même serveur ou dans un réseau privé. Inutile pour Cloudflare."
COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_HINT="10.0.0.0/8 ou 192.0.2.10"
