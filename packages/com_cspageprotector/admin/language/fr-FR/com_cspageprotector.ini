COM_CSPAGEPROTECTOR="Cybersalt Page Protector"
COM_CSPAGEPROTECTOR_MENU="Cybersalt Page Protector"
COM_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Par <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Place une vérification par preuve de travail devant les pages de votre choix, pour que les scrapers doivent dépenser un vrai temps de calcul avant d'obtenir votre contenu. Les vrais visiteurs voient une seule fois une courte étape &quot;vérification de votre navigateur&quot;, puis naviguent normalement. Pour Joomla 5 et 6 (le captcha Proof-of-Work du cœur nécessite Joomla 6.1 ou ultérieur)."

