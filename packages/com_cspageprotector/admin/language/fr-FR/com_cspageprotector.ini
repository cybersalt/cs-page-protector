; Dashboard
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_HEADING="Comment fonctionne Page Protector"
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_BODY="Les visiteurs d'une page protégée voient d'abord une courte vérification du navigateur. Leur navigateur résout un petit casse-tête de preuve de travail (environ une seconde pour une personne, un vrai coût CPU pour un scraper qui parcourt des milliers de pages), puis ils reçoivent un laissez-passer et naviguent normalement sur les pages protégées jusqu'à son expiration. Les utilisateurs connectés, les IP autorisées et les moteurs de recherche vérifiés peuvent passer outre la vérification."
COM_CSPAGEPROTECTOR_NO_GUARANTEE_LABEL="Aucune garantie."
COM_CSPAGEPROTECTOR_NO_GUARANTEE_BODY="Les robots et les pirates sont tenaces. Cybersalt Page Protector fait de son mieux pour protéger votre contenu, mais nous ne pouvons pas garantir que des personnes malveillantes ne trouveront pas un autre moyen de le contourner. Comme toujours : si vous ne voulez pas qu'une information soit en ligne, ne la mettez pas en ligne."
