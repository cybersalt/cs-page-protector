COM_CSPAGEPROTECTOR_SUPPORT_COMMUNITY_BODY="Envoyez-nous vos rapports de bugs, demandes de fonctionnalités, questions et idées : nous les lisons tous et apprécions vos retours. Cybersalt Page Protector est gratuit et open source, et son support est assuré dans la mesure du possible : notre temps pour le support gratuit est limité, les réponses peuvent donc prendre un moment. Si vous avez besoin d'un délai de réponse garanti ou d'une aide directe sur votre site, un support payant est disponible via le formulaire de demande de support."
