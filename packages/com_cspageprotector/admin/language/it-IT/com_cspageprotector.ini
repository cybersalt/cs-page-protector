; Dashboard
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_HEADING="Come funziona Page Protector"
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_BODY="Chi visita una pagina protetta vede prima un breve controllo del browser. Il suo browser risolve un piccolo enigma proof-of-work (circa un secondo per una persona, un costo di CPU reale per uno scraper che visita migliaia di pagine), poi riceve un pass e naviga normalmente nelle pagine protette fino alla sua scadenza. Gli utenti connessi, gli IP consentiti e i motori di ricerca verificati possono saltare il controllo."
COM_CSPAGEPROTECTOR_NO_GUARANTEE_LABEL="Nessuna garanzia."
COM_CSPAGEPROTECTOR_NO_GUARANTEE_BODY="Bot e hacker sono tenaci. Cybersalt Page Protector fa del suo meglio per proteggere i tuoi contenuti, ma non possiamo garantire che qualche malintenzionato non trovi un altro modo per aggirarlo. Come sempre, se ci sono informazioni che non vuoi online, non metterle online."
COM_CSPAGEPROTECTOR_NOTICE_ACCEPT="Ho capito, non mostrare più"
COM_CSPAGEPROTECTOR_NOTICE_ADMIN_ONLY="Questo avviso deve essere accettato da un amministratore che può modificare le Opzioni di Page Protector."
