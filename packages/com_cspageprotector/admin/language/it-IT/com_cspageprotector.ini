COM_CSPAGEPROTECTOR_MENU="Cybersalt Page Protector"
COM_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Di <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Mette un controllo proof-of-work davanti alle pagine che scegli, così gli scraper devono spendere tempo di calcolo reale prima di ottenere i tuoi contenuti. I visitatori reali vedono una sola volta un breve passaggio &quot;verifica del browser in corso&quot;, poi navigano normalmente. Per Joomla 5 e 6 (il captcha Proof-of-Work del core richiede Joomla 6.1 o successivo)."

