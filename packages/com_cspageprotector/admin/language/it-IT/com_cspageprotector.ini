COM_CSPAGEPROTECTOR_DASHBOARD_PROTECTED_MODULES="Moduli protetti"
COM_CSPAGEPROTECTOR_DASHBOARD_NO_MODULES="Nessun modulo è protetto. Scegli moduli o posizioni nella scheda Moduli delle Opzioni."
COM_CSPAGEPROTECTOR_HEADING_MODULE="Modulo"
COM_CSPAGEPROTECTOR_HEADING_POSITION="Posizione"
