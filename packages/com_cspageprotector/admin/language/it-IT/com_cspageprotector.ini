COM_CSPAGEPROTECTOR_CHOOSE_MODULES="Scegli i moduli"
COM_CSPAGEPROTECTOR_CHECK_MODULES_N="%d moduli sono protetti."
COM_CSPAGEPROTECTOR_CHECK_MODULES_N_1="1 modulo è protetto."
COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_LABEL="Proxy attendibili"
COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_DESC="Gli indirizzi o gli intervalli dei tuoi proxy o bilanciatori di carico, uno per riga. Il loro header X-Forwarded-For / X-Real-IP viene considerato attendibile; quello di chiunque altro no. Lascia vuoto se il proxy gira sullo stesso server o in una rete privata. Non serve per Cloudflare."
