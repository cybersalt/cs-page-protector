COM_CSPAGEPROTECTOR_SUPPORT_COMMUNITY_BODY="Inviaci segnalazioni di bug, richieste di funzionalità, domande e idee: le leggiamo tutte e apprezziamo il tuo feedback. Cybersalt Page Protector è gratuito e open source, e il supporto viene fornito secondo le nostre possibilità: il tempo che possiamo dedicare al supporto gratuito è limitato, quindi le risposte possono richiedere un po' di tempo. Se ti serve un tempo di risposta garantito o un aiuto diretto sul tuo sito, è disponibile un supporto a pagamento tramite il modulo di richiesta di supporto."
