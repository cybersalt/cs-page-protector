; Options - Protection
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION="Protezione"
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_DESC="Quali pagine hanno il controllo del browser. Il controllo rende lo scraping più lento e più costoso, ma non può promettere che i tuoi contenuti non vengano mai copiati."
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_SUBTITLE="Scegli per quali pagine i visitatori devono superare un controllo"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_LABEL="Proteggi"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_DESC="Proteggi solo le voci di menu che scegli, oppure proteggi tutto il sito e scegli le voci di menu da lasciare aperte."
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_SELECTED="Solo le pagine selezionate"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_ALL_EXCEPT="Tutte le pagine tranne quelle selezionate"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_LABEL="Voci di menu"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_DESC="Le pagine a cui si applica. Anche tutto ciò che viene mostrato sotto una voce di menu è coperto, per esempio gli articoli aperti da un blog di categoria protetto."
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_LABEL="Intercetta anche altri percorsi verso lo stesso contenuto"
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_DESC="A volte gli scraper raggiungono lo stesso articolo tramite un'altra voce di menu, un semplice link index.php, un blog o un elenco di articoli in evidenza, un elenco di tag, un modulo articoli o un feed. Con questa opzione attiva, un articolo protetto (o qualsiasi articolo all'interno di una categoria protetta) è protetto anche in tutti questi casi: gli elenchi mostrano un breve avviso al posto del testo e i feed che lo includerebbero vengono rifiutati. I risultati di Smart Search possono comunque mostrare un breve estratto, perché Joomla li salva durante l'indicizzazione."

; Options - Challenge
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE="Controllo"
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_DESC="Cosa vedono i visitatori e quanto dura il loro pass."
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_SUBTITLE="Il controllo vero e proprio, i testi e quanto dura un pass"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_LABEL="Captcha"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_DESC="Il plugin captcha di Joomla che esegue il controllo. È consigliato il captcha Proof-of-Work di Joomla (Joomla 6.1+): nessun servizio di terzi, nessun cookie di altri e niente da cliccare per il visitatore. La sua difficoltà si imposta nelle impostazioni del plugin captcha stesso. In alternativa si può usare qualsiasi altro plugin captcha installato."
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_DISABLED="%s (disabilitato)"
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_POW_MISSING="CAPTCHA - Proof of Work (richiede Joomla 6.1+, non installato)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_LABEL="Se il captcha non può funzionare"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_DESC="Cosa succede quando il plugin captcha scelto è disabilitato o mancante. Lasciar passare i visitatori mantiene il sito utilizzabile; bloccare mantiene il contenuto chiuso ma mostra un errore a ogni visitatore."
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_ALLOW="Lascia passare i visitatori (e registra un errore)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_BLOCK="Blocca la pagina"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_LABEL="Avvia il controllo automaticamente"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_DESC="Inizia a risolvere il proof-of-work appena la pagina si carica, invece di aspettare che il visitatore spunti la casella. Vale solo per il captcha Proof-of-Work."
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_LABEL="Prosegui automaticamente una volta risolto"
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_DESC="Porta il visitatore alla pagina appena il controllo è risolto, senza fargli cliccare Continua. Vale solo per il captcha Proof-of-Work."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_LABEL="Durata del pass"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_DESC="Dopo averlo superato una volta, un visitatore può aprire tutte le pagine protette senza un altro controllo per questo periodo."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_1H="1 ora"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_6H="6 ore"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_12H="12 ore"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_24H="24 ore"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_3D="3 giorni"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_7D="7 giorni"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_30D="30 giorni"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_LABEL="Lega il pass all'IP del visitatore"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_DESC="Rende inutile un pass copiato da qualsiasi altro indirizzo. Lascia questa opzione disattivata se molti dei tuoi visitatori usano reti mobili, dove l'IP cambia spesso e verrebbero controllati di nuovo ogni volta."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_LABEL="Stato HTTP della pagina di controllo"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_DESC="200 funziona ovunque. 403 dice chiaramente ai bot che sono stati respinti, ma alcuni hosting sostituiscono le pagine 403 con una propria pagina di errore, che nasconderebbe il controllo ai visitatori reali. Prova prima di cambiarlo."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_200="200 OK (consigliato)"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_403="403 Forbidden"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_LABEL="Titolo"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_DESC="Titolo mostrato sopra il controllo. Lascia vuoto per usare quello predefinito."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_LABEL="Messaggio"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_DESC="Testo mostrato sotto il titolo. È consentito HTML di base. Lascia vuoto per usare quello predefinito."
COM_CSPAGEPROTECTOR_CHALLENGE_HEADING_DEFAULT="Verifica del browser in corso"
COM_CSPAGEPROTECTOR_CHALLENGE_MESSAGE_DEFAULT="Ci vuole solo un momento. Serve a tenere gli scraper automatici lontani da questa pagina."

; Options - Exemptions
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS="Esenzioni"
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_DESC="Chi può saltare il controllo."
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_SUBTITLE="Chi non vede mai il controllo"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_LABEL="Gli utenti connessi saltano il controllo"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_DESC="Chiunque abbia effettuato l'accesso al sito va direttamente alle pagine protette. Disattiva questa opzione per esentare solo alcuni gruppi di utenti."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_LABEL="Gruppi di utenti che saltano il controllo"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_DESC="I membri connessi di questi gruppi (o di qualsiasi gruppo sotto di essi) saltano il controllo."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_LABEL="Lascia entrare i motori di ricerca verificati"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_DESC="Googlebot, Bingbot, Applebot, YandexBot, Baiduspider e Yahoo Slurp saltano il controllo, ma solo dopo che una ricerca DNS inversa e diretta dimostra che la richiesta proviene davvero da quel motore di ricerca. Uno scraper che si limita a dichiararsi Googlebot viene comunque controllato. I crawler di IA come GPTBot e ClaudeBot non sono in questo elenco. Se disattivi questa opzione, le pagine protette spariranno dai risultati di ricerca."
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_LABEL="Registra le visite dei motori di ricerca"
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_DESC="Scrivi una voce nel registro ogni volta che un motore di ricerca verificato viene fatto entrare. Disattivato per impostazione predefinita perché i crawler passano spesso."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_LABEL="Indirizzi IP che saltano il controllo"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_DESC="Uno per riga. Funzionano sia gli indirizzi singoli (203.0.113.7) sia gli intervalli (203.0.113.0/24, 2001:db8::/32). Le righe che iniziano con # vengono ignorate. Utile per il tuo ufficio, i servizi di monitoraggio uptime e i partner."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_HINT="203.0.113.7 o 198.51.100.0/24"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_LABEL="L'IP del visitatore proviene da"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_DESC="Cambia questa impostazione solo se il sito si trova dietro un proxy o una CDN. L'header scelto viene considerato attendibile solo quando la richiesta passa davvero da quel proxy: per Cloudflare, dagli indirizzi di Cloudflare stessa; per gli altri, dagli indirizzi indicati in \"Proxy attendibili\" (o da un proxy sullo stesso server o sulla stessa rete privata quando l'elenco è vuoto). Se l'header arriva da chiunque altro viene ignorato, quindi nessuno può fingersi un indirizzo consentito."
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_REMOTE_ADDR="La connessione stessa (nessun proxy)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_CLOUDFLARE="Cloudflare (CF-Connecting-IP)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_XFF="Proxy / bilanciatore di carico (X-Forwarded-For)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_X_REAL_IP="Proxy Nginx (X-Real-IP)"

; Options - Logging
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING="Registrazione"
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_DESC="Cosa viene scritto nel registro eventi e per quanto tempo."
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_SUBTITLE="Il registro eventi su cui si basa il pannello di controllo"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_LABEL="Tieni un registro eventi"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_DESC="Registra ogni controllo, superamento, fallimento e blocco. Il pannello di controllo e il registro eventi ne hanno bisogno."
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_LABEL="Abbrevia gli indirizzi IP"
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_DESC="Attivo per impostazione predefinita. Salva solo la parte di rete di ogni indirizzo (203.0.113.0 invece di 203.0.113.7), il che rende il registro più rispettoso delle norme sulla privacy come il GDPR. La protezione usa comunque l'indirizzo completo durante l'elaborazione della richiesta; viene abbreviato solo ciò che viene salvato. Attivando questa opzione vengono abbreviati anche gli indirizzi già presenti nel registro. Disattivala solo se ti servono gli indirizzi esatti, per esempio per bloccare un singolo IP nel tuo firewall."
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_LABEL="Conserva le voci per (giorni)"
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_DESC="Le voci più vecchie vengono eliminate automaticamente. 0 le conserva per sempre."

; Options - Support
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT="Supporto"
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_DESC="Chi contattare quando qualcosa non va."
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_SUBTITLE="Recapiti del supporto mostrati nel pannello di controllo (mai ai visitatori del sito)"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_LABEL="Email del supporto"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_DESC="Mostrata nel pannello di controllo così gli amministratori del sito sanno chi contattare. Mai mostrata ai visitatori del sito."
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_LABEL="Pagina di supporto"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_DESC="Link a un modulo di contatto o a una pagina di aiuto."
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_LABEL_LABEL="Nome del supporto"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_LABEL_DESC="Come viene chiamato il supporto nei messaggi, per esempio \"Supporto Cybersalt\" o \"lo staff del sito\"."

; Challenge page strings also used from admin (shared helpers)
COM_CSPAGEPROTECTOR_CHALLENGE_CONTINUE="Continua"
COM_CSPAGEPROTECTOR_CHALLENGE_WORKING="Verifica del browser in corso..."
COM_CSPAGEPROTECTOR_CHALLENGE_DONE="Fatto - ti stiamo portando alla pagina."
COM_CSPAGEPROTECTOR_CHALLENGE_EXPIRED="Il controllo è scaduto. Riprova."
COM_CSPAGEPROTECTOR_CHALLENGE_FAILED="Il controllo non è andato a buon fine. Riprova."
COM_CSPAGEPROTECTOR_CHALLENGE_UNAVAILABLE="Il controllo del browser non è disponibile al momento. Riprova più tardi."
COM_CSPAGEPROTECTOR_CHALLENGE_NOSCRIPT="Questa pagina richiede JavaScript attivo per completare il controllo."
COM_CSPAGEPROTECTOR_CHALLENGE_WHY="Perché vedo questa pagina?"
COM_CSPAGEPROTECTOR_CHALLENGE_WHY_BODY="Questo sito chiede al tuo browser di risolvere un piccolo enigma prima di mostrare alcune pagine. A una persona serve un secondo, ma per gli strumenti automatici copiare l'intero sito diventa costoso. Non ti verrà chiesto di nuovo per un po'."

; Options - Modules
COM_CSPAGEPROTECTOR_FIELDSET_MODULES="Moduli"
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_DESC="Proteggi il contenuto dei moduli, su ogni pagina in cui compaiono. Finché ci sono moduli o contenuti protetti, le cache delle viste e dei moduli di Joomla vengono scavalcate, così una copia in cache non può mai arrivare a un visitatore che non ha superato il controllo. La cache delle pagine è gestita a parte e continua a funzionare per le altre pagine."
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_SUBTITLE="Tieni il contenuto dei moduli lontano dagli scraper, anche sulle pagine non protette"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_LABEL="Moduli protetti"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_DESC="Questi moduli vengono mostrati solo ai visitatori che hanno superato il controllo (o che lo saltano: utenti connessi, IP consentiti, motori di ricerca verificati), su ogni pagina in cui compaiono. Utile per recapiti, prezzi o informazioni per i membri in un footer o in una barra laterale."
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_LABEL="Posizioni modulo protette"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_DESC="Tutti i moduli in queste posizioni sono protetti, compresi quelli aggiunti in seguito."
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES="%2$s (%1$d moduli)"
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES_1="%2$s (1 modulo)"
COM_CSPAGEPROTECTOR_NO_POSITION="(nessuna posizione)"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_LABEL="I visitatori che non l'hanno superato vedono"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_DESC="Un segnaposto mantiene il titolo e il riquadro del modulo con un pulsante \"Mostra contenuto\" che esegue il controllo e torna subito indietro. Nascondere rimuove completamente il modulo, quindi la sua posizione si chiude; i visitatori lo vedono solo dopo aver superato il controllo altrove, per esempio su una pagina protetta. In entrambi i casi il captcha non viene mai mostrato dentro un modulo, quindi una pagina non ne ha mai più di uno."
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_PLACEHOLDER="Un segnaposto con un pulsante \"Mostra contenuto\""
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_HIDE="Niente: nascondi completamente il modulo"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_LABEL="Testo del segnaposto"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_DESC="Mostrato al posto del contenuto del modulo. Lascia vuoto per usare quello predefinito."
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_LABEL="Etichetta del pulsante"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_DESC="Etichetta del pulsante che esegue il controllo. Lascia vuoto per usare quella predefinita."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_TEXT_DEFAULT="Questo contenuto compare dopo un rapido controllo del browser."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_BUTTON_DEFAULT="Mostra contenuto"

