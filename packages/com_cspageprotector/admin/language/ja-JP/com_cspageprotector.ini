; Options - Modules
COM_CSPAGEPROTECTOR_FIELDSET_MODULES="モジュール"
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_DESC="モジュールの内容を、表示されるすべてのページで保護します。モジュールやコンテンツが保護されている間は、Joomla 自身のビューキャッシュとモジュールキャッシュを使わないため、チェックを通過していない訪問者にキャッシュされたコピーが届くことはありません。ページキャッシュは別に扱われ、他のページでは引き続き機能します。"
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_SUBTITLE="保護されていないページでも、モジュールの内容をスクレイパーから守ります"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_LABEL="保護するモジュール"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_DESC="これらのモジュールは、チェックを通過した訪問者（またはチェックを省略できるログイン中のユーザー、許可リストの IP、確認済みの検索エンジン）にのみ、表示されるすべてのページで表示されます。フッターやサイドバーにある連絡先、価格、会員情報などに便利です。"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_LABEL="保護するモジュールポジション"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_DESC="これらのポジションにあるすべてのモジュールが保護されます。後から追加したモジュールも含まれます。"
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES="%2$s（%1$d 個のモジュール）"
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES_1="%2$s（1 個のモジュール）"
COM_CSPAGEPROTECTOR_NO_POSITION="（ポジションなし）"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_LABEL="未通過の訪問者に表示する内容"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_DESC="プレースホルダーでは、モジュールのタイトルと枠を残し、「コンテンツを表示」ボタンを表示します。このボタンでチェックを実行し、終わるとすぐに元の画面に戻ります。非表示にするとモジュールは完全に取り除かれ、そのポジションは詰められます。訪問者は、保護されたページなど別の場所でチェックを通過した後でなければ、そのモジュールを見られません。どちらの場合も、キャプチャがモジュール内に表示されることはないため、1 つのページにキャプチャが複数表示されることはありません。"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_PLACEHOLDER="「コンテンツを表示」ボタン付きのプレースホルダー"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_HIDE="何も表示しない：モジュールを完全に非表示にする"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_LABEL="プレースホルダーのテキスト"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_DESC="モジュールの内容の代わりに表示されます。空欄にすると既定のテキストになります。"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_LABEL="ボタンのラベル"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_DESC="チェックを実行するボタンのラベルです。空欄にすると既定のラベルになります。"
COM_CSPAGEPROTECTOR_MODULE_LOCKED_TEXT_DEFAULT="このコンテンツは簡単なブラウザチェックの後に表示されます。"
COM_CSPAGEPROTECTOR_MODULE_LOCKED_BUTTON_DEFAULT="コンテンツを表示"

