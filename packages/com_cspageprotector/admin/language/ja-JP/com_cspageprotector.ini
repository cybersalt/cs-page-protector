; Dashboard
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_HEADING="Page Protector の仕組み"
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_BODY="保護されたページを訪れた人には、まず短いブラウザチェックが表示されます。ブラウザが小さなプルーフ・オブ・ワークのパズルを解き（人なら約 1 秒ですが、何千ものページにアクセスするスクレイパーには実際の CPU コストになります）、通行証を受け取ります。通行証の有効期限が切れるまでは、保護されたページを普通に閲覧できます。ログイン中のユーザー、許可リストの IP、確認済みの検索エンジンはチェックを省略できます。"
COM_CSPAGEPROTECTOR_NO_GUARANTEE_LABEL="保証はありません。"
COM_CSPAGEPROTECTOR_NO_GUARANTEE_BODY="ボットやハッカーは執拗です。Cybersalt Page Protector はコンテンツを守るために最善を尽くしますが、悪意のある第三者が別の回避方法を見つけないとは保証できません。いつものことですが、オンラインに出したくない情報は、オンラインに載せないでください。"
