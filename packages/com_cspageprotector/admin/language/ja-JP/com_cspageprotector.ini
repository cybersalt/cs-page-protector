; Options - Protection
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION="保護"
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_DESC="ブラウザチェックを行うページ。チェックによってスクレイピングは遅く、高コストになりますが、コンテンツが決してコピーされないとは約束できません。"
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_SUBTITLE="チェックを通過しないと見られないページを選びます"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_LABEL="保護対象"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_DESC="選んだメニュー項目だけを保護するか、サイト全体を保護して公開しておくメニュー項目を選ぶかを指定します。"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_SELECTED="選択したページのみ"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_ALL_EXCEPT="選択したページ以外のすべてのページ"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_LABEL="メニュー項目"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_DESC="この設定を適用するページです。メニュー項目の下に表示されるものも対象になります（例：保護されたカテゴリブログから開いた記事）。"
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_LABEL="同じコンテンツへの別ルートも対象にする"
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_DESC="スクレイパーは、別のメニュー項目、単純な index.php のリンク、ブログや注目記事の一覧、タグの一覧、記事モジュール、フィードなどから同じ記事にたどり着くことがあります。これを有効にすると、保護された記事（または保護されたカテゴリ内のすべての記事）は、これらすべての経路でも保護されます。一覧には本文の代わりに短いお知らせが表示され、その記事を含むフィードは拒否されます。スマート検索の検索結果には短い抜粋が表示されることがあります。これは Joomla がインデックス作成時に抜粋を保存するためです。"

; Options - Challenge
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE="チェック"
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_DESC="訪問者に表示される内容と、通行証の有効期間。"
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_SUBTITLE="チェックそのもの、表示する文言、通行証の有効期間"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_LABEL="キャプチャ"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_DESC="チェックを実行する Joomla のキャプチャプラグインです。Joomla 標準の Proof-of-Work キャプチャ（Joomla 6.1 以降）をおすすめします。外部サービスを使わず、第三者の Cookie もなく、訪問者がクリックする必要もありません。難易度はキャプチャプラグイン側の設定で指定します。インストール済みの他のキャプチャプラグインも使用できます。"
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_DISABLED="%s（無効）"
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_POW_MISSING="CAPTCHA - Proof of Work（Joomla 6.1 以降が必要、未インストール）"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_LABEL="キャプチャを実行できない場合"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_DESC="選択したキャプチャプラグインが無効または見つからない場合の動作です。訪問者を通過させるとサイトは使える状態のままです。ブロックするとコンテンツは保護されたままですが、すべての訪問者にエラーが表示されます。"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_ALLOW="訪問者を通過させる（エラーを記録）"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_BLOCK="ページをブロックする"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_LABEL="チェックを自動で開始する"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_DESC="訪問者がチェックボックスにチェックを入れるのを待たずに、ページが読み込まれたらすぐにプルーフ・オブ・ワークの計算を始めます。Proof-of-Work キャプチャにのみ適用されます。"
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_LABEL="解けたら自動で続行する"
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_DESC="チェックが解けたらすぐに、訪問者に「続行」をクリックさせずにページへ進ませます。Proof-of-Work キャプチャにのみ適用されます。"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_LABEL="通行証の有効期間"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_DESC="一度通過した訪問者は、この期間中、追加のチェックなしで保護されたすべてのページを開けます。"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_1H="1 時間"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_6H="6 時間"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_12H="12 時間"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_24H="24 時間"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_3D="3 日"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_7D="7 日"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_30D="30 日"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_LABEL="通行証を訪問者の IP に結び付ける"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_DESC="コピーされた通行証を、他のアドレスからは使えなくします。モバイルネットワークの訪問者が多い場合は無効のままにしてください。IP が頻繁に変わるため、そのたびにチェックされることになります。"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_LABEL="チェックページの HTTP ステータス"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_DESC="200 はどの環境でも動作します。403 はボットに拒否されたことをはっきり伝えますが、一部のホスティングでは 403 ページが独自のエラーページに置き換えられ、本物の訪問者にチェックが表示されなくなります。切り替える前にテストしてください。"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_200="200 OK（推奨）"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_403="403 Forbidden"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_LABEL="見出し"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_DESC="チェックの上に表示する見出しです。空欄にすると既定の見出しになります。"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_LABEL="メッセージ"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_DESC="見出しの下に表示するテキストです。基本的な HTML を使えます。空欄にすると既定のメッセージになります。"
COM_CSPAGEPROTECTOR_CHALLENGE_HEADING_DEFAULT="ブラウザを確認しています"
COM_CSPAGEPROTECTOR_CHALLENGE_MESSAGE_DEFAULT="少しだけお待ちください。自動化されたスクレイパーからこのページを守るための確認です。"

; Options - Exemptions
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS="除外"
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_DESC="チェックを省略できる対象。"
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_SUBTITLE="チェックが表示されない対象"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_LABEL="ログイン中のユーザーはチェックを省略"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_DESC="サイトにログインしている人は、保護されたページにそのままアクセスできます。一部のユーザーグループだけを除外したい場合は、これを無効にしてください。"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_LABEL="チェックを省略するユーザーグループ"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_DESC="これらのグループ（またはその下位グループ）に属するログイン中のメンバーは、チェックを省略します。"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_LABEL="確認済みの検索エンジンを通過させる"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_DESC="Googlebot、Bingbot、Applebot、YandexBot、Baiduspider、Yahoo Slurp はチェックを省略します。ただし、逆引きと正引きの DNS 照会で、リクエストが本当にその検索エンジンから来ていることを確認できた場合に限ります。Googlebot を名乗っているだけのスクレイパーはチェックされます。GPTBot や ClaudeBot などの AI クローラーはこのリストに含まれません。これを無効にすると、保護されたページは検索結果から外れます。"
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_LABEL="検索エンジンのアクセスを記録する"
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_DESC="確認済みの検索エンジンを通過させるたびにログエントリを書き込みます。クローラーは頻繁にアクセスするため、既定では無効です。"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_LABEL="チェックを省略する IP アドレス"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_DESC="1 行に 1 つずつ入力します。単一のアドレス（203.0.113.7）と範囲（203.0.113.0/24、2001:db8::/32）のどちらも使えます。# で始まる行は無視されます。オフィス、稼働監視サービス、取引先などに便利です。"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_HINT="203.0.113.7 または 198.51.100.0/24"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_LABEL="訪問者 IP の取得元"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_DESC="サイトがプロキシや CDN の背後にある場合にのみ変更してください。選んだヘッダーは、リクエストが実際にそのプロキシを経由している場合にのみ信頼されます。Cloudflare の場合は Cloudflare 自身のアドレス、それ以外の場合は「信頼するプロキシ」に入力したアドレス（このリストが空の場合は、同じサーバーまたはプライベートネットワーク上のプロキシ）です。それ以外の相手が送ってきたヘッダーは無視されるため、誰も許可リストのアドレスになりすますことはできません。"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_REMOTE_ADDR="接続そのもの（プロキシなし）"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_CLOUDFLARE="Cloudflare (CF-Connecting-IP)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_XFF="プロキシ / ロードバランサー (X-Forwarded-For)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_X_REAL_IP="Nginx プロキシ (X-Real-IP)"

; Options - Logging
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING="ログ"
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_DESC="イベントログに記録する内容と保存期間。"
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_SUBTITLE="ダッシュボードの元になるイベントログ"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_LABEL="イベントログを記録する"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_DESC="チェック、通過、失敗、ブロックをそれぞれ記録します。ダッシュボードとイベントログにはこの設定が必要です。"
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_LABEL="IP アドレスを短縮する"
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_DESC="既定で有効です。各アドレスのネットワーク部分だけを保存し（203.0.113.7 ではなく 203.0.113.0）、GDPR などのプライバシー規則に配慮したログにします。リクエストの処理中は保護に完全なアドレスを使い、保存する内容だけを短縮します。これを有効にすると、ログにある既存のアドレスも短縮されます。ファイアウォールで 1 つの IP をブロックする場合など、正確なアドレスが必要なときだけ無効にしてください。"
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_LABEL="エントリの保存期間（日）"
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_DESC="これより古いエントリは自動的に削除されます。0 にすると無期限に保存します。"

