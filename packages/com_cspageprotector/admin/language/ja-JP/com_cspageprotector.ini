COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_DESC="自分で管理するプロキシやロードバランサーのアドレスまたは範囲を、1 行に 1 つずつ入力します。これらから届いた X-Forwarded-For / X-Real-IP ヘッダーは信頼され、それ以外からのものは信頼されません。プロキシが同じサーバーまたはプライベートネットワーク内で動作している場合は空のままにしてください。Cloudflare には不要です。"
