COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_DESC="Overskrift som vises over kontrollen. La stå tomt for standardteksten."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_LABEL="Melding"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_DESC="Tekst som vises under overskriften. Enkel HTML er tillatt. La stå tomt for standardteksten."
