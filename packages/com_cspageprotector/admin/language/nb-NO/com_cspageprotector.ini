COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_30D="30 dager"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_LABEL="Knytt godkjenningen til den besøkendes IP"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_DESC="Gjør en kopiert godkjenning ubrukelig fra alle andre adresser. La dette være av hvis mange av de besøkende bruker mobilnett, der IP-adressen ofte endres og de da ville blitt kontrollert på nytt hver gang."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_LABEL="HTTP-status for kontrollsiden"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_DESC="200 fungerer overalt. 403 forteller roboter tydelig at de er avvist, men noen leverandører av webhotell erstatter 403-sider med sin egen feilside, noe som ville skjult kontrollen for ekte besøkende. Test før du bytter."
