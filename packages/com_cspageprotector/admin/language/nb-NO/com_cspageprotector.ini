; Dashboard
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_HEADING="Slik fungerer Page Protector"
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_BODY="Besøkende på en beskyttet side ser først en kort nettleserkontroll. Nettleseren deres løser et lite proof-of-work-puslespill (omtrent ett sekund for et menneske, reell CPU-kostnad for en skraper som henter tusenvis av sider). Deretter får de en godkjenning og kan bruke beskyttede sider som vanlig til den utløper. Innloggede brukere, tillatte IP-adresser og verifiserte søkemotorer kan hoppe over kontrollen."
COM_CSPAGEPROTECTOR_NO_GUARANTEE_LABEL="Ingen garanti."
COM_CSPAGEPROTECTOR_NO_GUARANTEE_BODY="Roboter og hackere er iherdige. Cybersalt Page Protector gjør sitt beste for å beskytte innholdet ditt, men vi kan ikke garantere at ondsinnede aktører ikke finner en annen vei rundt det. Som alltid: er det informasjon du ikke vil ha på nettet, så ikke legg den ut på nettet."
