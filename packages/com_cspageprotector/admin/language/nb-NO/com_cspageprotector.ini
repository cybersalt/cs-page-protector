COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_DESC="Alle som er logget inn på nettstedet, går rett til beskyttede sider. Slå av dette for å unnta bare noen brukergrupper."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_LABEL="Brukergrupper som hopper over kontrollen"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_DESC="Innloggede medlemmer av disse gruppene (eller av en gruppe under dem) hopper over kontrollen."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_LABEL="Slipp inn verifiserte søkemotorer"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_DESC="Googlebot, Bingbot, Applebot, YandexBot, Baiduspider og Yahoo Slurp hopper over kontrollen, men først etter at et omvendt og et vanlig DNS-oppslag har bekreftet at forespørselen virkelig kommer fra den søkemotoren. En skraper som bare later som den er Googlebot, blir fortsatt kontrollert. KI-crawlere som GPTBot og ClaudeBot er ikke på denne listen. Hvis du slår av dette, forsvinner beskyttede sider fra søkeresultatene."
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_LABEL="Logg besøk fra søkemotorer"
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_DESC="Skriv en loggoppføring hver gang en verifisert søkemotor slippes inn. Av som standard fordi crawlere kommer svært ofte."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_LABEL="IP-adresser som hopper over kontrollen"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_DESC="Én per linje. Både enkeltadresser (203.0.113.7) og områder (203.0.113.0/24, 2001:db8::/32) fungerer. Linjer som begynner med # ignoreres. Nyttig for kontoret ditt, oppetidsovervåking og partnere."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_HINT="203.0.113.7 eller 198.51.100.0/24"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_LABEL="Besøkendes IP kommer fra"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_DESC="Endre dette bare hvis nettstedet ligger bak en proxy eller et CDN. Den valgte headeren stoles bare på når forespørselen faktisk kommer gjennom den proxyen: for Cloudflare, Cloudflares egne adresser; for de andre, adressene i \"Klarerte proxyer\" (eller en proxy på samme server eller i et privat nettverk når den listen er tom). Sender noen andre headeren, ignoreres den, så ingen kan utgi seg for å være en tillatt adresse."
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_REMOTE_ADDR="Selve tilkoblingen (ingen proxy)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_CLOUDFLARE="Cloudflare (CF-Connecting-IP)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_XFF="Proxy / lastbalanserer (X-Forwarded-For)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_X_REAL_IP="Nginx-proxy (X-Real-IP)"

; Options - Logging
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING="Logging"
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_DESC="Hva som skrives til hendelsesloggen, og hvor lenge det lagres."
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_SUBTITLE="Hendelsesloggen bak oversikten"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_LABEL="Før hendelseslogg"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_DESC="Registrer hver kontroll, godkjenning, feil og blokkering. Oversikten og hendelsesloggen trenger dette."
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_LABEL="Forkort IP-adresser"
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_DESC="På som standard. Lagre bare nettverksdelen av hver adresse (203.0.113.0 i stedet for 203.0.113.7), noe som gjør loggen mer personvernvennlig etter regler som GDPR. Beskyttelsen bruker fortsatt hele adressen mens forespørselen pågår; bare det som lagres, forkortes. Når du slår på dette, forkortes også adressene som allerede ligger i loggen. Slå det bare av hvis du trenger nøyaktige adresser, for eksempel for å blokkere én IP-adresse i brannmuren din."
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_LABEL="Behold oppføringer i (dager)"
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_DESC="Eldre oppføringer slettes automatisk. 0 beholder dem for alltid."

; Options - Support
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT="Support"
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_DESC="Hvem du skal kontakte når noe går galt."
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_SUBTITLE="Kontaktinformasjon for support som vises i oversikten (aldri for besøkende på nettstedet)"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_LABEL="E-post til support"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_DESC="Vises i oversikten slik at administratorer vet hvem de skal kontakte. Vises aldri for besøkende på nettstedet."
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_LABEL="Supportside"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_DESC="Lenke til et kontaktskjema eller en hjelpeside."
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_LABEL_LABEL="Navn på support"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_LABEL_DESC="Hva support kalles i meldinger, for eksempel \"Cybersalt support\" eller \"teamet bak nettstedet\"."

; Challenge page strings also used from admin (shared helpers)
COM_CSPAGEPROTECTOR_CHALLENGE_CONTINUE="Fortsett"
COM_CSPAGEPROTECTOR_CHALLENGE_WORKING="Sjekker nettleseren din..."
COM_CSPAGEPROTECTOR_CHALLENGE_DONE="Ferdig - du sendes videre til siden."
COM_CSPAGEPROTECTOR_CHALLENGE_EXPIRED="Kontrollen er utløpt. Prøv igjen."
COM_CSPAGEPROTECTOR_CHALLENGE_FAILED="Kontrollen gikk ikke gjennom. Prøv igjen."
COM_CSPAGEPROTECTOR_CHALLENGE_UNAVAILABLE="Nettleserkontrollen er ikke tilgjengelig akkurat nå. Prøv igjen senere."
COM_CSPAGEPROTECTOR_CHALLENGE_NOSCRIPT="Denne siden trenger at JavaScript er slått på for å fullføre kontrollen."
COM_CSPAGEPROTECTOR_CHALLENGE_WHY="Hvorfor ser jeg dette?"
COM_CSPAGEPROTECTOR_CHALLENGE_WHY_BODY="Dette nettstedet ber nettleseren din løse et lite puslespill før noen sider vises. Det tar et sekund for et menneske, men gjør det dyrt for automatiske verktøy å kopiere hele nettstedet. Du blir ikke spurt igjen på en stund."

; Options - Modules
COM_CSPAGEPROTECTOR_FIELDSET_MODULES="Moduler"
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_DESC="Beskytt innholdet i moduler på alle sider der de vises. Så lenge moduler eller innhold er beskyttet, omgås Joomlas egen visnings- og modulbuffer, slik at en bufret kopi aldri kan nå en besøkende som ikke har bestått kontrollen. Sidebufferen håndteres separat og fortsetter å virke for andre sider."
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_SUBTITLE="Hold modulinnhold borte fra skrapere, også på sider som ikke er beskyttet"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_LABEL="Beskyttede moduler"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_DESC="Disse modulene vises bare for besøkende som har bestått kontrollen (eller hopper over den: innloggede brukere, tillatte IP-adresser, verifiserte søkemotorer), på alle sider der de vises. Nyttig for kontaktinformasjon, priser eller medlemsinformasjon i en bunntekst eller et sidefelt."
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_LABEL="Beskyttede modulposisjoner"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_DESC="Alle moduler i disse posisjonene er beskyttet, også moduler som legges til der senere."
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES="%2$s (%1$d moduler)"
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES_1="%2$s (1 modul)"
COM_CSPAGEPROTECTOR_NO_POSITION="(ingen posisjon)"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_LABEL="Besøkende som ikke har bestått, ser"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_DESC="En plassholder beholder modulens tittel og boks, med en \"Vis innhold\"-knapp som kjører kontrollen og kommer rett tilbake. Skjuling fjerner modulen helt, slik at posisjonen lukkes; besøkende ser den da først etter å ha bestått kontrollen et annet sted, for eksempel på en beskyttet side. Uansett vises captchaen aldri inne i en modul, så en side har aldri mer enn én."
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_PLACEHOLDER="En plassholder med en \"Vis innhold\"-knapp"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_HIDE="Ingenting: skjul modulen helt"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_LABEL="Plassholdertekst"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_DESC="Vises i stedet for modulens innhold. La stå tomt for standardteksten."
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_LABEL="Knappetekst"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_DESC="Teksten på knappen som kjører kontrollen. La stå tomt for standardteksten."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_TEXT_DEFAULT="Dette innholdet vises etter en rask nettleserkontroll."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_BUTTON_DEFAULT="Vis innhold"

; Dashboard - modules
COM_CSPAGEPROTECTOR_DASHBOARD_PROTECTED_MODULES="Beskyttede moduler"
COM_CSPAGEPROTECTOR_DASHBOARD_NO_MODULES="Ingen moduler er beskyttet. Velg moduler eller posisjoner i fanen Moduler under Innstillinger."
COM_CSPAGEPROTECTOR_HEADING_MODULE="Modul"
COM_CSPAGEPROTECTOR_HEADING_POSITION="Posisjon"
COM_CSPAGEPROTECTOR_PROTECTED_BY_POSITION="hele posisjonen"
COM_CSPAGEPROTECTOR_CHOOSE_MODULES="Velg moduler"
COM_CSPAGEPROTECTOR_CHECK_MODULES_N="%d moduler er beskyttet."
COM_CSPAGEPROTECTOR_CHECK_MODULES_N_1="1 modul er beskyttet."
COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_LABEL="Klarerte proxyer"
COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_DESC="Adressene eller områdene til dine egne proxyer eller lastbalanserere, én per linje. Headeren X-Forwarded-For / X-Real-IP fra dem stoles på, men ikke fra noen andre. La feltet stå tomt hvis proxyen kjører på samme server eller i et privat nettverk. Ikke nødvendig for Cloudflare."
COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_HINT="10.0.0.0/8 eller 192.0.2.10"
