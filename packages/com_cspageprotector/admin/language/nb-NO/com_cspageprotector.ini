COM_CSPAGEPROTECTOR_SUPPORT_COMMUNITY_BODY="Send oss feilrapporter, ønsker om funksjoner, spørsmål og ideer - vi leser hver eneste en og setter pris på tilbakemeldingene. Cybersalt Page Protector er gratis og åpen kildekode, og support gis etter beste evne: tiden vår til gratis support er begrenset, så svar kan ta litt tid. Hvis du trenger garantert svartid eller praktisk hjelp på nettstedet ditt, kan du få betalt support via skjemaet for supportforespørsler."
