; Options - Protection
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION="Beskyttelse"
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_DESC="Hvilke sider som får nettleserkontrollen. Kontrollen gjør skraping tregere og dyrere, men kan ikke love at innholdet ditt aldri blir kopiert."
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_SUBTITLE="Velg hvilke sider besøkende må bestå en kontroll for å se"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_LABEL="Beskytt"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_DESC="Beskytt bare menyelementene du velger, eller beskytt hele nettstedet og velg menyelementene som skal være åpne."
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_SELECTED="Bare de valgte sidene"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_ALL_EXCEPT="Alle sider unntatt de valgte"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_LABEL="Menyelementer"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_DESC="Sidene dette gjelder for. Alt som vises under et menyelement, er også dekket, for eksempel artiklene som åpnes fra en beskyttet kategoriblogg."
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_LABEL="Fang også opp andre veier til det samme innholdet"
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_DESC="Skrapere når av og til den samme artikkelen via et annet menyelement, en enkel index.php-lenke, en blogg eller liste over utvalgte artikler, en stikkordliste, en artikkelmodul eller en nyhetsstrøm (feed). Når dette er på, er en beskyttet artikkel (eller enhver artikkel i en beskyttet kategori) beskyttet også på alle disse stedene: lister viser en kort melding i stedet for teksten, og nyhetsstrømmer som ville tatt den med, avvises. Søkeresultater fra Smart søk kan fortsatt vise et kort utdrag, fordi Joomla lagrer disse ved indeksering."

; Options - Challenge
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE="Kontroll"
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_DESC="Hva besøkende ser, og hvor lenge godkjenningen deres varer."
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_SUBTITLE="Selve kontrollen, tekstene og hvor lenge en godkjenning varer"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_LABEL="Captcha"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_DESC="Hvilket captcha-programtillegg i Joomla som kjører kontrollen. Joomlas egen Proof-of-Work-captcha (Joomla 6.1+) anbefales: ingen tredjepartstjeneste, ingen informasjonskapsler fra andre og ingenting den besøkende må klikke på. Vanskelighetsgraden stilles inn i innstillingene til selve captcha-programtillegget. Et hvilket som helst annet installert captcha-programtillegg kan brukes i stedet."
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_DISABLED="%s (deaktivert)"
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_POW_MISSING="CAPTCHA - Proof of Work (krever Joomla 6.1+, ikke installert)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_LABEL="Hvis captchaen ikke kan kjøres"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_DESC="Hva som skjer når det valgte captcha-programtillegget er deaktivert eller mangler. Å slippe inn besøkende holder nettstedet brukbart; å blokkere holder innholdet låst, men viser alle besøkende en feilmelding."
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_ALLOW="Slipp inn besøkende (og logg en feil)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_BLOCK="Blokker siden"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_LABEL="Start kontrollen automatisk"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_DESC="Begynn å løse proof-of-work-oppgaven så snart siden er lastet, i stedet for å vente på at den besøkende krysser av i boksen. Gjelder bare Proof-of-Work-captchaen."
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_LABEL="Fortsett automatisk når den er løst"
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_DESC="Send den besøkende videre til siden så snart kontrollen er løst, uten at de må klikke på Fortsett. Gjelder bare Proof-of-Work-captchaen."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_LABEL="Godkjenningen varer i"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_DESC="Etter å ha bestått én gang kan en besøkende åpne alle beskyttede sider uten ny kontroll så lenge."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_1H="1 time"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_6H="6 timer"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_12H="12 timer"
