; Support
COM_CSPAGEPROTECTOR_SUPPORT_HEADING="Hulp en ondersteuning"
COM_CSPAGEPROTECTOR_SUPPORT_COMMUNITY_HEADING="We horen graag van u"
COM_CSPAGEPROTECTOR_SUPPORT_COMMUNITY_BODY="Stuur ons uw foutmeldingen, functieverzoeken, vragen en ideeën - we lezen ze allemaal en waarderen de feedback. Cybersalt Page Protector is gratis en open source, en ondersteuning gebeurt op basis van beste inspanning: onze tijd voor gratis ondersteuning is beperkt, dus een antwoord kan even duren. Hebt u een gegarandeerde reactietijd of praktische hulp op uw website nodig, dan is betaalde ondersteuning beschikbaar via het ondersteuningsformulier."
