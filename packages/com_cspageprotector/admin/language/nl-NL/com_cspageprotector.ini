; Dashboard
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_HEADING="Zo werkt Page Protector"
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_BODY="Bezoekers van een beveiligde pagina zien eerst een korte browsercontrole. Hun browser lost een kleine proof-of-work-puzzel op (ongeveer een seconde voor een mens, echte CPU-kosten voor een scraper die duizenden pagina's opvraagt). Daarna krijgen ze een toegangspas en kunnen ze beveiligde pagina's gewoon bekijken tot die verloopt. Ingelogde gebruikers, toegestane IP-adressen en geverifieerde zoekmachines kunnen de controle overslaan."
