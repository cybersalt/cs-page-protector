COM_CSPAGEPROTECTOR_DASHBOARD_TOP_IPS_HINT="Veel controles en geen enkele geslaagde wijst meestal op een scraper. De kopieerknop geeft u het adres (of het bereik, als IP-adressen worden ingekort), klaar om te blokkeren in uw firewall."
