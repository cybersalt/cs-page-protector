COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT="Ondersteuning"
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_DESC="Met wie u contact opneemt als er iets misgaat."
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_SUBTITLE="Contactgegevens voor ondersteuning, getoond op het dashboard (nooit aan bezoekers van de website)"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_LABEL="E-mailadres ondersteuning"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_DESC="Getoond op het dashboard zodat beheerders weten met wie ze contact kunnen opnemen. Nooit getoond aan bezoekers van de website."
