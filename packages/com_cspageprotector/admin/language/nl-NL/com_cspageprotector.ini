COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_DESC="Link naar een contactformulier of hulppagina."
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_LABEL_LABEL="Naam ondersteuning"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_LABEL_DESC="Hoe de ondersteuning in berichten wordt genoemd, bijvoorbeeld \"Cybersalt-ondersteuning\" of \"het websiteteam\"."

