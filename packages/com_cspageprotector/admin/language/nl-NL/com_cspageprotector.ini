COM_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Door <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Plaatst een proof-of-work-controle vóór de pagina's die u kiest, zodat scrapers echte rekentijd moeten besteden voordat ze bij uw inhoud komen. Echte bezoekers zien één keer een korte stap &quot;uw browser wordt gecontroleerd&quot; en surfen daarna gewoon verder. Voor Joomla 5 en 6 (de Proof-of-Work-captcha uit de Joomla-kern vereist Joomla 6.1 of hoger)."

