COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_DESC="De adressen of bereiken van uw eigen proxy's of load balancers, één per regel. Hun header X-Forwarded-For / X-Real-IP wordt vertrouwd; die van anderen niet. Laat dit leeg als de proxy op dezelfde server of in een privénetwerk draait. Niet nodig voor Cloudflare."
