COM_CSPAGEPROTECTOR_CHALLENGE_WHY="Waarom zie ik dit?"
COM_CSPAGEPROTECTOR_CHALLENGE_WHY_BODY="Deze website vraagt uw browser een kleine puzzel op te lossen voordat sommige pagina's worden getoond. Voor een mens duurt dat een seconde, maar het maakt het duur voor geautomatiseerde tools om de hele website te kopiëren. U krijgt deze vraag een tijdje niet meer."

; Options - Modules
COM_CSPAGEPROTECTOR_FIELDSET_MODULES="Modules"
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_DESC="Beveilig de inhoud van modules, op elke pagina waarop ze verschijnen. Zolang er modules of inhoud beveiligd zijn, worden de eigen weergave- en modulecache van Joomla overgeslagen, zodat een gecachte kopie nooit bij een bezoeker terechtkomt die de controle niet heeft doorstaan. De paginacache wordt apart afgehandeld en blijft werken voor andere pagina's."
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_SUBTITLE="Houd module-inhoud weg van scrapers, ook op pagina's die niet beveiligd zijn"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_LABEL="Beveiligde modules"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_DESC="Deze modules worden alleen getoond aan bezoekers die de controle hebben doorstaan (of die hem overslaan: ingelogde gebruikers, toegestane IP-adressen, geverifieerde zoekmachines), op elke pagina waarop ze verschijnen. Handig voor contactgegevens, prijzen of ledeninformatie in een footer of zijbalk."
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_LABEL="Beveiligde moduleposities"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_DESC="Elke module op deze posities is beveiligd, ook modules die er later worden toegevoegd."
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES="%2$s (%1$d modules)"
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES_1="%2$s (1 module)"
COM_CSPAGEPROTECTOR_NO_POSITION="(geen positie)"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_LABEL="Bezoekers die niet geslaagd zijn, zien"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_DESC="Een plaatshouder behoudt de titel en het kader van de module, met een knop \"Inhoud tonen\" die de controle uitvoert en direct terugkeert. Verbergen verwijdert de module volledig, zodat de positie wegvalt; bezoekers zien de module dan pas nadat ze de controle ergens anders hebben doorstaan, bijvoorbeeld op een beveiligde pagina. In beide gevallen wordt de captcha nooit binnen een module getoond, zodat een pagina er nooit meer dan één heeft."
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_PLACEHOLDER="Een plaatshouder met een knop \"Inhoud tonen\""
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_HIDE="Niets: de module volledig verbergen"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_LABEL="Tekst plaatshouder"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_DESC="Getoond in plaats van de inhoud van de module. Laat leeg voor de standaardtekst."
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_LABEL="Knoptekst"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_DESC="Tekst op de knop die de controle uitvoert. Laat leeg voor de standaardtekst."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_TEXT_DEFAULT="Deze inhoud verschijnt na een korte browsercontrole."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_BUTTON_DEFAULT="Inhoud tonen"

