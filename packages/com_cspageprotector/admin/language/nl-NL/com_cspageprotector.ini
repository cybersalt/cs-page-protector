; Options - Protection
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION="Beveiliging"
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_DESC="Welke pagina's de browsercontrole krijgen."
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_SUBTITLE="Kies voor welke pagina's bezoekers eerst een controle moeten doorstaan"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_LABEL="Beveiligen"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_DESC="Beveilig alleen de menu-items die u kiest, of beveilig de hele website en kies de menu-items die open moeten blijven."
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_SELECTED="Alleen de geselecteerde pagina's"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_ALL_EXCEPT="Elke pagina behalve de geselecteerde"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_LABEL="Menu-items"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_DESC="De pagina's waarop dit van toepassing is. Alles wat onder een menu-item wordt getoond valt er ook onder, bijvoorbeeld de artikelen die vanuit een beveiligde categorieblog worden geopend."
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_LABEL="Ook andere routes naar dezelfde inhoud afvangen"
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_DESC="Scrapers komen soms bij hetzelfde artikel via een ander menu-item, een kale index.php-link, een blog of lijst met uitgelichte artikelen, een tagoverzicht, een artikelenmodule of een feed. Met deze optie aan is een beveiligd artikel (of elk artikel binnen een beveiligde categorie) ook op al die plekken beveiligd: lijsten tonen een korte melding in plaats van de tekst, en feeds waarin het zou staan worden geweigerd. Zoekresultaten van Slim zoeken kunnen nog wel een kort fragment tonen, omdat Joomla die opslaat bij het indexeren."

; Options - Challenge
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE="Controle"
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_DESC="Wat bezoekers zien en hoe lang hun toegangspas geldig blijft."
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_SUBTITLE="De controle zelf, de teksten en hoe lang een toegangspas geldig blijft"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_LABEL="Captcha"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_DESC="Welke Joomla captcha-plugin de controle uitvoert. De eigen Proof-of-Work-captcha van Joomla (Joomla 6.1+) wordt aanbevolen: geen externe dienst, geen cookies van anderen en niets waarop de bezoeker hoeft te klikken. De moeilijkheidsgraad stelt u in bij de instellingen van de captcha-plugin zelf. U kunt ook elke andere geïnstalleerde captcha-plugin gebruiken."
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_DISABLED="%s (uitgeschakeld)"
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_POW_MISSING="CAPTCHA - Proof of Work (vereist Joomla 6.1+, niet geïnstalleerd)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_LABEL="Als de captcha niet kan werken"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_DESC="Wat er gebeurt als de gekozen captcha-plugin is uitgeschakeld of ontbreekt. Bezoekers doorlaten houdt de website bruikbaar; blokkeren houdt de inhoud afgeschermd, maar toont elke bezoeker een foutmelding."
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_ALLOW="Bezoekers doorlaten (en een fout loggen)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_BLOCK="De pagina blokkeren"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_LABEL="De controle automatisch starten"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_DESC="Begin met het oplossen van de proof-of-work zodra de pagina is geladen, in plaats van te wachten tot de bezoeker het vakje aanvinkt. Geldt alleen voor de Proof-of-Work-captcha."
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_LABEL="Automatisch doorgaan na oplossen"
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_DESC="Stuur de bezoeker door naar de pagina zodra de controle is opgelost, zonder dat die op Doorgaan hoeft te klikken. Geldt alleen voor de Proof-of-Work-captcha."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_LABEL="Toegangspas geldig"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_DESC="Na één keer slagen kan een bezoeker zo lang elke beveiligde pagina openen zonder nieuwe controle."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_1H="1 uur"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_6H="6 uur"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_12H="12 uur"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_24H="24 uur"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_3D="3 dagen"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_7D="7 dagen"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_30D="30 dagen"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_LABEL="Toegangspas koppelen aan het IP van de bezoeker"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_DESC="Maakt een gekopieerde toegangspas onbruikbaar vanaf elk ander adres. Laat dit uit als veel van uw bezoekers mobiele netwerken gebruiken, waar het IP-adres vaak verandert en ze dan steeds opnieuw gecontroleerd zouden worden."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_LABEL="HTTP-status van de controlepagina"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_DESC="200 werkt overal. 403 vertelt bots duidelijk dat ze geweigerd zijn, maar sommige hosts vervangen 403-pagina's door hun eigen foutpagina, waardoor echte bezoekers de controle niet te zien krijgen. Test dit voordat u overstapt."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_200="200 OK (aanbevolen)"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_403="403 Forbidden"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_LABEL="Kop"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_DESC="Kop boven de controle. Laat leeg voor de standaardtekst."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_LABEL="Bericht"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_DESC="Tekst onder de kop. Eenvoudige HTML is toegestaan. Laat leeg voor de standaardtekst."
COM_CSPAGEPROTECTOR_CHALLENGE_HEADING_DEFAULT="Uw browser wordt gecontroleerd"
COM_CSPAGEPROTECTOR_CHALLENGE_MESSAGE_DEFAULT="Dit duurt maar even. Het helpt om geautomatiseerde scrapers bij deze pagina weg te houden."

; Options - Exemptions
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS="Uitzonderingen"
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_DESC="Wie de controle mag overslaan."
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_SUBTITLE="Wie de controle nooit ziet"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_LABEL="Ingelogde gebruikers slaan de controle over"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_DESC="Iedereen die op de website is ingelogd, gaat direct naar beveiligde pagina's. Zet dit uit om alleen bepaalde gebruikersgroepen uit te zonderen."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_LABEL="Gebruikersgroepen die de controle overslaan"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_DESC="Ingelogde leden van deze groepen (of van een groep daaronder) slaan de controle over."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_LABEL="Geverifieerde zoekmachines doorlaten"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_DESC="Googlebot, Bingbot, Applebot, YandexBot, Baiduspider en Yahoo Slurp slaan de controle over, maar pas nadat een reverse- en forward-DNS-lookup heeft bewezen dat het verzoek echt van die zoekmachine komt. Een scraper die alleen beweert Googlebot te zijn, wordt nog steeds gecontroleerd. AI-crawlers zoals GPTBot en ClaudeBot staan niet op deze lijst. Als u dit uitzet, verdwijnen beveiligde pagina's uit de zoekresultaten."
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_LABEL="Bezoeken van zoekmachines loggen"
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_DESC="Schrijf een logitem telkens wanneer een geverifieerde zoekmachine wordt doorgelaten. Standaard uit, omdat crawlers heel vaak langskomen."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_LABEL="IP-adressen die de controle overslaan"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_DESC="Eén per regel. Losse adressen (203.0.113.7) en bereiken (203.0.113.0/24, 2001:db8::/32) werken allebei. Regels die met # beginnen worden genegeerd. Handig voor uw kantoor, uptime-monitors en partners."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_HINT="203.0.113.7 of 198.51.100.0/24"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_LABEL="IP van bezoeker komt van"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_DESC="Wijzig dit alleen als de website achter een proxy of CDN staat. De gekozen header wordt alleen vertrouwd als het verzoek echt via die proxy binnenkomt: bij Cloudflare via de eigen adressen van Cloudflare; bij de andere via de adressen in \"Vertrouwde proxy's\" (of een proxy op dezelfde server of in een privénetwerk als die lijst leeg is). Stuurt iemand anders de header mee, dan wordt die genegeerd, zodat niemand zich kan voordoen als een toegestaan adres."
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_REMOTE_ADDR="De verbinding zelf (geen proxy)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_CLOUDFLARE="Cloudflare (CF-Connecting-IP)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_XFF="Proxy / load balancer (X-Forwarded-For)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_X_REAL_IP="Nginx-proxy (X-Real-IP)"

; Options - Logging
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING="Loggen"
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_DESC="Wat er in het gebeurtenissenlog wordt geschreven en hoe lang."
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_SUBTITLE="Het gebeurtenissenlog achter het dashboard"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_LABEL="Een gebeurtenissenlog bijhouden"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_DESC="Leg elke controle, geslaagde poging, mislukte poging en blokkering vast. Het dashboard en het gebeurtenissenlog hebben dit nodig."
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_LABEL="IP-adressen inkorten"
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_DESC="Standaard aan. Sla alleen het netwerkdeel van elk adres op (203.0.113.0 in plaats van 203.0.113.7), waardoor het log beter past bij privacyregels zoals de AVG. De beveiliging gebruikt tijdens het verzoek nog steeds het volledige adres; alleen wat wordt opgeslagen, wordt ingekort. Als u dit inschakelt, worden ook de adressen die al in het log staan ingekort. Zet dit alleen uit als u exacte adressen nodig hebt, bijvoorbeeld om één IP-adres in uw firewall te blokkeren."
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_LABEL="Items bewaren (dagen)"
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_DESC="Oudere items worden automatisch verwijderd. 0 bewaart ze voor altijd."

