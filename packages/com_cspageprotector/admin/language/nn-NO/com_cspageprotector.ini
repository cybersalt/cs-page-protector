; Options - Protection
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION="Vern"
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_DESC="Kva sider som får nettlesarkontrollen."
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_SUBTITLE="Vel kva sider besøkjande må bestå ein kontroll for å sjå"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_LABEL="Vern"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_DESC="Vern berre menypunkta du vel, eller vern heile nettstaden og vel menypunkta som skal stå opne."
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_SELECTED="Berre dei valde sidene"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_ALL_EXCEPT="Alle sider utanom dei valde"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_LABEL="Menypunkt"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_DESC="Sidene dette gjeld for. Alt som blir vist under eit menypunkt, er òg dekt, til dømes artiklane som blir opna frå ein verna kategoriblogg."
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_LABEL="Fang òg andre vegar til det same innhaldet"
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_DESC="Skraperobotar når av og til den same artikkelen via eit anna menypunkt, ei vanleg index.php-lenkje, ein blogg eller ei liste over utvalde artiklar, ei stikkordliste, ein artikkelmodul eller ein nyheitsstraum (feed). Når dette er slått på, er ein verna artikkel (eller kva artikkel som helst i ein verna kategori) verna òg på alle desse stadene: lister viser ei kort melding i staden for teksten, og nyheitsstraumar som ville ha teke han med, blir avviste. Søkjeresultat frå Smart søk kan framleis vise eit kort utdrag, fordi Joomla lagrar dei ved indeksering."

; Options - Challenge
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE="Kontroll"
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_DESC="Kva besøkjande ser, og kor lenge løyvet deira varer."
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_SUBTITLE="Sjølve kontrollen, ordlyden og kor lenge eit løyve varer"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_LABEL="Captcha"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_DESC="Kva captcha-programtillegg i Joomla som køyrer kontrollen. Den innebygde Proof-of-Work-captchaen i Joomla (Joomla 6.1+) er tilrådd: ingen tredjepartsteneste, ingen informasjonskapslar frå andre og ingenting besøkjande må klikke på. Vanskegraden blir sett i innstillingane til sjølve captcha-programtillegget. Alle andre installerte captcha-programtillegg kan brukast i staden."
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_DISABLED="%s (deaktivert)"
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_POW_MISSING="CAPTCHA - Proof of Work (krev Joomla 6.1+, ikkje installert)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_LABEL="Om captchaen ikkje kan køyre"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_DESC="Kva som skjer når det valde captcha-programtillegget er deaktivert eller manglar. Slepper du besøkjande gjennom, held nettstaden fram med å fungere; blokkerer du, blir innhaldet verande låst, men alle besøkjande får sjå ein feil."
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_ALLOW="Slepp besøkjande gjennom (og logg ein feil)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_BLOCK="Blokker sida"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_LABEL="Start kontrollen automatisk"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_DESC="Byrj å løyse arbeidsprovet med ein gong sida er lasta, i staden for å vente på at besøkjande kryssar av i boksen. Gjeld berre Proof-of-Work-captchaen."
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_LABEL="Hald fram automatisk når kontrollen er løyst"
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_DESC="Send besøkjande vidare til sida med ein gong kontrollen er løyst, utan at dei må klikke på Hald fram. Gjeld berre Proof-of-Work-captchaen."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_LABEL="Løyvet varer"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_DESC="Etter å ha bestått éin gong kan besøkjande opne alle verna sider utan ny kontroll så lenge."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_1H="1 time"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_6H="6 timar"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_12H="12 timar"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_24H="24 timar"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_3D="3 dagar"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_7D="7 dagar"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_30D="30 dagar"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_LABEL="Knyt løyvet til IP-adressa til besøkjande"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_DESC="Gjer eit kopiert løyve ubrukeleg frå alle andre adresser. La dette vere av om mange av dei besøkjande brukar mobilnett, der IP-adressa ofte endrar seg og dei då ville bli kontrollerte på nytt kvar gong."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_LABEL="HTTP-status for kontrollsida"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_DESC="200 fungerer overalt. 403 seier rett ut til robotar at dei vart avviste, men nokre vertsleverandørar byter ut 403-sider med si eiga feilside, og då blir kontrollen gøymd for verkelege besøkjande. Test før du byter."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_200="200 OK (tilrådd)"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_403="403 Forbidden"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_LABEL="Overskrift"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_DESC="Overskrifta som blir vist over kontrollen. La feltet stå tomt for å bruke standardteksten."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_LABEL="Melding"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_DESC="Tekst som blir vist under overskrifta. Enkel HTML er tillate. La feltet stå tomt for å bruke standardteksten."
COM_CSPAGEPROTECTOR_CHALLENGE_HEADING_DEFAULT="Kontrollerer nettlesaren din"
COM_CSPAGEPROTECTOR_CHALLENGE_MESSAGE_DEFAULT="Dette tek berre eit augneblink. Det hjelper til med å halde automatiske skraperobotar borte frå denne sida."

; Options - Exemptions
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS="Unntak"
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_DESC="Kven som kan hoppe over kontrollen."
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_SUBTITLE="Kven som aldri ser kontrollen"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_LABEL="Innlogga brukarar hoppar over kontrollen"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_DESC="Alle som er logga inn på nettstaden, går rett til verna sider. Slå av dette om du berre vil gje unntak til nokre brukargrupper."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_LABEL="Brukargrupper som hoppar over kontrollen"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_DESC="Innlogga medlemmer av desse gruppene (eller av grupper under dei) hoppar over kontrollen."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_LABEL="Slepp inn verifiserte søkjemotorar"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_DESC="Googlebot, Bingbot, Applebot, YandexBot, Baiduspider og Yahoo Slurp hoppar over kontrollen, men berre etter at eit omvendt og eit vanleg DNS-oppslag viser at førespurnaden verkeleg kjem frå den søkjemotoren. Ein skraperobot som berre påstår at han er Googlebot, blir framleis kontrollert. KI-crawlarar som GPTBot og ClaudeBot er ikkje på denne lista. Slår du av dette, forsvinn verna sider frå søkjeresultata."
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_LABEL="Logg besøk frå søkjemotorar"
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_DESC="Skriv ei loggoppføring kvar gong ein verifisert søkjemotor blir sleppt inn. Av som standard, sidan crawlarar kjem på besøk svært ofte."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_LABEL="IP-adresser som hoppar over kontrollen"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_DESC="Éi per linje. Både enkeltadresser (203.0.113.7) og adresseområde (203.0.113.0/24, 2001:db8::/32) fungerer. Linjer som byrjar med # blir ignorerte. Nyttig for kontoret ditt, oppetidsovervaking og samarbeidspartnarar."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_HINT="203.0.113.7 eller 198.51.100.0/24"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_LABEL="IP-adressa til besøkjande kjem frå"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_DESC="Endre dette berre om nettstaden ligg bak ein proxy eller eit CDN. Headeren du vel, blir berre stolt på når førespurnaden verkeleg kjem gjennom den proxyen: for Cloudflare, Cloudflare sine eigne adresser; for dei andre, adressene i «Klarerte proxyar» (eller ein proxy på same tenar eller i eit privat nettverk når den lista er tom). Sender nokon andre headeren, blir han ignorert, så ingen kan late som dei er ei adresse på kvitlista."
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_REMOTE_ADDR="Sjølve tilkoplinga (ingen proxy)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_CLOUDFLARE="Cloudflare (CF-Connecting-IP)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_XFF="Proxy / lastbalanserar (X-Forwarded-For)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_X_REAL_IP="Nginx-proxy (X-Real-IP)"

; Options - Logging
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING="Logging"
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_DESC="Kva som blir skrive til hendingsloggen, og kor lenge det blir teke vare på."
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_SUBTITLE="Hendingsloggen bak kontrollpanelet"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_LABEL="Før hendingslogg"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_DESC="Registrer kvar kontroll, kvar bestått og ikkje bestått kontroll og kvar blokkering. Kontrollpanelet og hendingsloggen treng dette."
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_LABEL="Kort ned IP-adresser"
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_DESC="På som standard. Lagrar berre nettverksdelen av kvar adresse (203.0.113.0 i staden for 203.0.113.7), noko som gjer loggen meir i tråd med personvernreglar som GDPR. Vernet brukar framleis den fulle adressa medan førespurnaden køyrer; berre det som blir lagra, blir korta ned. Slår du dette på, blir òg adressene som alt ligg i loggen, korta ned. Slå det berre av om du treng eksakte adresser, til dømes for å blokkere éi enkelt IP-adresse i brannmuren."
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_LABEL="Ta vare på oppføringar i (dagar)"
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_DESC="Eldre oppføringar blir sletta automatisk. 0 tek vare på dei for alltid."

; Options - Support
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT="Støtte"
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_DESC="Kven du skal kontakte når noko går gale."
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_SUBTITLE="Kontaktinformasjon for støtte som blir vist på kontrollpanelet (aldri til besøkjande på nettstaden)"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_LABEL="E-post for støtte"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_DESC="Blir vist på kontrollpanelet slik at administratorane veit kven dei skal kontakte. Blir aldri vist til besøkjande på nettstaden."
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_LABEL="Støtteside"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_DESC="Lenkje til eit kontaktskjema eller ei hjelpeside."
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_LABEL_LABEL="Namn på støtta"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_LABEL_DESC="Kva støtta blir kalla i meldingar, til dømes «Cybersalt-støtte» eller «teamet bak nettstaden»."

