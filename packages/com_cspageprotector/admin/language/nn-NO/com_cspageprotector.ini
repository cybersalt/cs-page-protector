COM_CSPAGEPROTECTOR_CHALLENGE_NOSCRIPT="Denne sida treng at JavaScript er slått på for å fullføre kontrollen."
COM_CSPAGEPROTECTOR_CHALLENGE_WHY="Kvifor ser eg dette?"
COM_CSPAGEPROTECTOR_CHALLENGE_WHY_BODY="Denne nettstaden ber nettlesaren din løyse ei lita oppgåve før enkelte sider blir viste. For eit menneske tek det eit sekund, men det gjer det dyrt for automatiske verktøy å kopiere heile nettstaden. Du blir ikkje spurd igjen på ei stund."

; Options - Modules
COM_CSPAGEPROTECTOR_FIELDSET_MODULES="Modular"
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_DESC="Vern innhaldet i modular, på alle sider der dei blir viste. Så lenge modular eller innhald er verna, blir Joomla sitt eige mellomlager for visingar og modular gått utanom, slik at ein mellomlagra kopi aldri kan nå ein besøkjande som ikkje har bestått kontrollen. Sidemellomlageret blir handtert for seg og held fram med å verke for andre sider."
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_SUBTITLE="Hald modulinnhald borte frå skraperobotar, sjølv på sider som ikkje er verna"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_LABEL="Verna modular"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_DESC="Desse modulane blir berre viste til besøkjande som har bestått kontrollen (eller som hoppar over han: innlogga brukarar, IP-adresser på kvitlista, verifiserte søkjemotorar), på alle sider der dei finst. Nyttig for kontaktinformasjon, prisar eller medlemsinformasjon i botnfeltet eller i ein sidekolonne."
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_LABEL="Verna modulposisjonar"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_DESC="Alle modular i desse posisjonane er verna, òg modular som blir lagde til der seinare."
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES="%2$s (%1$d modular)"
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES_1="%2$s (1 modul)"
COM_CSPAGEPROTECTOR_NO_POSITION="(ingen posisjon)"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_LABEL="Besøkjande som ikkje har bestått, ser"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_DESC="Ein plasshaldar beheld tittelen og boksen til modulen og viser ein «Vis innhald»-knapp som køyrer kontrollen og kjem rett tilbake. Skjuler du modulen, blir han fjerna heilt, så posisjonen forsvinn; besøkjande ser han då berre etter å ha bestått kontrollen ein annan stad, til dømes på ei verna side. Uansett blir captchaen aldri vist inne i ein modul, så ei side har aldri meir enn éin."
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_PLACEHOLDER="Ein plasshaldar med ein «Vis innhald»-knapp"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_HIDE="Ingenting: skjul modulen heilt"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_LABEL="Plasshaldartekst"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_DESC="Blir vist i staden for innhaldet i modulen. La feltet stå tomt for å bruke standardteksten."
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_LABEL="Knappetekst"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_DESC="Teksten på knappen som køyrer kontrollen. La feltet stå tomt for å bruke standardteksten."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_TEXT_DEFAULT="Dette innhaldet blir vist etter ein rask nettlesarkontroll."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_BUTTON_DEFAULT="Vis innhald"

