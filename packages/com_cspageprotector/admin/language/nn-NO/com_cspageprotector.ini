COM_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Laga av <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Set ein arbeidsprov-kontroll (proof-of-work) framfor sidene du vel, slik at skraperobotar må bruke verkeleg reknetid før dei får tak i innhaldet ditt. Vanlege besøkjande ser eit kort &quot;kontrollerer nettlesaren din&quot;-steg éin gong og surfar deretter som vanleg. For Joomla 5 og 6 (den innebygde Proof-of-Work-captchaen krev Joomla 6.1 eller nyare)."

