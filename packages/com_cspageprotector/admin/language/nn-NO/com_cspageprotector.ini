COM_CSPAGEPROTECTOR_CHECK_CLOUDFLARE="Denne nettstaden ser ut til å liggje bak Cloudflare, men Page Protector les IP-adressa til tilkoplinga. Alle besøkjande vil dukke opp som ei Cloudflare-adresse, og kvitlista for IP-adresser vil ikkje fungere. Set «IP-adressa til besøkjande kjem frå» til Cloudflare i Innstillingar."
