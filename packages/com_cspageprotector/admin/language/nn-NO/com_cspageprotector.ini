COM_CSPAGEPROTECTOR_CHALLENGE_WORKING="Kontrollerer nettlesaren din..."
COM_CSPAGEPROTECTOR_CHALLENGE_DONE="Ferdig - sender deg til sida."
COM_CSPAGEPROTECTOR_CHALLENGE_EXPIRED="Kontrollen gjekk ut på tid. Prøv igjen."
