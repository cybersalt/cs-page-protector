; Support
COM_CSPAGEPROTECTOR_SUPPORT_HEADING="Hjelp og støtte"
COM_CSPAGEPROTECTOR_SUPPORT_COMMUNITY_HEADING="Vi vil gjerne høyre frå deg"
COM_CSPAGEPROTECTOR_SUPPORT_COMMUNITY_BODY="Send oss feilrapportar, ønske om nye funksjonar, spørsmål og idear - vi les kvar einaste ein og set stor pris på tilbakemeldingane. Cybersalt Page Protector er gratis og open kjeldekode, og støtta blir gitt etter beste evne: vi har avgrensa tid til gratis støtte, så det kan ta ei stund før du får svar. Treng du garantert svartid eller praktisk hjelp på nettstaden din, kan du få betalt støtte via skjemaet for støtteførespurnader."
