; Dashboard
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_HEADING="Korleis Page Protector fungerer"
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_BODY="Besøkjande på ei verna side ser først ein kort nettlesarkontroll. Nettlesaren deira løyser ei lita arbeidsprov-oppgåve (rundt eitt sekund for eit menneske, men ein reell CPU-kostnad for ein skraperobot som går gjennom tusenvis av sider), og får så eit løyve som gjer at dei kan bruke verna sider som vanleg til løyvet går ut. Innlogga brukarar, IP-adresser på kvitlista og verifiserte søkjemotorar kan hoppe over kontrollen."
