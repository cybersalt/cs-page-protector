COM_CSPAGEPROTECTOR_DASHBOARD_TOP_IPS="IP-adresser med flest kontrollar (7 dagar)"
COM_CSPAGEPROTECTOR_DASHBOARD_TOP_IPS_HINT="Mange kontrollar og ingen bestått tyder som regel på ein skraperobot. Kopier-knappen gir deg adressa (eller adresseområdet, når IP-adresser blir korta ned) klar til å blokkere i brannmuren din."
