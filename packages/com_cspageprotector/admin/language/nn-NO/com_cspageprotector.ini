COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_LABEL="Klarerte proxyar"
COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_DESC="Adressene eller adresseområda til dine eigne proxyar eller lastbalanserarar, éi per linje. Headeren X-Forwarded-For / X-Real-IP frå dei blir stolt på, men ikkje frå nokon andre. La feltet stå tomt om proxyen køyrer på same tenar eller i eit privat nettverk. Ikkje naudsynt for Cloudflare."
