COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_DESC="Nagłówek wyświetlany nad sprawdzeniem. Pozostaw puste, aby użyć domyślnego."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_LABEL="Wiadomość"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_DESC="Tekst wyświetlany pod nagłówkiem. Dozwolony jest podstawowy HTML. Pozostaw puste, aby użyć domyślnego."
