COM_CSPAGEPROTECTOR_SUPPORT_COMMUNITY_HEADING="Chętnie poznamy twoje zdanie"
COM_CSPAGEPROTECTOR_SUPPORT_COMMUNITY_BODY="Przysyłaj nam zgłoszenia błędów, propozycje nowych funkcji, pytania i pomysły - czytamy każde z nich i cenimy twoje opinie. Cybersalt Page Protector jest darmowy i ma otwarty kod źródłowy, a wsparcie jest udzielane w miarę możliwości: mamy ograniczony czas na darmowe wsparcie, więc odpowiedź może chwilę potrwać. Jeśli potrzebujesz gwarantowanego czasu odpowiedzi lub bezpośredniej pomocy przy swojej witrynie, płatne wsparcie jest dostępne przez formularz zgłoszenia do wsparcia."
