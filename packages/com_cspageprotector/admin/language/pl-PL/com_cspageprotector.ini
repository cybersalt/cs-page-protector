COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_SUBTITLE="Kto nigdy nie widzi sprawdzenia"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_LABEL="Zalogowani użytkownicy pomijają sprawdzenie"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_DESC="Każdy zalogowany w witrynie trafia od razu na chronione strony. Wyłącz, aby zwolnić ze sprawdzenia tylko wybrane grupy użytkowników."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_LABEL="Grupy użytkowników pomijające sprawdzenie"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_DESC="Zalogowani członkowie tych grup (lub dowolnej grupy podrzędnej) pomijają sprawdzenie."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_LABEL="Wpuszczaj zweryfikowane wyszukiwarki"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_DESC="Googlebot, Bingbot, Applebot, YandexBot, Baiduspider i Yahoo Slurp pomijają sprawdzenie, ale dopiero gdy odwrotne i bezpośrednie zapytanie DNS potwierdzi, że żądanie naprawdę pochodzi od tej wyszukiwarki. Scraper, który tylko podaje się za Googlebota, nadal jest sprawdzany. Crawlery AI, takie jak GPTBot i ClaudeBot, nie są na tej liście. Po wyłączeniu tej opcji chronione strony wypadną z wyników wyszukiwania."
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_LABEL="Zapisuj wizyty wyszukiwarek"
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_DESC="Zapisuj wpis w dzienniku za każdym razem, gdy wpuszczana jest zweryfikowana wyszukiwarka. Domyślnie wyłączone, bo crawlery odwiedzają witrynę bardzo często."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_LABEL="Adresy IP pomijające sprawdzenie"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_DESC="Jeden w wierszu. Działają zarówno pojedyncze adresy (203.0.113.7), jak i zakresy (203.0.113.0/24, 2001:db8::/32). Wiersze zaczynające się od # są ignorowane. Przydatne dla biura, usług monitorowania dostępności i partnerów."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_HINT="203.0.113.7 lub 198.51.100.0/24"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_LABEL="Skąd pochodzi IP odwiedzającego"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_DESC="Zmieniaj to tylko wtedy, gdy witryna działa za serwerem proxy lub CDN. Wybrany nagłówek jest uznawany tylko wtedy, gdy żądanie naprawdę przechodzi przez to proxy: w przypadku Cloudflare z adresów samego Cloudflare, w pozostałych przypadkach z adresów z pola „Zaufane serwery proxy” (lub z proxy na tym samym serwerze albo w sieci prywatnej, gdy to pole jest puste). Nagłówek wysłany przez kogokolwiek innego jest ignorowany, więc nikt nie może podać się za adres z listy dozwolonych."
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_REMOTE_ADDR="Samo połączenie (bez proxy)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_CLOUDFLARE="Cloudflare (CF-Connecting-IP)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_XFF="Proxy / równoważenie obciążenia (X-Forwarded-For)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_X_REAL_IP="Proxy Nginx (X-Real-IP)"

; Options - Logging
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING="Dziennik"
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_DESC="Co jest zapisywane w dzienniku zdarzeń i jak długo."
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_SUBTITLE="Dziennik zdarzeń, z którego korzysta kokpit"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_LABEL="Prowadź dziennik zdarzeń"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_DESC="Zapisuj każde sprawdzenie, zaliczenie, niepowodzenie i blokadę. Kokpit i dziennik zdarzeń tego wymagają."
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_LABEL="Skracaj adresy IP"
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_DESC="Domyślnie włączone. Zapisywana jest tylko część sieciowa każdego adresu (203.0.113.0 zamiast 203.0.113.7), dzięki czemu dziennik lepiej odpowiada przepisom o ochronie prywatności, takim jak RODO. Podczas obsługi żądania ochrona nadal używa pełnego adresu; skracane jest tylko to, co zostaje zapisane. Włączenie tej opcji skraca też adresy już zapisane w dzienniku. Wyłącz ją tylko wtedy, gdy potrzebujesz dokładnych adresów, na przykład aby zablokować pojedynczy IP w zaporze sieciowej."
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_LABEL="Przechowuj wpisy przez (dni)"
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_DESC="Starsze wpisy są usuwane automatycznie. 0 oznacza przechowywanie bez limitu."

; Options - Support
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT="Wsparcie"
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_DESC="Z kim się skontaktować, gdy coś pójdzie nie tak."
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_SUBTITLE="Dane kontaktowe wsparcia widoczne w kokpicie (nigdy dla odwiedzających witrynę)"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_LABEL="E-mail wsparcia"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_DESC="Wyświetlany w kokpicie, aby administratorzy witryny wiedzieli, z kim się kontaktować. Nigdy nie jest pokazywany odwiedzającym witrynę."
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_LABEL="Strona wsparcia"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_DESC="Link do formularza kontaktowego lub strony pomocy."
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_LABEL_LABEL="Nazwa wsparcia"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_LABEL_DESC="Jak wsparcie jest nazywane w komunikatach, na przykład „Wsparcie Cybersalt” lub „zespół witryny”."

; Challenge page strings also used from admin (shared helpers)
COM_CSPAGEPROTECTOR_CHALLENGE_CONTINUE="Dalej"
COM_CSPAGEPROTECTOR_CHALLENGE_WORKING="Sprawdzanie przeglądarki..."
COM_CSPAGEPROTECTOR_CHALLENGE_DONE="Gotowe - przechodzimy do strony."
COM_CSPAGEPROTECTOR_CHALLENGE_EXPIRED="Sprawdzenie wygasło. Spróbuj ponownie."
COM_CSPAGEPROTECTOR_CHALLENGE_FAILED="Sprawdzenie się nie powiodło. Spróbuj ponownie."
COM_CSPAGEPROTECTOR_CHALLENGE_UNAVAILABLE="Sprawdzenie przeglądarki jest teraz niedostępne. Spróbuj ponownie później."
COM_CSPAGEPROTECTOR_CHALLENGE_NOSCRIPT="Aby dokończyć sprawdzenie, ta strona wymaga włączonego JavaScriptu."
COM_CSPAGEPROTECTOR_CHALLENGE_WHY="Dlaczego to widzę?"
COM_CSPAGEPROTECTOR_CHALLENGE_WHY_BODY="Ta witryna prosi twoją przeglądarkę o rozwiązanie małej łamigłówki przed pokazaniem niektórych stron. Człowiekowi zajmuje to sekundę, ale dla automatycznych narzędzi kopiowanie całej witryny staje się kosztowne. Przez jakiś czas nie będziesz o to ponownie proszony."

; Options - Modules
COM_CSPAGEPROTECTOR_FIELDSET_MODULES="Moduły"
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_DESC="Chroń zawartość modułów na każdej stronie, na której się pojawiają. Gdy moduły lub treści są chronione, własna pamięć podręczna widoków i modułów Joomla jest pomijana, aby kopia z pamięci podręcznej nigdy nie trafiła do odwiedzającego, który nie przeszedł sprawdzenia. Pamięć podręczna stron jest obsługiwana osobno i nadal działa dla pozostałych stron."
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_SUBTITLE="Chroń zawartość modułów przed scraperami, nawet na stronach bez ochrony"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_LABEL="Chronione moduły"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_DESC="Te moduły są wyświetlane tylko odwiedzającym, którzy przeszli sprawdzenie (lub je pomijają: zalogowani użytkownicy, adresy IP z listy dozwolonych, zweryfikowane wyszukiwarki), na każdej stronie, na której się pojawiają. Przydatne dla danych kontaktowych, cen lub informacji dla członków w stopce lub panelu bocznym."
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_LABEL="Chronione pozycje modułów"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_DESC="Chroniony jest każdy moduł w tych pozycjach, także moduły dodane tam później."
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES="%2$s (liczba modułów: %1$d)"
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES_1="%2$s (1 moduł)"
COM_CSPAGEPROTECTOR_NO_POSITION="(brak pozycji)"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_LABEL="Odwiedzający bez zaliczonego sprawdzenia widzą"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_DESC="Zastępnik zachowuje tytuł i ramkę modułu z przyciskiem „Pokaż zawartość”, który uruchamia sprawdzenie i od razu wraca. Ukrycie usuwa moduł całkowicie, więc jego pozycja się zwija; odwiedzający zobaczą go wtedy dopiero po przejściu sprawdzenia gdzie indziej, na przykład na chronionej stronie. W obu przypadkach CAPTCHA nigdy nie jest pokazywana wewnątrz modułu, więc na stronie nigdy nie ma więcej niż jednej."
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_PLACEHOLDER="Zastępnik z przyciskiem „Pokaż zawartość”"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_HIDE="Nic: moduł jest całkowicie ukryty"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_LABEL="Tekst zastępnika"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_DESC="Wyświetlany zamiast zawartości modułu. Pozostaw puste, aby użyć domyślnego."
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_LABEL="Etykieta przycisku"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_DESC="Etykieta przycisku uruchamiającego sprawdzenie. Pozostaw puste, aby użyć domyślnej."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_TEXT_DEFAULT="Ta zawartość pojawi się po szybkim sprawdzeniu przeglądarki."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_BUTTON_DEFAULT="Pokaż zawartość"

; Dashboard - modules
COM_CSPAGEPROTECTOR_DASHBOARD_PROTECTED_MODULES="Chronione moduły"
COM_CSPAGEPROTECTOR_DASHBOARD_NO_MODULES="Żaden moduł nie jest chroniony. Wybierz moduły lub pozycje na karcie Moduły w opcjach."
COM_CSPAGEPROTECTOR_HEADING_MODULE="Moduł"
COM_CSPAGEPROTECTOR_HEADING_POSITION="Pozycja"
COM_CSPAGEPROTECTOR_PROTECTED_BY_POSITION="cała pozycja"
COM_CSPAGEPROTECTOR_CHOOSE_MODULES="Wybierz moduły"
COM_CSPAGEPROTECTOR_CHECK_MODULES_N="Liczba chronionych modułów: %d."
COM_CSPAGEPROTECTOR_CHECK_MODULES_N_1="Chroniony jest 1 moduł."
COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_LABEL="Zaufane serwery proxy"
COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_DESC="Adresy lub zakresy twoich własnych serwerów proxy lub systemów równoważenia obciążenia, jeden w wierszu. Ich nagłówek X-Forwarded-For / X-Real-IP jest uznawany, a nagłówki od innych nie. Pozostaw puste, jeśli proxy działa na tym samym serwerze lub w sieci prywatnej. Niepotrzebne w przypadku Cloudflare."
COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_HINT="10.0.0.0/8 lub 192.0.2.10"
