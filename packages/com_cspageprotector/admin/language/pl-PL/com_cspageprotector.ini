COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_30D="30 dni"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_LABEL="Powiąż przepustkę z IP odwiedzającego"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_DESC="Skopiowana przepustka staje się bezużyteczna z każdego innego adresu. Pozostaw wyłączone, jeśli wielu odwiedzających korzysta z sieci komórkowych, gdzie IP często się zmienia i za każdym razem byliby sprawdzani od nowa."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_LABEL="Status HTTP strony sprawdzenia"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_DESC="200 działa wszędzie. 403 jasno mówi botom, że odmówiono im dostępu, ale niektóre hostingi zastępują strony 403 własną stroną błędu, co ukryłoby sprawdzenie przed prawdziwymi odwiedzającymi. Przetestuj przed zmianą."
