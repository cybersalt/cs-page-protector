; Dashboard
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_HEADING="Jak działa Page Protector"
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_BODY="Osoby odwiedzające chronioną stronę najpierw widzą krótkie sprawdzenie przeglądarki. Ich przeglądarka rozwiązuje małą łamigłówkę proof-of-work (około sekundy dla człowieka, realny koszt procesora dla scrapera odwiedzającego tysiące stron), po czym dostaje przepustkę i może normalnie przeglądać chronione strony, dopóki ta nie wygaśnie. Zalogowani użytkownicy, adresy IP z listy dozwolonych i zweryfikowane wyszukiwarki mogą pominąć sprawdzenie."
