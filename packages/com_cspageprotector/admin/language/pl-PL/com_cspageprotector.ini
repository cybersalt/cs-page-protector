COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION="Ochrona"
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_DESC="Które strony mają sprawdzenie przeglądarki."
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_SUBTITLE="Wybierz, na których stronach odwiedzający muszą przejść sprawdzenie"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_LABEL="Chroń"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_DESC="Chroń tylko wybrane pozycje menu albo chroń całą witrynę i wybierz pozycje menu, które mają pozostać otwarte."
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_SELECTED="Tylko wybrane strony"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_ALL_EXCEPT="Każdą stronę oprócz wybranych"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_LABEL="Pozycje menu"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_DESC="Strony, których to dotyczy. Objęte jest też wszystko, co jest wyświetlane w ramach pozycji menu, na przykład artykuły otwierane z chronionego bloga kategorii."
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_LABEL="Wyłapuj też inne ścieżki do tej samej treści"
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_DESC="Scrapery czasem docierają do tego samego artykułu przez inną pozycję menu, zwykły link index.php, blog lub listę wyróżnionych artykułów, listę tagów, moduł artykułów albo kanał RSS. Gdy ta opcja jest włączona, chroniony artykuł (lub dowolny artykuł w chronionej kategorii) jest chroniony również we wszystkich tych miejscach: listy pokazują krótką informację zamiast jego treści, a kanały, które by go zawierały, są odrzucane. Wyniki inteligentnego wyszukiwania mogą nadal pokazywać krótki fragment, ponieważ Joomla zapisuje go podczas indeksowania."

; Options - Challenge
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE="Sprawdzenie"
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_DESC="Co widzą odwiedzający i jak długo ważna jest ich przepustka."
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_SUBTITLE="Samo sprawdzenie, jego teksty i czas ważności przepustki"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_LABEL="CAPTCHA"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_DESC="Która wtyczka CAPTCHA Joomla wykonuje sprawdzenie. Zalecana jest własna CAPTCHA Proof-of-Work z Joomla (Joomla 6.1+): bez usług zewnętrznych, bez cudzych ciasteczek i bez klikania przez odwiedzającego. Jej trudność ustawia się w ustawieniach samej wtyczki CAPTCHA. Zamiast niej można użyć dowolnej innej zainstalowanej wtyczki CAPTCHA."
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_DISABLED="%s (wyłączona)"
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_POW_MISSING="CAPTCHA - Proof of Work (wymaga Joomla 6.1+, nie zainstalowano)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_LABEL="Jeśli CAPTCHA nie może działać"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_DESC="Co się dzieje, gdy wybrana wtyczka CAPTCHA jest wyłączona lub jej brakuje. Wpuszczanie odwiedzających utrzymuje witrynę w działaniu; blokowanie utrzymuje treść zamkniętą, ale każdemu odwiedzającemu pokazuje błąd."
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_ALLOW="Wpuszczaj odwiedzających (i zapisz błąd w dzienniku)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_BLOCK="Zablokuj stronę"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_LABEL="Uruchamiaj sprawdzenie automatycznie"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_DESC="Zacznij rozwiązywać proof-of-work zaraz po załadowaniu strony, zamiast czekać, aż odwiedzający zaznaczy pole. Dotyczy tylko CAPTCHA Proof-of-Work."
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_LABEL="Kontynuuj automatycznie po rozwiązaniu"
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_DESC="Przenieś odwiedzającego na stronę zaraz po rozwiązaniu sprawdzenia, bez klikania „Dalej”. Dotyczy tylko CAPTCHA Proof-of-Work."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_LABEL="Ważność przepustki"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_DESC="Po jednorazowym przejściu odwiedzający może przez ten czas otwierać wszystkie chronione strony bez kolejnego sprawdzenia."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_1H="1 godzina"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_6H="6 godzin"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_12H="12 godzin"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_24H="24 godziny"
