; Dashboard
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_HEADING="Como o Page Protector funciona"
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_BODY="Quem visita uma página protegida vê primeiro uma verificação rápida do navegador. O navegador resolve um pequeno quebra-cabeça de prova de trabalho (cerca de um segundo para uma pessoa, um custo real de CPU para um scraper que acessa milhares de páginas) e então recebe um passe para navegar normalmente pelas páginas protegidas até ele expirar. Usuários conectados, IPs liberados e mecanismos de busca verificados podem pular a verificação."
COM_CSPAGEPROTECTOR_NO_GUARANTEE_LABEL="Sem garantia."
COM_CSPAGEPROTECTOR_NO_GUARANTEE_BODY="Bots e hackers são persistentes. O Cybersalt Page Protector faz o possível para proteger seu conteúdo, mas não podemos garantir que pessoas mal-intencionadas não encontrem outra forma de contorná-lo. Como sempre: se há informações que você não quer na internet, não as coloque na internet."
