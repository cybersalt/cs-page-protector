COM_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Por <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Coloca uma verificação de prova de trabalho na frente das páginas que você escolher, para que os scrapers precisem gastar tempo de processamento real antes de obter o seu conteúdo. Visitantes reais veem uma única vez uma etapa rápida de &quot;verificando seu navegador&quot; e depois navegam normalmente. Para Joomla 5 e 6 (o captcha Proof-of-Work do núcleo requer Joomla 6.1 ou posterior)."

