COM_CSPAGEPROTECTOR_DASHBOARD_PROTECTED_MODULES="Módulos protegidos"
COM_CSPAGEPROTECTOR_DASHBOARD_NO_MODULES="Nenhum módulo está protegido. Escolha módulos ou posições na aba Módulos em Opções."
COM_CSPAGEPROTECTOR_HEADING_MODULE="Módulo"
COM_CSPAGEPROTECTOR_HEADING_POSITION="Posição"
COM_CSPAGEPROTECTOR_PROTECTED_BY_POSITION="posição inteira"
COM_CSPAGEPROTECTOR_CHOOSE_MODULES="Escolher módulos"
COM_CSPAGEPROTECTOR_CHECK_MODULES_N="%d módulos estão protegidos."
COM_CSPAGEPROTECTOR_CHECK_MODULES_N_1="1 módulo está protegido."
COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_LABEL="Proxies confiáveis"
COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_DESC="Os endereços ou faixas dos seus próprios proxies ou balanceadores de carga, um por linha. O cabeçalho X-Forwarded-For / X-Real-IP deles é considerado confiável; o de mais ninguém. Deixe vazio se o proxy roda no mesmo servidor ou numa rede privada. Não é necessário para o Cloudflare."
COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_HINT="10.0.0.0/8 ou 192.0.2.10"
