; Options - Protection
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION="Proteção"
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_DESC="Quais páginas têm a verificação do navegador. A verificação torna o scraping mais lento e mais caro, mas não pode prometer que seu conteúdo nunca será copiado."
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_SUBTITLE="Escolha em quais páginas os visitantes precisam passar por uma verificação"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_LABEL="Proteger"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_DESC="Proteja apenas os itens de menu escolhidos, ou proteja o site inteiro e escolha os itens de menu que ficam abertos."
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_SELECTED="Apenas as páginas selecionadas"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_ALL_EXCEPT="Todas as páginas, exceto as selecionadas"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_LABEL="Itens de menu"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_DESC="As páginas às quais isto se aplica. Tudo o que é exibido sob um item de menu também é coberto, por exemplo os artigos abertos a partir de um blog de categoria protegido."
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_LABEL="Também cobrir outros caminhos para o mesmo conteúdo"
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_DESC="Às vezes os scrapers chegam ao mesmo artigo por outro item de menu, um link index.php simples, um blog ou uma lista de destaques, uma lista de tags, um módulo de artigos ou um feed. Com esta opção ativada, um artigo protegido (ou qualquer artigo dentro de uma categoria protegida) também fica protegido em todos esses casos: as listas mostram um aviso curto no lugar do texto, e os feeds que o incluiriam são recusados. Os resultados da Pesquisa Inteligente ainda podem mostrar um trecho curto, porque o Joomla os armazena ao indexar."

; Options - Challenge
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE="Verificação"
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_DESC="O que os visitantes veem e quanto tempo dura o passe deles."
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_SUBTITLE="A verificação em si, os textos e quanto tempo dura um passe"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_LABEL="Captcha"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_DESC="Qual plugin de captcha do Joomla executa a verificação. O captcha Proof-of-Work do próprio Joomla (Joomla 6.1+) é o recomendado: nenhum serviço de terceiros, nenhum cookie de outros e nada para o visitante clicar. A dificuldade dele é definida nas configurações do próprio plugin de captcha. Qualquer outro plugin de captcha instalado pode ser usado no lugar."
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_DISABLED="%s (desabilitado)"
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_POW_MISSING="CAPTCHA - Proof of Work (requer Joomla 6.1+, não instalado)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_LABEL="Se o captcha não puder ser executado"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_DESC="O que acontece quando o plugin de captcha escolhido está desabilitado ou ausente. Deixar os visitantes passarem mantém o site utilizável; bloquear mantém o conteúdo trancado, mas mostra um erro a todos os visitantes."
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_ALLOW="Deixar os visitantes passarem (e registrar um erro)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_BLOCK="Bloquear a página"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_LABEL="Iniciar a verificação automaticamente"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_DESC="Começar a resolver a prova de trabalho assim que a página carregar, em vez de esperar o visitante marcar a caixa. Vale apenas para o captcha Proof-of-Work."
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_LABEL="Continuar automaticamente quando resolvida"
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_DESC="Levar o visitante à página assim que a verificação for resolvida, sem que ele precise clicar em Continuar. Vale apenas para o captcha Proof-of-Work."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_LABEL="Duração do passe"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_DESC="Depois de passar uma vez, o visitante pode abrir todas as páginas protegidas sem nova verificação durante este tempo."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_1H="1 hora"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_6H="6 horas"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_12H="12 horas"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_24H="24 horas"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_3D="3 dias"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_7D="7 dias"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_30D="30 dias"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_LABEL="Vincular o passe ao IP do visitante"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_DESC="Faz com que um passe copiado não sirva a partir de nenhum outro endereço. Deixe desativado se muitos dos seus visitantes usam redes móveis, onde o IP muda com frequência e eles seriam verificados de novo a cada vez."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_LABEL="Status HTTP da página de verificação"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_DESC="200 funciona em qualquer lugar. 403 informa claramente aos bots que foram recusados, mas algumas hospedagens substituem as páginas 403 pela própria página de erro, o que esconderia a verificação dos visitantes reais. Teste antes de mudar."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_200="200 OK (recomendado)"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_403="403 Forbidden"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_LABEL="Título"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_DESC="Título exibido acima da verificação. Deixe em branco para usar o padrão."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_LABEL="Mensagem"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_DESC="Texto exibido abaixo do título. HTML básico é permitido. Deixe em branco para usar o padrão."
COM_CSPAGEPROTECTOR_CHALLENGE_HEADING_DEFAULT="Verificando seu navegador"
COM_CSPAGEPROTECTOR_CHALLENGE_MESSAGE_DEFAULT="Isto leva só um instante. Ajuda a manter scrapers automatizados longe desta página."

