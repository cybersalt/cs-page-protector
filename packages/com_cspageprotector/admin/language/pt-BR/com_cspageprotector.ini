COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS="Isenções"
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_DESC="Quem pode pular a verificação."
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_SUBTITLE="Quem nunca vê a verificação"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_LABEL="Usuários conectados pulam a verificação"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_DESC="Qualquer pessoa conectada ao site vai direto para as páginas protegidas. Desative para isentar apenas alguns grupos de usuários."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_LABEL="Grupos de usuários que pulam a verificação"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_DESC="Membros conectados destes grupos (ou de qualquer grupo abaixo deles) pulam a verificação."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_LABEL="Liberar mecanismos de busca verificados"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_DESC="Googlebot, Bingbot, Applebot, YandexBot, Baiduspider e Yahoo Slurp pulam a verificação, mas só depois que uma consulta DNS reversa e direta comprova que a requisição vem mesmo daquele mecanismo de busca. Um scraper que apenas diz ser o Googlebot continua sendo verificado. Rastreadores de IA como GPTBot e ClaudeBot não estão nesta lista. Se desativar esta opção, as páginas protegidas vão sumir dos resultados de busca."
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_LABEL="Registrar visitas de mecanismos de busca"
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_DESC="Gravar uma entrada no registro cada vez que um mecanismo de busca verificado for liberado. Desativado por padrão porque os rastreadores visitam muito."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_LABEL="Endereços IP que pulam a verificação"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_DESC="Um por linha. Funcionam tanto endereços únicos (203.0.113.7) quanto faixas (203.0.113.0/24, 2001:db8::/32). Linhas que começam com # são ignoradas. Útil para o seu escritório, monitores de disponibilidade e parceiros."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_HINT="203.0.113.7 ou 198.51.100.0/24"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_LABEL="O IP do visitante vem de"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_DESC="Só altere isto se o site estiver atrás de um proxy ou CDN. O cabeçalho escolhido só é considerado confiável quando a requisição realmente passa por esse proxy: para o Cloudflare, os próprios endereços do Cloudflare; para os demais, os endereços em \"Proxies confiáveis\" (ou um proxy no mesmo servidor ou na mesma rede privada quando essa lista estiver vazia). Se qualquer outro enviar o cabeçalho, ele é ignorado, então ninguém consegue se passar por um endereço liberado."
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_REMOTE_ADDR="A própria conexão (sem proxy)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_CLOUDFLARE="Cloudflare (CF-Connecting-IP)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_XFF="Proxy / balanceador de carga (X-Forwarded-For)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_X_REAL_IP="Proxy Nginx (X-Real-IP)"

; Options - Logging
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING="Registro"
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_DESC="O que é gravado no registro de eventos e por quanto tempo."
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_SUBTITLE="O registro de eventos por trás do painel"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_LABEL="Manter um registro de eventos"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_DESC="Registrar cada verificação, aprovação, falha e bloqueio. O painel e o registro de eventos precisam disto."
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_LABEL="Encurtar endereços IP"
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_DESC="Ativado por padrão. Guarda apenas a parte de rede de cada endereço (203.0.113.0 em vez de 203.0.113.7), o que deixa o registro mais adequado a regras de privacidade como a LGPD e o GDPR. A proteção continua usando o endereço completo enquanto a requisição está sendo processada; só o que é gravado é encurtado. Ativar esta opção também encurta os endereços que já estão no registro. Desative apenas se precisar dos endereços exatos, por exemplo para bloquear um único IP no seu firewall."
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_LABEL="Manter as entradas por (dias)"
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_DESC="Entradas mais antigas são excluídas automaticamente. 0 as mantém para sempre."

; Options - Support
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT="Suporte"
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_DESC="Quem contatar quando algo der errado."
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_SUBTITLE="Dados de contato do suporte exibidos no painel (nunca aos visitantes do site)"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_LABEL="E-mail de suporte"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_DESC="Exibido no painel para que os administradores do site saibam quem contatar. Nunca é exibido aos visitantes do site."
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_LABEL="Página de suporte"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_DESC="Link para um formulário de contato ou uma página de ajuda."
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_LABEL_LABEL="Nome do suporte"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_LABEL_DESC="Como o suporte é chamado nas mensagens, por exemplo \"Suporte Cybersalt\" ou \"a equipe do site\"."

; Challenge page strings also used from admin (shared helpers)
COM_CSPAGEPROTECTOR_CHALLENGE_CONTINUE="Continuar"
COM_CSPAGEPROTECTOR_CHALLENGE_WORKING="Verificando seu navegador..."
COM_CSPAGEPROTECTOR_CHALLENGE_DONE="Pronto - levando você para a página."
COM_CSPAGEPROTECTOR_CHALLENGE_EXPIRED="A verificação expirou. Tente novamente."
COM_CSPAGEPROTECTOR_CHALLENGE_FAILED="A verificação não foi concluída. Tente novamente."
COM_CSPAGEPROTECTOR_CHALLENGE_UNAVAILABLE="A verificação do navegador não está disponível no momento. Tente novamente mais tarde."
COM_CSPAGEPROTECTOR_CHALLENGE_NOSCRIPT="Esta página precisa do JavaScript ativado para concluir a verificação."
COM_CSPAGEPROTECTOR_CHALLENGE_WHY="Por que estou vendo isto?"
COM_CSPAGEPROTECTOR_CHALLENGE_WHY_BODY="Este site pede ao seu navegador que resolva um pequeno quebra-cabeça antes de mostrar algumas páginas. Para uma pessoa leva um segundo, mas para ferramentas automatizadas fica caro copiar o site inteiro. Isso não será pedido de novo por um tempo."

; Options - Modules
COM_CSPAGEPROTECTOR_FIELDSET_MODULES="Módulos"
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_DESC="Proteger o conteúdo dos módulos em todas as páginas em que aparecem. Enquanto houver módulos ou conteúdo protegidos, os caches de visualizações e de módulos do próprio Joomla são ignorados, para que uma cópia em cache nunca chegue a um visitante que não passou pela verificação. O cache de páginas é tratado à parte e continua funcionando para as outras páginas."
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_SUBTITLE="Manter o conteúdo dos módulos longe dos scrapers, mesmo em páginas não protegidas"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_LABEL="Módulos protegidos"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_DESC="Estes módulos só são exibidos para visitantes que passaram pela verificação (ou que a pulam: usuários conectados, IPs liberados, mecanismos de busca verificados), em todas as páginas em que aparecem. Útil para dados de contato, preços ou informações de membros num rodapé ou numa barra lateral."
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_LABEL="Posições de módulo protegidas"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_DESC="Todos os módulos destas posições ficam protegidos, inclusive os adicionados depois."
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES="%2$s (%1$d módulos)"
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES_1="%2$s (1 módulo)"
COM_CSPAGEPROTECTOR_NO_POSITION="(sem posição)"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_LABEL="Visitantes que não passaram veem"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_DESC="Um espaço reservado mantém o título e a caixa do módulo com um botão \"Mostrar conteúdo\" que executa a verificação e volta direto. Ocultar remove o módulo por completo, então a posição dele se fecha; os visitantes só o veem depois de passar pela verificação em outro lugar, por exemplo numa página protegida. Em ambos os casos o captcha nunca é exibido dentro de um módulo, então uma página nunca tem mais de um."
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_PLACEHOLDER="Um espaço reservado com um botão \"Mostrar conteúdo\""
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_HIDE="Nada: ocultar o módulo por completo"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_LABEL="Texto do espaço reservado"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_DESC="Exibido no lugar do conteúdo do módulo. Deixe em branco para usar o padrão."
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_LABEL="Texto do botão"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_DESC="Texto do botão que executa a verificação. Deixe em branco para usar o padrão."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_TEXT_DEFAULT="Este conteúdo aparece após uma rápida verificação do navegador."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_BUTTON_DEFAULT="Mostrar conteúdo"

