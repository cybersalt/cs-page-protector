COM_CSPAGEPROTECTOR_SUPPORT_COMMUNITY_BODY="Envie para nós seus relatos de bugs, pedidos de recursos, perguntas e ideias: lemos todos e agradecemos o retorno. O Cybersalt Page Protector é gratuito e de código aberto, e o suporte é oferecido dentro das nossas possibilidades: nosso tempo para suporte gratuito é limitado, então as respostas podem demorar. Se você precisa de um tempo de resposta garantido ou de ajuda direta no seu site, há suporte pago disponível pelo formulário de solicitação de suporte."
