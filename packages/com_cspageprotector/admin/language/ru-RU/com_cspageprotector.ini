COM_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Разработчик: <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Ставит проверку proof-of-work перед выбранными Вами страницами, так что парсерам приходится тратить реальное процессорное время, прежде чем они получат Ваш контент. Обычные посетители один раз видят короткий шаг &quot;проверка браузера&quot;, а затем пользуются сайтом как обычно. Для Joomla 5 и 6 (встроенной капче Proof-of-Work нужна Joomla 6.1 или новее)."

