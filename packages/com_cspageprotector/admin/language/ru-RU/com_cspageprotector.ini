; Dashboard
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_HEADING="Как работает Page Protector"
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_BODY="Посетители защищённой страницы сначала видят короткую проверку браузера. Их браузер решает небольшую задачу proof-of-work (около секунды для человека и ощутимая нагрузка на процессор для парсера, который обходит тысячи страниц), после чего получает пропуск и открывает защищённые страницы как обычно, пока срок пропуска не истечёт. Авторизованные пользователи, IP-адреса из белого списка и проверенные поисковые системы могут проходить без проверки."
