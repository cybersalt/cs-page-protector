COM_CSPAGEPROTECTOR_SUPPORT_HEADING="Справка и поддержка"
COM_CSPAGEPROTECTOR_SUPPORT_COMMUNITY_HEADING="Мы рады Вашим отзывам"
COM_CSPAGEPROTECTOR_SUPPORT_COMMUNITY_BODY="Присылайте нам сообщения об ошибках, пожелания, вопросы и идеи — мы читаем каждое сообщение и ценим обратную связь. Cybersalt Page Protector — бесплатное расширение с открытым исходным кодом, и поддержка по нему оказывается по мере возможности: времени на бесплатную поддержку у нас немного, поэтому ответ может занять какое-то время. Если Вам нужен гарантированный срок ответа или практическая помощь на Вашем сайте, через форму запроса в поддержку доступна платная поддержка."
