COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_30D="30 дней"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_LABEL="Привязать пропуск к IP посетителя"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_DESC="Скопированный пропуск становится бесполезным с любого другого адреса. Не включайте эту опцию, если многие Ваши посетители пользуются мобильными сетями: там IP часто меняется, и им пришлось бы каждый раз проходить проверку заново."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_LABEL="HTTP-статус страницы проверки"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_DESC="200 работает везде. 403 прямо сообщает ботам, что им отказано, но некоторые хостинги заменяют страницы с кодом 403 своей страницей ошибки, и тогда настоящие посетители не увидят проверку. Проверьте, прежде чем переключать."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_200="200 OK (рекомендуется)"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_403="403 Forbidden"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_LABEL="Заголовок"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_DESC="Заголовок над проверкой. Оставьте пустым, чтобы использовать текст по умолчанию."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_LABEL="Сообщение"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_DESC="Текст под заголовком. Допускается простой HTML. Оставьте пустым, чтобы использовать текст по умолчанию."
COM_CSPAGEPROTECTOR_CHALLENGE_HEADING_DEFAULT="Проверка браузера"
COM_CSPAGEPROTECTOR_CHALLENGE_MESSAGE_DEFAULT="Это займёт всего мгновение. Так мы защищаем эту страницу от автоматических парсеров."

; Options - Exemptions
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS="Исключения"
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_DESC="Кто может проходить без проверки."
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_SUBTITLE="Кто никогда не видит проверку"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_LABEL="Авторизованные пользователи проходят без проверки"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_DESC="Все, кто вошёл на сайт, сразу попадают на защищённые страницы. Отключите, чтобы освободить от проверки только некоторые группы пользователей."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_LABEL="Группы пользователей без проверки"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_DESC="Авторизованные участники этих групп (или любой вложенной в них группы) проходят без проверки."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_LABEL="Пропускать проверенные поисковые системы"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_DESC="Googlebot, Bingbot, Applebot, YandexBot, Baiduspider и Yahoo Slurp проходят без проверки, но только после того, как обратный и прямой DNS-запрос подтвердит, что запрос действительно идёт от этой поисковой системы. Парсер, который просто выдаёт себя за Googlebot, всё равно проверяется. ИИ-краулеры, такие как GPTBot и ClaudeBot, в этот список не входят. Если отключить эту опцию, защищённые страницы выпадут из результатов поиска."
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_LABEL="Записывать визиты поисковых систем"
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_DESC="Записывать событие в журнал каждый раз, когда пропускается проверенная поисковая система. По умолчанию отключено, потому что краулеры заходят очень часто."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_LABEL="IP-адреса без проверки"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_DESC="По одному на строку. Работают как отдельные адреса (203.0.113.7), так и диапазоны (203.0.113.0/24, 2001:db8::/32). Строки, начинающиеся с #, игнорируются. Удобно для Вашего офиса, сервисов мониторинга доступности и партнёров."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_HINT="203.0.113.7 или 198.51.100.0/24"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_LABEL="Откуда берётся IP посетителя"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_DESC="Меняйте этот параметр, только если сайт находится за прокси или CDN. Выбранному заголовку доверяют, только если запрос действительно пришёл через этот прокси: для Cloudflare — с собственных адресов Cloudflare, для остальных — с адресов из поля «Доверенные прокси» (или с прокси на том же сервере либо в частной сети, если это поле пустое). Если заголовок присылает кто-то другой, он игнорируется, поэтому никто не сможет выдать себя за адрес из белого списка."
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_REMOTE_ADDR="Само подключение (без прокси)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_CLOUDFLARE="Cloudflare (CF-Connecting-IP)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_XFF="Прокси / балансировщик нагрузки (X-Forwarded-For)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_X_REAL_IP="Прокси Nginx (X-Real-IP)"

; Options - Logging
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING="Журнал"
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_DESC="Что записывается в журнал событий и как долго хранится."
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_SUBTITLE="Журнал событий, на котором основана панель управления"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_LABEL="Вести журнал событий"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_DESC="Записывать каждую проверку, прохождение, неудачу и блокировку. Это нужно для панели управления и журнала событий."
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_LABEL="Сокращать IP-адреса"
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_DESC="Включено по умолчанию. Сохраняется только сетевая часть каждого адреса (203.0.113.0 вместо 203.0.113.7), что делает журнал более совместимым с правилами защиты персональных данных, такими как GDPR. Во время обработки запроса защита по-прежнему использует полный адрес, сокращается только то, что сохраняется. При включении этой опции сокращаются и адреса, уже записанные в журнале. Отключайте её, только если Вам нужны точные адреса, например чтобы заблокировать отдельный IP в файрволе."
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_LABEL="Хранить записи (дней)"
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_DESC="Более старые записи удаляются автоматически. 0 — хранить бессрочно."

; Options - Support
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT="Поддержка"
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_DESC="К кому обращаться, если что-то пошло не так."
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_SUBTITLE="Контакты поддержки, показываемые на панели управления (посетителям сайта не показываются никогда)"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_LABEL="Электронная почта поддержки"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_DESC="Показывается на панели управления, чтобы администраторы сайта знали, к кому обращаться. Посетителям сайта не показывается никогда."
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_LABEL="Страница поддержки"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_DESC="Ссылка на контактную форму или страницу справки."
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_LABEL_LABEL="Название поддержки"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_LABEL_DESC="Как поддержка называется в сообщениях, например «Поддержка Cybersalt» или «команда сайта»."

; Challenge page strings also used from admin (shared helpers)
COM_CSPAGEPROTECTOR_CHALLENGE_CONTINUE="Продолжить"
COM_CSPAGEPROTECTOR_CHALLENGE_WORKING="Проверка браузера..."
COM_CSPAGEPROTECTOR_CHALLENGE_DONE="Готово — переходим на страницу."
COM_CSPAGEPROTECTOR_CHALLENGE_EXPIRED="Время проверки истекло. Попробуйте ещё раз."
COM_CSPAGEPROTECTOR_CHALLENGE_FAILED="Проверка не пройдена. Попробуйте ещё раз."
COM_CSPAGEPROTECTOR_CHALLENGE_UNAVAILABLE="Проверка браузера сейчас недоступна. Попробуйте позже."
COM_CSPAGEPROTECTOR_CHALLENGE_NOSCRIPT="Чтобы завершить проверку, включите JavaScript."
COM_CSPAGEPROTECTOR_CHALLENGE_WHY="Почему я это вижу?"
COM_CSPAGEPROTECTOR_CHALLENGE_WHY_BODY="Перед показом некоторых страниц этот сайт просит Ваш браузер решить небольшую задачу. Человеку на это нужна секунда, а для автоматических инструментов копирование всего сайта становится дорогим. Какое-то время Вас больше не попросят об этом."

; Options - Modules
COM_CSPAGEPROTECTOR_FIELDSET_MODULES="Модули"
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_DESC="Защита содержимого модулей на всех страницах, где они показываются. Пока защищены модули или материалы, собственный кэш представлений и модулей Joomla не используется, чтобы кэшированная копия никогда не попала к посетителю, не прошедшему проверку. Кэш страниц обрабатывается отдельно и продолжает работать для остальных страниц."
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_SUBTITLE="Скрывайте содержимое модулей от парсеров даже на незащищённых страницах"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_LABEL="Защищённые модули"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_DESC="Эти модули показываются только посетителям, прошедшим проверку (или освобождённым от неё: авторизованным пользователям, IP-адресам из белого списка, проверенным поисковым системам), на всех страницах, где они появляются. Полезно для контактных данных, цен или информации для участников в подвале или боковой колонке."
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_LABEL="Защищённые позиции модулей"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_DESC="Защищается каждый модуль в этих позициях, включая модули, добавленные туда позже."
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES="%2$s (модулей: %1$d)"
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES_1="%2$s (1 модуль)"
COM_CSPAGEPROTECTOR_NO_POSITION="(без позиции)"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_LABEL="Посетители, не прошедшие проверку, видят"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_DESC="Заглушка сохраняет заголовок и рамку модуля с кнопкой «Показать содержимое», которая запускает проверку и сразу возвращает посетителя обратно. При скрытии модуль убирается полностью, и его позиция схлопывается; тогда посетители увидят его, только пройдя проверку где-то ещё, например на защищённой странице. В обоих случаях капча никогда не показывается внутри модуля, поэтому на странице её не бывает больше одной."
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_PLACEHOLDER="Заглушку с кнопкой «Показать содержимое»"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_HIDE="Ничего: модуль скрыт полностью"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_LABEL="Текст заглушки"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_DESC="Показывается вместо содержимого модуля. Оставьте пустым, чтобы использовать текст по умолчанию."
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_LABEL="Текст кнопки"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_DESC="Текст кнопки, которая запускает проверку. Оставьте пустым, чтобы использовать текст по умолчанию."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_TEXT_DEFAULT="Это содержимое появится после быстрой проверки браузера."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_BUTTON_DEFAULT="Показать содержимое"

; Dashboard - modules
COM_CSPAGEPROTECTOR_DASHBOARD_PROTECTED_MODULES="Защищённые модули"
COM_CSPAGEPROTECTOR_DASHBOARD_NO_MODULES="Ни один модуль не защищён. Выберите модули или позиции на вкладке «Модули» в настройках."
COM_CSPAGEPROTECTOR_HEADING_MODULE="Модуль"
COM_CSPAGEPROTECTOR_HEADING_POSITION="Позиция"
COM_CSPAGEPROTECTOR_PROTECTED_BY_POSITION="вся позиция"
COM_CSPAGEPROTECTOR_CHOOSE_MODULES="Выбрать модули"
COM_CSPAGEPROTECTOR_CHECK_MODULES_N="Защищено модулей: %d."
COM_CSPAGEPROTECTOR_CHECK_MODULES_N_1="Защищён 1 модуль."
COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_LABEL="Доверенные прокси"
COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_DESC="Адреса или диапазоны Ваших собственных прокси или балансировщиков нагрузки, по одному на строку. Их заголовку X-Forwarded-For / X-Real-IP доверяют, а заголовку от всех остальных — нет. Оставьте пустым, если прокси работает на том же сервере или в частной сети. Для Cloudflare не требуется."
COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_HINT="10.0.0.0/8 или 192.0.2.10"
