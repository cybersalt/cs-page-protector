; Options - Protection
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION="Защита"
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_DESC="Какие страницы проходят проверку браузера."
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_SUBTITLE="Выберите страницы, для просмотра которых посетители должны пройти проверку"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_LABEL="Защищать"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_DESC="Защищайте только выбранные пункты меню или защитите весь сайт и выберите пункты меню, которые останутся открытыми."
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_SELECTED="Только выбранные страницы"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_ALL_EXCEPT="Все страницы, кроме выбранных"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_LABEL="Пункты меню"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_DESC="Страницы, к которым это применяется. Всё, что показывается в рамках пункта меню, тоже охватывается, например материалы, открытые из защищённого блога категории."
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_LABEL="Также перехватывать другие пути к тому же содержимому"
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_DESC="Парсеры иногда добираются до того же материала через другой пункт меню, простую ссылку index.php, блог или список избранных материалов, список тегов, модуль материалов или ленту новостей. Если эта опция включена, защищённый материал (или любой материал внутри защищённой категории) защищается и во всех этих местах: в списках вместо его текста показывается короткое уведомление, а ленты, в которые он попал бы, не отдаются. В результатах Умного поиска по-прежнему может показываться короткий фрагмент, потому что Joomla сохраняет его при индексации."

; Options - Challenge
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE="Проверка"
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_DESC="Что видят посетители и как долго действует их пропуск."
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_SUBTITLE="Сама проверка, её тексты и срок действия пропуска"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_LABEL="Капча"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_DESC="Какой плагин капчи Joomla выполняет проверку. Рекомендуется собственная капча Proof-of-Work от Joomla (Joomla 6.1+): никаких сторонних сервисов, никаких чужих cookie и посетителю ничего не нужно нажимать. Её сложность задаётся в настройках самого плагина капчи. Вместо неё можно использовать любой другой установленный плагин капчи."
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_DISABLED="%s (отключён)"
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_POW_MISSING="CAPTCHA - Proof of Work (нужна Joomla 6.1+, не установлен)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_LABEL="Если капча не может работать"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_DESC="Что происходит, если выбранный плагин капчи отключён или отсутствует. Если пропускать посетителей, сайт остаётся рабочим; блокировка держит содержимое закрытым, но показывает каждому посетителю ошибку."
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_ALLOW="Пропускать посетителей (и записывать ошибку в журнал)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_BLOCK="Блокировать страницу"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_LABEL="Запускать проверку автоматически"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_DESC="Начинать решение задачи proof-of-work сразу после загрузки страницы, не дожидаясь, пока посетитель поставит галочку. Действует только для капчи Proof-of-Work."
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_LABEL="Продолжать автоматически после решения"
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_DESC="Отправлять посетителя на страницу сразу после решения проверки, без нажатия кнопки «Продолжить». Действует только для капчи Proof-of-Work."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_LABEL="Срок действия пропуска"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_DESC="После однократного прохождения посетитель может в течение этого времени открывать все защищённые страницы без повторной проверки."
