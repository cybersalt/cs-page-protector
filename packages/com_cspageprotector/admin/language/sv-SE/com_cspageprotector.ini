COM_CSPAGEPROTECTOR_SUPPORT_HEADING="Hjälp och support"
COM_CSPAGEPROTECTOR_SUPPORT_COMMUNITY_HEADING="Vi vill gärna höra från dig"
COM_CSPAGEPROTECTOR_SUPPORT_COMMUNITY_BODY="Skicka oss dina felrapporter, önskemål om funktioner, frågor och idéer - vi läser varenda en och uppskattar återkopplingen. Cybersalt Page Protector är gratis och öppen källkod, och support ges i mån av tid: vår tid för gratis support är begränsad, så svar kan dröja. Om du behöver en garanterad svarstid eller praktisk hjälp på din webbplats finns betald support via formuläret för supportförfrågningar."
