; Dashboard
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_HEADING="Så fungerar Page Protector"
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_BODY="Besökare på en skyddad sida ser först en kort webbläsarkontroll. Deras webbläsare löser ett litet proof-of-work-pussel (ungefär en sekund för en människa, verklig CPU-kostnad för en skrapa som hämtar tusentals sidor). Därefter får de ett godkännande och kan besöka skyddade sidor som vanligt tills det går ut. Inloggade användare, tillåtna IP-adresser och verifierade sökmotorer kan hoppa över kontrollen."
