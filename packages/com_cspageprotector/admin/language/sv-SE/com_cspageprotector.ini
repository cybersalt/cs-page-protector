COM_CSPAGEPROTECTOR_CHALLENGE_WHY="Varför ser jag det här?"
COM_CSPAGEPROTECTOR_CHALLENGE_WHY_BODY="Den här webbplatsen ber din webbläsare lösa ett litet pussel innan vissa sidor visas. Det tar en sekund för en människa, men gör det dyrt för automatiska verktyg att kopiera hela webbplatsen. Du kommer inte att tillfrågas igen på ett tag."

; Options - Modules
COM_CSPAGEPROTECTOR_FIELDSET_MODULES="Moduler"
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_DESC="Skydda innehållet i moduler på varje sida där de visas. Så länge moduler eller innehåll är skyddade kringgås Joomlas egen vy- och modulcache, så att en cachad kopia aldrig kan nå en besökare som inte har klarat kontrollen. Sidcachen hanteras separat och fortsätter att fungera för andra sidor."
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_SUBTITLE="Håll modulinnehåll borta från skrapor, även på sidor som inte är skyddade"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_LABEL="Skyddade moduler"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_DESC="Dessa moduler visas bara för besökare som har klarat kontrollen (eller hoppar över den: inloggade användare, tillåtna IP-adresser, verifierade sökmotorer), på varje sida där de visas. Användbart för kontaktuppgifter, priser eller medlemsinformation i en sidfot eller ett sidofält."
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_LABEL="Skyddade modulpositioner"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_DESC="Alla moduler på dessa positioner är skyddade, även moduler som läggs till där senare."
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES="%2$s (%1$d moduler)"
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES_1="%2$s (1 modul)"
COM_CSPAGEPROTECTOR_NO_POSITION="(ingen position)"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_LABEL="Besökare som inte har klarat kontrollen ser"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_DESC="En platshållare behåller modulens rubrik och ruta, med en knapp \"Visa innehåll\" som kör kontrollen och kommer direkt tillbaka. Att dölja tar bort modulen helt, så att positionen försvinner; besökare ser den då först efter att ha klarat kontrollen någon annanstans, till exempel på en skyddad sida. Oavsett val visas captchan aldrig inuti en modul, så en sida har aldrig mer än en."
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_PLACEHOLDER="En platshållare med en knapp \"Visa innehåll\""
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_HIDE="Ingenting: dölj modulen helt"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_LABEL="Platshållartext"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_TEXT_DESC="Visas i stället för modulens innehåll. Lämna tomt för standardtexten."
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_LABEL="Knapptext"
COM_CSPAGEPROTECTOR_FIELD_MODULE_PLACEHOLDER_BUTTON_DESC="Texten på knappen som kör kontrollen. Lämna tomt för standardtexten."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_TEXT_DEFAULT="Det här innehållet visas efter en snabb webbläsarkontroll."
COM_CSPAGEPROTECTOR_MODULE_LOCKED_BUTTON_DEFAULT="Visa innehåll"

