COM_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Av <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Sätter en proof-of-work-kontroll framför de sidor du väljer, så att skrapor måste lägga verklig datortid innan de kommer åt ditt innehåll. Riktiga besökare ser ett kort steg &quot;kontrollerar din webbläsare&quot; en gång och surfar sedan som vanligt. För Joomla 5 och 6 (Proof-of-Work-captchan i Joomlas kärna kräver Joomla 6.1 eller senare)."

