; Options - Logging
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING="Loggning"
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_DESC="Vad som skrivs till händelseloggen och hur länge det sparas."
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_SUBTITLE="Händelseloggen bakom översikten"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_LABEL="För en händelselogg"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_DESC="Registrera varje kontroll, godkännande, misslyckande och blockering. Översikten och händelseloggen behöver detta."
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_LABEL="Förkorta IP-adresser"
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_DESC="På som standard. Spara bara nätverksdelen av varje adress (203.0.113.0 i stället för 203.0.113.7), vilket gör loggen mer integritetsvänlig enligt regler som GDPR. Skyddet använder fortfarande hela adressen medan begäran pågår; bara det som sparas förkortas. När du slår på detta förkortas även adresserna som redan finns i loggen. Stäng bara av det om du behöver exakta adresser, till exempel för att blockera en enskild IP-adress i din brandvägg."
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_LABEL="Spara poster i (dagar)"
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_DESC="Äldre poster tas bort automatiskt. 0 sparar dem för alltid."

; Options - Support
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT="Support"
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_DESC="Vem du ska kontakta när något går fel."
COM_CSPAGEPROTECTOR_FIELDSET_SUPPORT_SUBTITLE="Kontaktuppgifter för support som visas i översikten (aldrig för webbplatsens besökare)"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_LABEL="Supportens e-post"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_EMAIL_DESC="Visas i översikten så att administratörer vet vem de ska kontakta. Visas aldrig för webbplatsens besökare."
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_LABEL="Supportsida"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_URL_DESC="Länk till ett kontaktformulär eller en hjälpsida."
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_LABEL_LABEL="Supportens namn"
COM_CSPAGEPROTECTOR_FIELD_SUPPORT_LABEL_DESC="Hur supporten benämns i meddelanden, till exempel \"Cybersalt support\" eller \"webbplatsens team\"."

