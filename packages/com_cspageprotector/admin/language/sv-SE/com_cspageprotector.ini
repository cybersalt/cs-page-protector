; Options - Protection
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION="Skydd"
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_DESC="Vilka sidor som får webbläsarkontrollen."
COM_CSPAGEPROTECTOR_FIELDSET_PROTECTION_SUBTITLE="Välj vilka sidor besökare måste klara en kontroll för att se"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_LABEL="Skydda"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_DESC="Skydda bara de menyalternativ du väljer, eller skydda hela webbplatsen och välj de menyalternativ som ska lämnas öppna."
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_SELECTED="Bara de valda sidorna"
COM_CSPAGEPROTECTOR_FIELD_PROTECTION_MODE_ALL_EXCEPT="Alla sidor utom de valda"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_LABEL="Menyalternativ"
COM_CSPAGEPROTECTOR_FIELD_MENU_ITEMS_DESC="Sidorna som detta gäller. Allt som visas under ett menyalternativ omfattas också, till exempel artiklarna som öppnas från en skyddad kategoriblogg."
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_LABEL="Fånga även andra vägar till samma innehåll"
COM_CSPAGEPROTECTOR_FIELD_MATCH_CONTENT_DESC="Skrapor når ibland samma artikel via ett annat menyalternativ, en vanlig index.php-länk, en blogg eller lista med utvalda artiklar, en tagglista, en artikelmodul eller ett flöde. När detta är på är en skyddad artikel (eller varje artikel i en skyddad kategori) skyddad även på alla dessa ställen: listor visar en kort notis i stället för texten, och flöden som skulle innehålla den nekas. Sökresultat från Smart sökning kan fortfarande visa ett kort utdrag, eftersom Joomla sparar dem vid indexeringen."

; Options - Challenge
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE="Kontroll"
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_DESC="Vad besökarna ser och hur länge deras godkännande gäller."
COM_CSPAGEPROTECTOR_FIELDSET_CHALLENGE_SUBTITLE="Själva kontrollen, texterna och hur länge ett godkännande gäller"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_LABEL="Captcha"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_PLUGIN_DESC="Vilken captcha-plugin i Joomla som kör kontrollen. Joomlas egen Proof-of-Work-captcha (Joomla 6.1+) rekommenderas: ingen tredjepartstjänst, inga cookies från någon annan och inget för besökaren att klicka på. Svårighetsgraden ställs in i captcha-pluginens egna inställningar. Vilken annan installerad captcha-plugin som helst kan användas i stället."
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_DISABLED="%s (inaktiverad)"
COM_CSPAGEPROTECTOR_CAPTCHA_PLUGIN_POW_MISSING="CAPTCHA - Proof of Work (kräver Joomla 6.1+, inte installerad)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_LABEL="Om captchan inte kan köras"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_DESC="Vad som händer när den valda captcha-pluginen är inaktiverad eller saknas. Att släppa in besökare håller webbplatsen användbar; att blockera håller innehållet låst men visar ett felmeddelande för alla besökare."
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_ALLOW="Släpp in besökare (och logga ett fel)"
COM_CSPAGEPROTECTOR_FIELD_CAPTCHA_UNAVAILABLE_BLOCK="Blockera sidan"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_LABEL="Starta kontrollen automatiskt"
COM_CSPAGEPROTECTOR_FIELD_AUTO_START_DESC="Börja lösa proof-of-work-uppgiften så snart sidan har laddats, i stället för att vänta på att besökaren kryssar i rutan. Gäller bara Proof-of-Work-captchan."
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_LABEL="Fortsätt automatiskt när den är löst"
COM_CSPAGEPROTECTOR_FIELD_AUTO_SUBMIT_DESC="Skicka vidare besökaren till sidan så snart kontrollen är löst, utan att hen behöver klicka på Fortsätt. Gäller bara Proof-of-Work-captchan."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_LABEL="Godkännandet gäller i"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_DESC="Efter att ha klarat kontrollen en gång kan en besökare öppna alla skyddade sidor utan ny kontroll under så här lång tid."
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_1H="1 timme"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_6H="6 timmar"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_12H="12 timmar"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_24H="24 timmar"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_3D="3 dagar"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_7D="7 dagar"
COM_CSPAGEPROTECTOR_FIELD_PASS_LIFETIME_30D="30 dagar"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_LABEL="Knyt godkännandet till besökarens IP"
COM_CSPAGEPROTECTOR_FIELD_BIND_IP_DESC="Gör ett kopierat godkännande oanvändbart från alla andra adresser. Lämna detta avstängt om många av dina besökare använder mobilnät, där IP-adressen ofta ändras och de då skulle kontrolleras igen varje gång."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_LABEL="HTTP-status för kontrollsidan"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_DESC="200 fungerar överallt. 403 talar tydligt om för botar att de har nekats, men vissa webbhotell ersätter 403-sidor med en egen felsida, vilket skulle dölja kontrollen för riktiga besökare. Testa innan du byter."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_200="200 OK (rekommenderas)"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_STATUS_403="403 Forbidden"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_LABEL="Rubrik"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_HEADING_DESC="Rubrik som visas ovanför kontrollen. Lämna tomt för standardtexten."
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_LABEL="Meddelande"
COM_CSPAGEPROTECTOR_FIELD_CHALLENGE_MESSAGE_DESC="Text som visas under rubriken. Enkel HTML är tillåten. Lämna tomt för standardtexten."
COM_CSPAGEPROTECTOR_CHALLENGE_HEADING_DEFAULT="Kontrollerar din webbläsare"
COM_CSPAGEPROTECTOR_CHALLENGE_MESSAGE_DEFAULT="Det tar bara ett ögonblick. Det hjälper till att hålla automatiska skrapor borta från den här sidan."

; Options - Exemptions
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS="Undantag"
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_DESC="Vem som får hoppa över kontrollen."
COM_CSPAGEPROTECTOR_FIELDSET_EXEMPTIONS_SUBTITLE="Vem som aldrig ser kontrollen"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_LABEL="Inloggade användare hoppar över kontrollen"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_DESC="Alla som är inloggade på webbplatsen går direkt till skyddade sidor. Stäng av detta om du bara vill undanta vissa användargrupper."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_LABEL="Användargrupper som hoppar över kontrollen"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_DESC="Inloggade medlemmar i dessa grupper (eller i någon grupp under dem) hoppar över kontrollen."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_LABEL="Släpp in verifierade sökmotorer"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_DESC="Googlebot, Bingbot, Applebot, YandexBot, Baiduspider och Yahoo Slurp hoppar över kontrollen, men först efter att en omvänd och framåtriktad DNS-uppslagning har visat att begäran verkligen kommer från den sökmotorn. En skrapa som bara påstår sig vara Googlebot kontrolleras ändå. AI-crawlers som GPTBot och ClaudeBot finns inte med på listan. Om du stänger av detta försvinner skyddade sidor ur sökresultaten."
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_LABEL="Logga sökmotorbesök"
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_DESC="Skriv en loggpost varje gång en verifierad sökmotor släpps in. Avstängt som standard eftersom crawlers besöker sidan väldigt ofta."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_LABEL="IP-adresser som hoppar över kontrollen"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_DESC="En per rad. Både enskilda adresser (203.0.113.7) och intervall (203.0.113.0/24, 2001:db8::/32) fungerar. Rader som börjar med # ignoreras. Användbart för ditt kontor, driftövervakning och partner."
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_HINT="203.0.113.7 eller 198.51.100.0/24"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_LABEL="Besökarens IP kommer från"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_DESC="Ändra bara detta om webbplatsen ligger bakom en proxy eller ett CDN. Den valda headern litas bara på när begäran verkligen kommer via den proxyn: för Cloudflare, Cloudflares egna adresser; för de andra, adresserna i \"Betrodda proxyer\" (eller en proxy på samma server eller i ett privat nätverk när den listan är tom). Om någon annan skickar headern ignoreras den, så ingen kan utge sig för att vara en tillåten adress."
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_REMOTE_ADDR="Själva anslutningen (ingen proxy)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_CLOUDFLARE="Cloudflare (CF-Connecting-IP)"
