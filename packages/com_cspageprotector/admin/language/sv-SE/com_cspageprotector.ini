COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_LABEL="Betrodda proxyer"
COM_CSPAGEPROTECTOR_FIELD_TRUSTED_PROXIES_DESC="Adresserna eller intervallen för dina egna proxyer eller lastbalanserare, en per rad. Deras header X-Forwarded-For / X-Real-IP litas på, men ingen annans. Lämna tomt om proxyn körs på samma server eller i ett privat nätverk. Behövs inte för Cloudflare."
