; Dashboard
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_HEADING="Page Protector nasıl çalışır"
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_BODY="Korunan bir sayfanın ziyaretçileri önce kısa bir tarayıcı kontrolü görür. Tarayıcıları küçük bir iş kanıtı bulmacası çözer (bir insan için yaklaşık bir saniye, binlerce sayfaya istek gönderen bir kazıyıcı için ise gerçek bir CPU maliyeti), ardından bir geçiş izni alır ve izin süresi dolana kadar korunan sayfalarda normal şekilde gezinir. Giriş yapmış kullanıcılar, izin listesindeki IP'ler ve doğrulanmış arama motorları kontrolü atlayabilir."
COM_CSPAGEPROTECTOR_NO_GUARANTEE_LABEL="Garanti yok."
COM_CSPAGEPROTECTOR_NO_GUARANTEE_BODY="Botlar ve bilgisayar korsanları ısrarcıdır. Cybersalt Page Protector içeriğinizi korumak için elinden geleni yapar, ancak kötü niyetli kişilerin onu aşmanın başka bir yolunu bulmayacağını garanti edemeyiz. Her zaman olduğu gibi: İnternette olmasını istemediğiniz bilgiler varsa, onları internete koymayın."
