COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_DESC="Bu modüller, göründükleri her sayfada yalnızca kontrolü geçmiş ziyaretçilere (veya kontrolü atlayanlara: giriş yapmış kullanıcılar, izin listesindeki IP'ler, doğrulanmış arama motorları) gösterilir. Alt bilgi veya kenar çubuğundaki iletişim bilgileri, fiyatlar ya da üye bilgileri için kullanışlıdır."
