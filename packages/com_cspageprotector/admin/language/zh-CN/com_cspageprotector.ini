COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_DESC="写入事件日志的内容以及保存时长。"
COM_CSPAGEPROTECTOR_FIELDSET_LOGGING_SUBTITLE="仪表盘背后的事件日志"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_LABEL="保留事件日志"
COM_CSPAGEPROTECTOR_FIELD_LOGGING_ENABLED_DESC="记录每一次检查、通过、失败和拦截。仪表盘和事件日志都需要此项。"
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_LABEL="缩短 IP 地址"
COM_CSPAGEPROTECTOR_FIELD_ANONYMIZE_IP_DESC="默认开启。只保存每个地址的网络部分（保存 203.0.113.0 而不是 203.0.113.7），让日志更符合 GDPR 等隐私法规。处理请求时仍使用完整地址进行保护，只有保存下来的内容会被缩短。开启此项还会缩短日志中已有的地址。只有在需要精确地址时才关闭它，例如要在防火墙上屏蔽单个 IP。"
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_LABEL="记录保留天数"
COM_CSPAGEPROTECTOR_FIELD_RETENTION_DAYS_DESC="较旧的记录会被自动删除。0 表示永久保留。"

