COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_LABEL="已登录用户跳过检查"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_LOGGED_IN_DESC="任何登录网站的用户都可以直接访问受保护的页面。如果只想豁免部分用户组，请关闭此项。"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_LABEL="跳过检查的用户组"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_GROUPS_DESC="这些用户组（或其下级用户组）中已登录的成员会跳过检查。"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_LABEL="放行经过验证的搜索引擎"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_SEARCH_ENGINES_DESC="Googlebot、Bingbot、Applebot、YandexBot、Baiduspider 和 Yahoo Slurp 可以跳过检查，但前提是反向和正向 DNS 查询证明请求确实来自该搜索引擎。仅仅自称 Googlebot 的爬虫仍会被检查。GPTBot 和 ClaudeBot 等 AI 爬虫不在此列表中。关闭此项后，受保护的页面将从搜索结果中消失。"
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_LABEL="记录搜索引擎访问"
COM_CSPAGEPROTECTOR_FIELD_LOG_BOTS_DESC="每次放行经过验证的搜索引擎时写入一条日志。由于爬虫访问非常频繁，默认关闭。"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_LABEL="跳过检查的 IP 地址"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_DESC="每行一个。单个地址（203.0.113.7）和地址范围（203.0.113.0/24、2001:db8::/32）均可使用。以 # 开头的行会被忽略。适用于您的办公室、在线状态监控服务和合作伙伴。"
COM_CSPAGEPROTECTOR_FIELD_EXEMPT_IPS_HINT="203.0.113.7 或 198.51.100.0/24"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_LABEL="访客 IP 来源"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_DESC="仅当网站位于代理或 CDN 之后时才需要修改。只有当请求确实经过该代理时，所选标头才会被信任：对于 Cloudflare，是 Cloudflare 自己的地址；对于其他选项，是“受信任的代理”中填写的地址（如果该列表为空，则是同一服务器或私有网络中的代理）。其他任何人发送的该标头都会被忽略，因此没有人能冒充允许列表中的地址。"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_REMOTE_ADDR="连接本身（无代理）"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_CLOUDFLARE="Cloudflare (CF-Connecting-IP)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_XFF="代理 / 负载均衡器 (X-Forwarded-For)"
COM_CSPAGEPROTECTOR_FIELD_IP_SOURCE_X_REAL_IP="Nginx 代理 (X-Real-IP)"

