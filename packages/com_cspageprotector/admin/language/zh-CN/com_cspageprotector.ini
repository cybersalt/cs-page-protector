; Options - Modules
COM_CSPAGEPROTECTOR_FIELDSET_MODULES="模块"
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_DESC="保护模块中的内容，无论模块出现在哪个页面。只要有模块或内容受到保护，就会绕过 Joomla 自身的视图缓存和模块缓存，这样缓存的副本永远不会到达未通过检查的访客。页面缓存单独处理，并会继续对其他页面生效。"
COM_CSPAGEPROTECTOR_FIELDSET_MODULES_SUBTITLE="即使在未受保护的页面上，也让模块内容远离爬虫"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_LABEL="受保护的模块"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_MODULES_DESC="无论出现在哪个页面，这些模块都只向已通过检查的访客（或可以跳过检查的访客：已登录用户、允许列表中的 IP、经过验证的搜索引擎）显示。适用于页脚或侧边栏中的联系方式、价格或会员信息。"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_LABEL="受保护的模块位置"
COM_CSPAGEPROTECTOR_FIELD_PROTECT_POSITIONS_DESC="这些位置中的每个模块都会受到保护，包括以后添加的模块。"
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES="%2$s（%1$d 个模块）"
COM_CSPAGEPROTECTOR_POSITION_WITH_N_MODULES_1="%2$s（1 个模块）"
COM_CSPAGEPROTECTOR_NO_POSITION="（无位置）"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_LABEL="未通过检查的访客看到"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_DESC="占位符会保留模块的标题和外框，并显示一个“显示内容”按钮，点击后运行检查并直接返回。隐藏则会完全移除模块，其位置也随之收起；访客只有在其他地方（例如受保护的页面）通过检查后才能看到它。无论哪种方式，验证码都不会显示在模块内，因此一个页面上最多只有一个验证码。"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_PLACEHOLDER="带有“显示内容”按钮的占位符"
COM_CSPAGEPROTECTOR_FIELD_MODULE_MODE_HIDE="不显示：完全隐藏模块"
