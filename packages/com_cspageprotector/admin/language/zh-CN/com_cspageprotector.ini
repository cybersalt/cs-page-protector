; Dashboard
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_HEADING="Page Protector 的工作原理"
COM_CSPAGEPROTECTOR_DASHBOARD_INTRO_BODY="访问受保护页面的访客会先看到一个简短的浏览器检查。他们的浏览器会解一道小小的工作量证明题（对人来说大约一秒，对访问成千上万个页面的爬虫来说则是实实在在的 CPU 开销），然后获得一个通行凭证，在凭证过期前可以正常浏览受保护的页面。已登录用户、允许列表中的 IP 和经过验证的搜索引擎可以跳过检查。"
