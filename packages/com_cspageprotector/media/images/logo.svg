<!--
  cs-page-protector logo
  Source: Tabler Icons "browser" (MIT licensed) + hand-drawn padlock corner badge.
  Cybersalt duotone: cobalt #0102E1 browser window, orange #FE9904 padlock badge
  ("this page is locked behind a check"). 1200x1200 intrinsic, Tabler paths kept
  in their 24-unit space via scale(50) per the extension-logos convention.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <g transform="scale(50)">
    <!-- Cobalt browser window: frame, title bar, two content lines -->
    <g stroke="#0102E1">
      <path d="M4 4m0 1a1 1 0 0 1 1 -1h14a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-14a1 1 0 0 1 -1 -1z" />
      <path d="M4 8h16" />
      <path d="M8 4v4" />
      <path d="M8 12h8" />
      <path d="M8 16h5" />
    </g>
    <!-- White knockout behind the padlock badge for a clean overlap -->
    <circle cx="18" cy="5.5" r="3.6" fill="#ffffff" stroke="#ffffff" stroke-width="1" />
    <!-- Orange padlock corner badge -->
    <path d="M16.7 5.2v-1a1.3 1.3 0 0 1 2.6 0v1" stroke="#FE9904" stroke-width="1.3" />
    <rect x="15.6" y="5.2" width="4.8" height="3.6" rx="0.8" stroke="#FE9904" stroke-width="1.3" fill="#FE9904" fill-opacity="0.18" />
    <path d="M18 6.6v0.8" stroke="#FE9904" stroke-width="1.3" />
  </g>
</svg>
