PKG_CSPAGEPROTECTOR="Cybersalt Page Protector"
PKG_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Autor: <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Postaví před vybrané stránky kontrolu typu proof-of-work, takže scrapery musí vynaložit skutečný výpočetní čas, než získají váš obsah. Skuteční návštěvníci jednou uvidí krátký krok &quot;kontrola prohlížeče&quot; a pak web procházejí normálně."
PKG_CSPAGEPROTECTOR_CARD_TITLE_INSTALL="Cybersalt Page Protector je nainstalován"
PKG_CSPAGEPROTECTOR_CARD_TITLE_UPDATE="Cybersalt Page Protector byl aktualizován"
PKG_CSPAGEPROTECTOR_CARD_NEXT_STEPS="Dokud nevyberete stránky, není nic chráněno. Otevřete Možnosti, vyberte položky menu k ochraně, uložte a pak otevřete jednu z těchto stránek v anonymním okně prohlížeče, abyste kontrolu viděli."
PKG_CSPAGEPROTECTOR_CARD_POW_ENABLED="Vestavěná CAPTCHA Proof-of-Work od Joomla byla zapnuta, aby kontrola mohla běžet. Tím je jen k dispozici; CAPTCHA používaná ve vašich ostatních formulářích se nemění."
PKG_CSPAGEPROTECTOR_CARD_NO_CAPTCHA_HEADING="Zatím není připravena žádná CAPTCHA."
PKG_CSPAGEPROTECTOR_CARD_POW_MISSING="Page Protector provádí kontrolu prostřednictvím CAPTCHA pluginu Joomla. Ten, který používá ve výchozím nastavení, CAPTCHA Proof-of-Work od Joomla, je součástí Joomla 6.1 a novějších, a tento web běží na Joomla %s. Aktualizujte Joomla, nebo nainstalujte a povolte jiný CAPTCHA plugin a vyberte ho v Možnostech."
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_MISSING="CAPTCHA plugin „%s“ vybraný v Možnostech není nainstalován. Nainstalujte ho, nebo v Možnostech vyberte jinou CAPTCHA."
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_DISABLED="CAPTCHA plugin „%s“ vybraný v Možnostech je zakázán. Povolte ho v sekci CAPTCHA pluginy, nebo v Možnostech vyberte jinou CAPTCHA."
PKG_CSPAGEPROTECTOR_CARD_NO_CAPTCHA_UNTIL="Do té doby nemůže Page Protector nikoho zkontrolovat, takže stránky, které chráníte, nejsou ve skutečnosti chráněné."
