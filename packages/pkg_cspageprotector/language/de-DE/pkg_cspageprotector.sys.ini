PKG_CSPAGEPROTECTOR="Cybersalt Page Protector"
PKG_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Von <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Stellt den von Ihnen gewählten Seiten eine Proof-of-Work-Prüfung voran, sodass Scraper echte Rechenzeit aufwenden müssen, bevor sie an Ihre Inhalte kommen. Echte Besucher sehen einmalig einen kurzen Schritt &quot;Browser wird überprüft&quot; und surfen danach ganz normal."
PKG_CSPAGEPROTECTOR_CARD_TITLE_INSTALL="Cybersalt Page Protector ist installiert"
PKG_CSPAGEPROTECTOR_CARD_TITLE_UPDATE="Cybersalt Page Protector wurde aktualisiert"
PKG_CSPAGEPROTECTOR_CARD_NEXT_STEPS="Es ist nichts geschützt, bis Sie die Seiten auswählen. Öffnen Sie die Optionen, wählen Sie die zu schützenden Menüeinträge aus, speichern Sie und öffnen Sie dann eine dieser Seiten in einem privaten Browserfenster, um die Prüfung zu sehen."
PKG_CSPAGEPROTECTOR_CARD_POW_ENABLED="Das in Joomla integrierte Proof-of-Work-Captcha wurde aktiviert, damit die Prüfung laufen kann. Es wird dadurch nur verfügbar gemacht; das Captcha Ihrer anderen Formulare ändert sich nicht."
PKG_CSPAGEPROTECTOR_CARD_NO_CAPTCHA_HEADING="Es ist noch kein Captcha bereit."
PKG_CSPAGEPROTECTOR_CARD_POW_MISSING="Page Protector führt seine Prüfung über ein Joomla-Captcha-Plugin aus. Das standardmäßig verwendete, das Proof-of-Work-Captcha von Joomla, ist ab Joomla 6.1 enthalten, und diese Website läuft mit Joomla %s. Aktualisieren Sie Joomla oder installieren und aktivieren Sie ein anderes Captcha-Plugin und wählen Sie es in den Optionen aus."
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_MISSING="Das in den Optionen gewählte Captcha-Plugin \"%s\" ist nicht installiert. Installieren Sie es oder wählen Sie in den Optionen ein anderes Captcha."
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_DISABLED="Das in den Optionen gewählte Captcha-Plugin \"%s\" ist deaktiviert. Aktivieren Sie es unter Captcha-Plugins oder wählen Sie in den Optionen ein anderes Captcha."
PKG_CSPAGEPROTECTOR_CARD_NO_CAPTCHA_UNTIL="Bis dahin kann Page Protector niemanden prüfen, die Seiten, die Sie schützen, sind also nicht wirklich geschützt."
PKG_CSPAGEPROTECTOR_CARD_CHOOSE_PAGES="Zu schützende Seiten auswählen"
PKG_CSPAGEPROTECTOR_CARD_OPEN_DASHBOARD="Dashboard öffnen"
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_SETTINGS="Captcha-Plugins"
PKG_CSPAGEPROTECTOR_CARD_JOOMLA_UPDATE="Nach Joomla-Aktualisierungen suchen"
