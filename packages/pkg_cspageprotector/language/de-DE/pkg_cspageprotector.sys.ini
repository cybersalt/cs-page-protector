PKG_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Von <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Stellt den von Ihnen gewählten Seiten eine Proof-of-Work-Prüfung voran, sodass Scraper echte Rechenzeit aufwenden müssen, bevor sie an Ihre Inhalte kommen. Echte Besucher sehen einmalig einen kurzen Schritt &quot;Browser wird überprüft&quot; und surfen danach ganz normal."
