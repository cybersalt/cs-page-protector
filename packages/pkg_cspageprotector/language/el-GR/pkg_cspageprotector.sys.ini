PKG_CSPAGEPROTECTOR="Cybersalt Page Protector"
PKG_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Από την <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Τοποθετεί έναν έλεγχο proof-of-work μπροστά από τις σελίδες που επιλέγετε, ώστε τα scrapers να πρέπει να ξοδέψουν πραγματικό υπολογιστικό χρόνο πριν πάρουν το περιεχόμενό σας. Οι πραγματικοί επισκέπτες βλέπουν μία φορά ένα σύντομο βήμα &quot;έλεγχος του προγράμματος περιήγησης&quot; και μετά περιηγούνται κανονικά."
PKG_CSPAGEPROTECTOR_CARD_TITLE_INSTALL="Το Cybersalt Page Protector εγκαταστάθηκε"
PKG_CSPAGEPROTECTOR_CARD_TITLE_UPDATE="Το Cybersalt Page Protector ενημερώθηκε"
PKG_CSPAGEPROTECTOR_CARD_NEXT_STEPS="Τίποτα δεν προστατεύεται μέχρι να επιλέξετε σελίδες. Ανοίξτε τις Επιλογές, επιλέξτε τα στοιχεία μενού που θα προστατεύονται, αποθηκεύστε και μετά ανοίξτε μία από αυτές τις σελίδες σε ιδιωτικό παράθυρο του προγράμματος περιήγησης για να δείτε τον έλεγχο."
PKG_CSPAGEPROTECTOR_CARD_POW_ENABLED="Το ενσωματωμένο captcha Proof-of-Work του Joomla ενεργοποιήθηκε για να μπορεί να εκτελείται ο έλεγχος. Αυτό απλώς το κάνει διαθέσιμο· δεν αλλάζει το captcha που χρησιμοποιούν οι άλλες φόρμες σας."
PKG_CSPAGEPROTECTOR_CARD_NO_CAPTCHA_HEADING="Δεν υπάρχει ακόμη έτοιμο captcha."
PKG_CSPAGEPROTECTOR_CARD_POW_MISSING="Το Page Protector εκτελεί τον έλεγχό του μέσω ενός πρόσθετου captcha του Joomla. Αυτό που χρησιμοποιεί από προεπιλογή, το captcha Proof-of-Work του Joomla, περιλαμβάνεται στο Joomla 6.1 και νεότερα, και αυτός ο ιστότοπος τρέχει Joomla %s. Ενημερώστε το Joomla ή εγκαταστήστε και ενεργοποιήστε άλλο πρόσθετο captcha και επιλέξτε το στις Επιλογές."
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_MISSING="Το πρόσθετο captcha «%s» που επιλέχθηκε στις Επιλογές δεν είναι εγκατεστημένο. Εγκαταστήστε το ή επιλέξτε άλλο captcha στις Επιλογές."
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_DISABLED="Το πρόσθετο captcha «%s» που επιλέχθηκε στις Επιλογές είναι απενεργοποιημένο. Ενεργοποιήστε το από τα Πρόσθετα captcha ή επιλέξτε άλλο captcha στις Επιλογές."
PKG_CSPAGEPROTECTOR_CARD_NO_CAPTCHA_UNTIL="Μέχρι τότε, το Page Protector δεν μπορεί να ελέγξει κανέναν, οπότε οι σελίδες που προστατεύετε δεν προστατεύονται πραγματικά."
PKG_CSPAGEPROTECTOR_CARD_CHOOSE_PAGES="Επιλογή σελίδων για προστασία"
PKG_CSPAGEPROTECTOR_CARD_OPEN_DASHBOARD="Άνοιγμα του πίνακα ελέγχου"
