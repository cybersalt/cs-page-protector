PKG_CSPAGEPROTECTOR="Cybersalt Page Protector"
PKG_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>By <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Puts a proof-of-work check in front of the pages you choose, so scrapers have to spend real computing time before they get your content. Real visitors see a short &quot;checking your browser&quot; step once, then browse normally."
PKG_CSPAGEPROTECTOR_CARD_TITLE_INSTALL="Cybersalt Page Protector is installed"
PKG_CSPAGEPROTECTOR_CARD_TITLE_UPDATE="Cybersalt Page Protector has been updated"
PKG_CSPAGEPROTECTOR_CARD_NEXT_STEPS="Nothing is protected until you choose the pages. Open Options, pick the menu items to protect, save, then open one of those pages in a private browser window to see the check."
PKG_CSPAGEPROTECTOR_CARD_POW_ENABLED="Joomla's built-in Proof-of-Work captcha was switched on so the check can run. This only makes it available; it doesn't change the captcha used by your other forms."
PKG_CSPAGEPROTECTOR_CARD_NO_CAPTCHA_HEADING="No captcha is ready yet."
PKG_CSPAGEPROTECTOR_CARD_POW_MISSING="Page Protector runs its check through a Joomla captcha plugin. The one it uses by default, Joomla's Proof-of-Work captcha, comes with Joomla 6.1 and later, and this site runs Joomla %s. Update Joomla, or install and enable another captcha plugin and choose it in Options."
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_MISSING="The captcha plugin \"%s\" chosen in Options is not installed. Install it, or choose another captcha in Options."
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_DISABLED="The captcha plugin \"%s\" chosen in Options is disabled. Enable it under Captcha plugins, or choose another captcha in Options."
PKG_CSPAGEPROTECTOR_CARD_NO_CAPTCHA_UNTIL="Until then, Page Protector can't check anyone, so the pages you protect aren't really protected."
PKG_CSPAGEPROTECTOR_CARD_CHOOSE_PAGES="Choose pages to protect"
PKG_CSPAGEPROTECTOR_CARD_OPEN_DASHBOARD="Open the dashboard"
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_SETTINGS="Captcha plugins"
