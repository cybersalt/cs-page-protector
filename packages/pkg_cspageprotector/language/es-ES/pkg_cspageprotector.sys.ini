PKG_CSPAGEPROTECTOR="Cybersalt Page Protector"
PKG_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Por <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Coloca una comprobación de prueba de trabajo delante de las páginas que elija, de modo que los scrapers tengan que gastar tiempo de cálculo real antes de obtener su contenido. Los visitantes reales ven una vez un breve paso de &quot;comprobando su navegador&quot; y después navegan con normalidad."
PKG_CSPAGEPROTECTOR_CARD_TITLE_INSTALL="Cybersalt Page Protector se ha instalado"
PKG_CSPAGEPROTECTOR_CARD_TITLE_UPDATE="Cybersalt Page Protector se ha actualizado"
PKG_CSPAGEPROTECTOR_CARD_NEXT_STEPS="No se protege nada hasta que elija las páginas. Abra Opciones, elija los elementos de menú que quiere proteger, guarde y después abra una de esas páginas en una ventana privada del navegador para ver la comprobación."
PKG_CSPAGEPROTECTOR_CARD_POW_ENABLED="Se ha activado el captcha Proof-of-Work integrado en Joomla para que la comprobación pueda ejecutarse. Esto solo lo deja disponible; no cambia el captcha que usan sus otros formularios."
PKG_CSPAGEPROTECTOR_CARD_NO_CAPTCHA_HEADING="Todavía no hay ningún captcha listo."
PKG_CSPAGEPROTECTOR_CARD_POW_MISSING="Page Protector hace su comprobación a través de un plugin de captcha de Joomla. El que usa por defecto, el captcha Proof-of-Work de Joomla, se incluye a partir de Joomla 6.1, y este sitio usa Joomla %s. Actualice Joomla, o instale y active otro plugin de captcha y elíjalo en Opciones."
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_MISSING="El plugin de captcha \"%s\" elegido en Opciones no está instalado. Instálelo o elija otro captcha en Opciones."
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_DISABLED="El plugin de captcha \"%s\" elegido en Opciones está desactivado. Actívelo en Plugins de captcha o elija otro captcha en Opciones."
PKG_CSPAGEPROTECTOR_CARD_NO_CAPTCHA_UNTIL="Mientras tanto, Page Protector no puede comprobar a nadie, así que las páginas que protege no están protegidas de verdad."
PKG_CSPAGEPROTECTOR_CARD_CHOOSE_PAGES="Elegir las páginas que proteger"
PKG_CSPAGEPROTECTOR_CARD_OPEN_DASHBOARD="Abrir el panel"
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_SETTINGS="Plugins de captcha"
PKG_CSPAGEPROTECTOR_CARD_JOOMLA_UPDATE="Buscar actualizaciones de Joomla"
PKG_CSPAGEPROTECTOR_CARD_SUPPORT="¿Necesita ayuda?"
