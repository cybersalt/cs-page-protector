PKG_CSPAGEPROTECTOR="Cybersalt Page Protector"
PKG_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Por <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Coloca una comprobación de prueba de trabajo delante de las páginas que elija, de modo que los scrapers tengan que gastar tiempo de cálculo real antes de obtener su contenido. Los visitantes reales ven una vez un breve paso de &quot;comprobando su navegador&quot; y después navegan con normalidad."
PKG_CSPAGEPROTECTOR_CARD_TITLE_INSTALL="Cybersalt Page Protector se ha instalado"
PKG_CSPAGEPROTECTOR_CARD_TITLE_UPDATE="Cybersalt Page Protector se ha actualizado"
PKG_CSPAGEPROTECTOR_CARD_NEXT_STEPS="No se protege nada hasta que elija las páginas. Abra Opciones, elija los elementos de menú que quiere proteger, guarde y después abra una de esas páginas en una ventana privada del navegador para ver la comprobación."
PKG_CSPAGEPROTECTOR_CARD_POW_ENABLED="Se ha activado el captcha Proof-of-Work integrado en Joomla para que la comprobación pueda ejecutarse. Esto solo lo deja disponible; no cambia el captcha que usan sus otros formularios."
