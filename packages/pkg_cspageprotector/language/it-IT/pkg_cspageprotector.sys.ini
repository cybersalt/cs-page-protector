PKG_CSPAGEPROTECTOR="Cybersalt Page Protector"
PKG_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Di <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Mette un controllo proof-of-work davanti alle pagine che scegli, così gli scraper devono spendere tempo di calcolo reale prima di ottenere i tuoi contenuti. I visitatori reali vedono una sola volta un breve passaggio &quot;verifica del browser in corso&quot;, poi navigano normalmente."
PKG_CSPAGEPROTECTOR_CARD_TITLE_INSTALL="Cybersalt Page Protector è installato"
PKG_CSPAGEPROTECTOR_CARD_TITLE_UPDATE="Cybersalt Page Protector è stato aggiornato"
PKG_CSPAGEPROTECTOR_CARD_NEXT_STEPS="Nulla è protetto finché non scegli le pagine. Apri le Opzioni, scegli le voci di menu da proteggere, salva, poi apri una di quelle pagine in una finestra di navigazione privata per vedere il controllo."
PKG_CSPAGEPROTECTOR_CARD_POW_ENABLED="Il captcha Proof-of-Work integrato in Joomla è stato abilitato perché il controllo possa funzionare. Questo lo rende solo disponibile; non cambia il captcha usato dagli altri tuoi moduli."
PKG_CSPAGEPROTECTOR_CARD_NO_CAPTCHA_HEADING="Nessun captcha è ancora pronto."
PKG_CSPAGEPROTECTOR_CARD_POW_MISSING="Page Protector esegue il controllo tramite un plugin captcha di Joomla. Quello che usa di default, il captcha Proof-of-Work di Joomla, è incluso a partire da Joomla 6.1, e questo sito usa Joomla %s. Aggiorna Joomla, oppure installa e abilita un altro plugin captcha e sceglilo nelle Opzioni."
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_MISSING="Il plugin captcha \"%s\" scelto nelle Opzioni non è installato. Installalo, oppure scegli un altro captcha nelle Opzioni."
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_DISABLED="Il plugin captcha \"%s\" scelto nelle Opzioni è disabilitato. Abilitalo in Plugin captcha, oppure scegli un altro captcha nelle Opzioni."
PKG_CSPAGEPROTECTOR_CARD_NO_CAPTCHA_UNTIL="Fino ad allora Page Protector non può controllare nessuno, quindi le pagine che proteggi non sono davvero protette."
PKG_CSPAGEPROTECTOR_CARD_CHOOSE_PAGES="Scegli le pagine da proteggere"
