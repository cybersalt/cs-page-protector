PKG_CSPAGEPROTECTOR="Cybersalt Page Protector"
PKG_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>開発元: <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a></strong> 選んだページの前にプルーフ・オブ・ワーク（作業証明）のチェックを置き、スクレイパーがコンテンツを取得する前に実際の計算時間を使わせます。通常の訪問者には &quot;ブラウザを確認しています&quot; という短い手順が一度だけ表示され、その後は普通に閲覧できます。"
PKG_CSPAGEPROTECTOR_CARD_TITLE_INSTALL="Cybersalt Page Protector をインストールしました"
PKG_CSPAGEPROTECTOR_CARD_TITLE_UPDATE="Cybersalt Page Protector を更新しました"
PKG_CSPAGEPROTECTOR_CARD_NEXT_STEPS="ページを選ぶまでは何も保護されません。オプションを開いて保護するメニュー項目を選んで保存し、そのページのいずれかをブラウザのプライベートウィンドウで開いて、チェックを確認してください。"
PKG_CSPAGEPROTECTOR_CARD_POW_ENABLED="チェックを実行できるよう、Joomla 標準の Proof-of-Work キャプチャを有効にしました。これは利用可能にしただけで、他のフォームで使っているキャプチャは変わりません。"
PKG_CSPAGEPROTECTOR_CARD_NO_CAPTCHA_HEADING="使えるキャプチャがまだありません。"
PKG_CSPAGEPROTECTOR_CARD_POW_MISSING="Page Protector は Joomla のキャプチャプラグインを通じてチェックを行います。標準で使う Joomla の Proof-of-Work キャプチャは Joomla 6.1 以降に含まれていますが、このサイトは Joomla %s です。Joomla を更新するか、別のキャプチャプラグインをインストールして有効にし、オプションで選んでください。"
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_MISSING="オプションで選択したキャプチャプラグイン「%s」はインストールされていません。インストールするか、オプションで別のキャプチャを選んでください。"
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_DISABLED="オプションで選択したキャプチャプラグイン「%s」は無効になっています。キャプチャプラグインの画面で有効にするか、オプションで別のキャプチャを選んでください。"
PKG_CSPAGEPROTECTOR_CARD_NO_CAPTCHA_UNTIL="それまでの間、Page Protector は誰もチェックできないため、保護したページは実際には保護されていません。"
