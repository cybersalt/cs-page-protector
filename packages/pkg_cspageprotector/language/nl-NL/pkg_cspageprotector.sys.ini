PKG_CSPAGEPROTECTOR="Cybersalt Page Protector"
PKG_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Door <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Plaatst een proof-of-work-controle vóór de pagina's die u kiest, zodat scrapers echte rekentijd moeten besteden voordat ze bij uw inhoud komen. Echte bezoekers zien één keer een korte stap &quot;uw browser wordt gecontroleerd&quot; en surfen daarna gewoon verder."
PKG_CSPAGEPROTECTOR_CARD_TITLE_INSTALL="Cybersalt Page Protector is geïnstalleerd"
PKG_CSPAGEPROTECTOR_CARD_TITLE_UPDATE="Cybersalt Page Protector is bijgewerkt"
PKG_CSPAGEPROTECTOR_CARD_NEXT_STEPS="Er is niets beveiligd totdat u de pagina's kiest. Open Opties, kies de menu-items die u wilt beveiligen, sla op en open dan een van die pagina's in een privévenster van uw browser om de controle te zien."
PKG_CSPAGEPROTECTOR_CARD_POW_ENABLED="De ingebouwde Proof-of-Work-captcha van Joomla is ingeschakeld zodat de controle kan werken. Dit maakt hem alleen beschikbaar; de captcha die uw andere formulieren gebruiken verandert niet."
PKG_CSPAGEPROTECTOR_CARD_NO_CAPTCHA_HEADING="Er is nog geen captcha gereed."
PKG_CSPAGEPROTECTOR_CARD_POW_MISSING="Page Protector voert zijn controle uit via een Joomla-captcha-plugin. De plugin die standaard wordt gebruikt, de Proof-of-Work-captcha van Joomla, zit in Joomla 6.1 en hoger, en deze website draait op Joomla %s. Werk Joomla bij, of installeer en schakel een andere captcha-plugin in en kies die in Opties."
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_MISSING="De in Opties gekozen captcha-plugin \"%s\" is niet geïnstalleerd. Installeer hem, of kies in Opties een andere captcha."
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_DISABLED="De in Opties gekozen captcha-plugin \"%s\" is uitgeschakeld. Schakel hem in onder Captcha-plugins, of kies in Opties een andere captcha."
PKG_CSPAGEPROTECTOR_CARD_NO_CAPTCHA_UNTIL="Tot die tijd kan Page Protector niemand controleren, dus de pagina's die u beveiligt zijn niet echt beveiligd."
PKG_CSPAGEPROTECTOR_CARD_CHOOSE_PAGES="Te beveiligen pagina's kiezen"
