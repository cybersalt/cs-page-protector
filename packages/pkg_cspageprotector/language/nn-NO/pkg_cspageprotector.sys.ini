PKG_CSPAGEPROTECTOR="Cybersalt Page Protector"
PKG_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Laga av <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Set ein arbeidsprov-kontroll (proof-of-work) framfor sidene du vel, slik at skraperobotar må bruke verkeleg reknetid før dei får tak i innhaldet ditt. Vanlege besøkjande ser eit kort &quot;kontrollerer nettlesaren din&quot;-steg éin gong og surfar deretter som vanleg."
PKG_CSPAGEPROTECTOR_CARD_TITLE_INSTALL="Cybersalt Page Protector er installert"
PKG_CSPAGEPROTECTOR_CARD_TITLE_UPDATE="Cybersalt Page Protector er oppdatert"
PKG_CSPAGEPROTECTOR_CARD_NEXT_STEPS="Ingenting er verna før du vel sidene. Opne Innstillingar, vel menypunkta som skal vernast, lagre, og opne så ei av desse sidene i eit privat nettlesarvindauge for å sjå kontrollen."
PKG_CSPAGEPROTECTOR_CARD_POW_ENABLED="Den innebygde Proof-of-Work-captchaen i Joomla vart slått på, slik at kontrollen kan køyre. Dette gjer han berre tilgjengeleg; captchaen som dei andre skjemaa dine brukar, blir ikkje endra."
PKG_CSPAGEPROTECTOR_CARD_NO_CAPTCHA_HEADING="Ingen captcha er klar enno."
PKG_CSPAGEPROTECTOR_CARD_POW_MISSING="Page Protector køyrer kontrollen sin gjennom eit captcha-programtillegg i Joomla. Det som blir brukt som standard, Proof-of-Work-captchaen i Joomla, følgjer med Joomla 6.1 og nyare, og denne nettstaden køyrer Joomla %s. Oppdater Joomla, eller installer og aktiver eit anna captcha-programtillegg og vel det i Innstillingar."
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_MISSING="Captcha-programtillegget «%s» som er valt i Innstillingar, er ikkje installert. Installer det, eller vel ein annan captcha i Innstillingar."
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_DISABLED="Captcha-programtillegget «%s» som er valt i Innstillingar, er deaktivert. Aktiver det under Captcha-programtillegg, eller vel ein annan captcha i Innstillingar."
PKG_CSPAGEPROTECTOR_CARD_NO_CAPTCHA_UNTIL="Inntil då kan ikkje Page Protector kontrollere nokon, så sidene du vernar, er eigentleg ikkje verna."
