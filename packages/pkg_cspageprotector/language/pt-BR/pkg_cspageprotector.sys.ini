PKG_CSPAGEPROTECTOR="Cybersalt Page Protector"
PKG_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Por <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Coloca uma verificação de prova de trabalho na frente das páginas que você escolher, para que os scrapers precisem gastar tempo de processamento real antes de obter o seu conteúdo. Visitantes reais veem uma única vez uma etapa rápida de &quot;verificando seu navegador&quot; e depois navegam normalmente."
PKG_CSPAGEPROTECTOR_CARD_TITLE_INSTALL="O Cybersalt Page Protector foi instalado"
PKG_CSPAGEPROTECTOR_CARD_TITLE_UPDATE="O Cybersalt Page Protector foi atualizado"
PKG_CSPAGEPROTECTOR_CARD_NEXT_STEPS="Nada fica protegido até você escolher as páginas. Abra Opções, escolha os itens de menu a proteger, salve e depois abra uma dessas páginas numa janela anônima do navegador para ver a verificação."
PKG_CSPAGEPROTECTOR_CARD_POW_ENABLED="O captcha Proof-of-Work integrado ao Joomla foi habilitado para que a verificação possa ser executada. Isto apenas o deixa disponível; não muda o captcha usado pelos seus outros formulários."
PKG_CSPAGEPROTECTOR_CARD_NO_CAPTCHA_HEADING="Ainda não há nenhum captcha pronto."
PKG_CSPAGEPROTECTOR_CARD_POW_MISSING="O Page Protector faz a verificação por meio de um plugin de captcha do Joomla. O que ele usa por padrão, o captcha Proof-of-Work do Joomla, vem com o Joomla 6.1 e posteriores, e este site usa o Joomla %s. Atualize o Joomla ou instale e habilite outro plugin de captcha e escolha-o em Opções."
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_MISSING="O plugin de captcha \"%s\" escolhido em Opções não está instalado. Instale-o ou escolha outro captcha em Opções."
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_DISABLED="O plugin de captcha \"%s\" escolhido em Opções está desabilitado. Habilite-o em Plugins de captcha ou escolha outro captcha em Opções."
PKG_CSPAGEPROTECTOR_CARD_NO_CAPTCHA_UNTIL="Até lá, o Page Protector não consegue verificar ninguém, então as páginas que você protege não estão realmente protegidas."
