PKG_CSPAGEPROTECTOR="Cybersalt Page Protector"
PKG_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Разработчик: <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Ставит проверку proof-of-work перед выбранными Вами страницами, так что парсерам приходится тратить реальное процессорное время, прежде чем они получат Ваш контент. Обычные посетители один раз видят короткий шаг &quot;проверка браузера&quot;, а затем пользуются сайтом как обычно."
PKG_CSPAGEPROTECTOR_CARD_TITLE_INSTALL="Cybersalt Page Protector установлен"
PKG_CSPAGEPROTECTOR_CARD_TITLE_UPDATE="Cybersalt Page Protector обновлён"
PKG_CSPAGEPROTECTOR_CARD_NEXT_STEPS="Пока Вы не выберете страницы, ничего не защищено. Откройте настройки, выберите пункты меню для защиты, сохраните, а затем откройте одну из этих страниц в приватном окне браузера, чтобы увидеть проверку."
PKG_CSPAGEPROTECTOR_CARD_POW_ENABLED="Встроенная капча Proof-of-Work от Joomla была включена, чтобы проверка могла работать. Это только делает её доступной и не меняет капчу, которую используют другие Ваши формы."
PKG_CSPAGEPROTECTOR_CARD_NO_CAPTCHA_HEADING="Пока нет готовой капчи."
PKG_CSPAGEPROTECTOR_CARD_POW_MISSING="Page Protector проводит проверку через плагин капчи Joomla. Тот, что используется по умолчанию, — капча Proof-of-Work от Joomla — входит в Joomla 6.1 и новее, а на этом сайте работает Joomla %s. Обновите Joomla или установите и включите другой плагин капчи и выберите его в настройках."
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_MISSING="Плагин капчи «%s», выбранный в настройках, не установлен. Установите его или выберите другую капчу в настройках."
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_DISABLED="Плагин капчи «%s», выбранный в настройках, отключён. Включите его в разделе «Плагины капчи» или выберите другую капчу в настройках."
PKG_CSPAGEPROTECTOR_CARD_NO_CAPTCHA_UNTIL="До тех пор Page Protector не может никого проверить, так что страницы, которые Вы защищаете, на самом деле не защищены."
PKG_CSPAGEPROTECTOR_CARD_CHOOSE_PAGES="Выбрать страницы для защиты"
