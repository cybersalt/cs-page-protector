PKG_CSPAGEPROTECTOR="Cybersalt Page Protector"
PKG_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Av <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Sätter en proof-of-work-kontroll framför de sidor du väljer, så att skrapor måste lägga verklig datortid innan de kommer åt ditt innehåll. Riktiga besökare ser ett kort steg &quot;kontrollerar din webbläsare&quot; en gång och surfar sedan som vanligt."
PKG_CSPAGEPROTECTOR_CARD_TITLE_INSTALL="Cybersalt Page Protector är installerat"
PKG_CSPAGEPROTECTOR_CARD_TITLE_UPDATE="Cybersalt Page Protector har uppdaterats"
PKG_CSPAGEPROTECTOR_CARD_NEXT_STEPS="Ingenting är skyddat förrän du väljer sidorna. Öppna Inställningar, välj vilka menyalternativ som ska skyddas, spara och öppna sedan en av de sidorna i ett privat webbläsarfönster för att se kontrollen."
PKG_CSPAGEPROTECTOR_CARD_POW_ENABLED="Joomlas inbyggda Proof-of-Work-captcha har aktiverats så att kontrollen kan köras. Den görs bara tillgänglig; captchan som dina andra formulär använder ändras inte."
PKG_CSPAGEPROTECTOR_CARD_NO_CAPTCHA_HEADING="Ingen captcha är klar än."
PKG_CSPAGEPROTECTOR_CARD_POW_MISSING="Page Protector kör sin kontroll via en captcha-plugin i Joomla. Den som används som standard, Joomlas Proof-of-Work-captcha, ingår i Joomla 6.1 och senare, och den här webbplatsen kör Joomla %s. Uppdatera Joomla, eller installera och aktivera en annan captcha-plugin och välj den under Inställningar."
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_MISSING="Captcha-pluginen \"%s\" som valts under Inställningar är inte installerad. Installera den, eller välj en annan captcha under Inställningar."
PKG_CSPAGEPROTECTOR_CARD_CAPTCHA_DISABLED="Captcha-pluginen \"%s\" som valts under Inställningar är inaktiverad. Aktivera den under Captcha-pluginer, eller välj en annan captcha under Inställningar."
PKG_CSPAGEPROTECTOR_CARD_NO_CAPTCHA_UNTIL="Till dess kan Page Protector inte kontrollera någon, så sidorna du skyddar är inte riktigt skyddade."
