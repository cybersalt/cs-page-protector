PKG_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong><a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a> tarafından geliştirildi.</strong> Seçtiğiniz sayfaların önüne bir iş kanıtı (proof-of-work) kontrolü koyar; böylece kazıyıcılar içeriğinize ulaşmadan önce gerçek işlem süresi harcamak zorunda kalır. Gerçek ziyaretçiler bir kez kısa bir &quot;tarayıcınız kontrol ediliyor&quot; adımı görür, sonra normal şekilde gezinir."
