PLG_SYSTEM_CSPAGEPROTECTOR="System - Cybersalt Page Protector"
PLG_SYSTEM_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Von <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Wächter für Cybersalt Page Protector. Zeigt auf den von Ihnen gewählten Seiten eine Proof-of-Work-Prüfung an, sodass Scraper echte Arbeit leisten müssen, bevor sie an Ihre Inhalte kommen. Die Einstellungen finden Sie unter Komponenten &rarr; Cybersalt Page Protector &rarr; Optionen."
