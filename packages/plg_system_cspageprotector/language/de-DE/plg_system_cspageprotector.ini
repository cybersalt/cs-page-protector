PLG_SYSTEM_CSPAGEPROTECTOR="System - Cybersalt Page Protector"
PLG_SYSTEM_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Von <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Wächter für Cybersalt Page Protector. Zeigt auf den von Ihnen gewählten Seiten eine Proof-of-Work-Prüfung an, sodass Scraper echte Arbeit leisten müssen, bevor sie an Ihre Inhalte kommen. Die Einstellungen finden Sie unter Komponenten &rarr; Cybersalt Page Protector &rarr; Optionen."
PLG_SYSTEM_CSPAGEPROTECTOR_NOTE_LABEL="Die Einstellungen befinden sich in der Komponente"
PLG_SYSTEM_CSPAGEPROTECTOR_NOTE_DESC="Dieses Plugin hat keine eigenen Einstellungen. Es muss nur aktiviert sein. Welche Seiten geschützt werden, das Captcha, Ausnahmen und Protokollierung legen Sie unter <a href=\"index.php?option=com_config&amp;view=component&amp;component=com_cspageprotector\">Komponenten &rarr; Cybersalt Page Protector &rarr; Optionen</a> fest."
PLG_SYSTEM_CSPAGEPROTECTOR_BLOCKED_MESSAGE="Diese Seite benötigt eine kurze Browserprüfung, bevor sie angezeigt werden kann. Bitte öffnen Sie sie in einem Webbrowser mit aktiviertem JavaScript."
PLG_SYSTEM_CSPAGEPROTECTOR_LOG_CAPTCHA_UNAVAILABLE="Das Captcha-Plugin \"%s\" ist nicht installiert oder nicht aktiviert, daher konnte die Prüfung nicht angezeigt werden."
PLG_SYSTEM_CSPAGEPROTECTOR_ADMIN_POW_MISSING="Cybersalt Page Protector kann seine Prüfung nicht ausführen: Das Proof-of-Work-Captcha von Joomla ist ab Joomla 6.1 enthalten, und diese Website läuft mit %s. Aktualisieren Sie Joomla oder installieren Sie ein anderes Captcha-Plugin und wählen Sie es in den Optionen von Page Protector aus."
PLG_SYSTEM_CSPAGEPROTECTOR_ADMIN_CAPTCHA_MISSING="Cybersalt Page Protector kann seine Prüfung nicht ausführen: Das in seinen Optionen gewählte Captcha-Plugin \"%s\" ist nicht installiert."
PLG_SYSTEM_CSPAGEPROTECTOR_ADMIN_CAPTCHA_DISABLED="Cybersalt Page Protector kann seine Prüfung nicht ausführen: Das Captcha-Plugin \"%s\" ist deaktiviert."
PLG_SYSTEM_CSPAGEPROTECTOR_ADMIN_IMPACT_PAGES_OPEN="Bis das behoben ist, sind geschützte Seiten für alle zugänglich."
