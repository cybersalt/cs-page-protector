PLG_SYSTEM_CSPAGEPROTECTOR="Σύστημα - Cybersalt Page Protector"
PLG_SYSTEM_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Από την <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Ο φύλακας του Cybersalt Page Protector. Εμφανίζει έναν έλεγχο proof-of-work στις σελίδες που επιλέγετε, ώστε τα scrapers να πρέπει να κάνουν πραγματική δουλειά πριν πάρουν το περιεχόμενό σας. Ρυθμίζεται από Εφαρμογές &rarr; Cybersalt Page Protector &rarr; Επιλογές."
PLG_SYSTEM_CSPAGEPROTECTOR_NOTE_LABEL="Οι ρυθμίσεις βρίσκονται στην εφαρμογή"
PLG_SYSTEM_CSPAGEPROTECTOR_NOTE_DESC="Αυτό το πρόσθετο δεν έχει δικές του ρυθμίσεις. Χρειάζεται μόνο να είναι ενεργοποιημένο. Επιλέξτε ποιες σελίδες θα προστατεύονται, το captcha, τις εξαιρέσεις και την καταγραφή από <a href=\"index.php?option=com_config&amp;view=component&amp;component=com_cspageprotector\">Εφαρμογές &rarr; Cybersalt Page Protector &rarr; Επιλογές</a>."
PLG_SYSTEM_CSPAGEPROTECTOR_BLOCKED_MESSAGE="Αυτή η σελίδα χρειάζεται έναν γρήγορο έλεγχο του προγράμματος περιήγησης πριν εμφανιστεί. Ανοίξτε την σε ένα πρόγραμμα περιήγησης με ενεργοποιημένη JavaScript."
PLG_SYSTEM_CSPAGEPROTECTOR_LOG_CAPTCHA_UNAVAILABLE="Το πρόσθετο captcha «%s» δεν είναι εγκατεστημένο ή ενεργοποιημένο, οπότε ο έλεγχος δεν μπόρεσε να εμφανιστεί."
PLG_SYSTEM_CSPAGEPROTECTOR_MODULE_LOCKED_TEXT="Αυτό το περιεχόμενο εμφανίζεται μετά από έναν γρήγορο έλεγχο του προγράμματος περιήγησης."
PLG_SYSTEM_CSPAGEPROTECTOR_MODULE_LOCKED_BUTTON="Εμφάνιση περιεχομένου"
PLG_SYSTEM_CSPAGEPROTECTOR_MODULE_WORKING="Έλεγχος του προγράμματος περιήγησής σας..."
PLG_SYSTEM_CSPAGEPROTECTOR_MODULE_DONE="Έγινε - εμφανίζεται το περιεχόμενο."
PLG_SYSTEM_CSPAGEPROTECTOR_MODULE_ERROR="Ο έλεγχος δεν λειτούργησε. Δοκιμάστε ξανά."
