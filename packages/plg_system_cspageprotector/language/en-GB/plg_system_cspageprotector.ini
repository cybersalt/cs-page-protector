PLG_SYSTEM_CSPAGEPROTECTOR="System - Cybersalt Page Protector"
PLG_SYSTEM_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>By <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Gatekeeper for Cybersalt Page Protector. Shows a proof-of-work challenge on the pages you choose, so scrapers have to do real work before they get your content. Configure it under Components &rarr; Cybersalt Page Protector &rarr; Options."
PLG_SYSTEM_CSPAGEPROTECTOR_NOTE_LABEL="Settings live in the component"
PLG_SYSTEM_CSPAGEPROTECTOR_NOTE_DESC="This plugin has no settings of its own. It only needs to be enabled. Choose which pages to protect, the captcha, exemptions and logging under <a href=\"index.php?option=com_config&amp;view=component&amp;component=com_cspageprotector\">Components &rarr; Cybersalt Page Protector &rarr; Options</a>."
