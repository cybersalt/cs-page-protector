PLG_SYSTEM_CSPAGEPROTECTOR="Sistema - Cybersalt Page Protector"
PLG_SYSTEM_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Por <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Control de acceso de Cybersalt Page Protector. Muestra una comprobación de prueba de trabajo en las páginas que elija, de modo que los scrapers tengan que hacer un trabajo real antes de obtener su contenido. Se configura en Componentes &rarr; Cybersalt Page Protector &rarr; Opciones."
PLG_SYSTEM_CSPAGEPROTECTOR_NOTE_LABEL="Los ajustes están en el componente"
PLG_SYSTEM_CSPAGEPROTECTOR_NOTE_DESC="Este plugin no tiene ajustes propios. Solo necesita estar activado. Elija qué páginas proteger, el captcha, las exenciones y el registro en <a href=\"index.php?option=com_config&amp;view=component&amp;component=com_cspageprotector\">Componentes &rarr; Cybersalt Page Protector &rarr; Opciones</a>."
PLG_SYSTEM_CSPAGEPROTECTOR_BLOCKED_MESSAGE="Esta página necesita una rápida comprobación del navegador antes de mostrarse. Ábrala en un navegador web con JavaScript activado."
