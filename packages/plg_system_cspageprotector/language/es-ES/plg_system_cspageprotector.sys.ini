PLG_SYSTEM_CSPAGEPROTECTOR="Sistema - Cybersalt Page Protector"
PLG_SYSTEM_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Por <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Control de acceso de Cybersalt Page Protector. Muestra una comprobación de prueba de trabajo en las páginas que elija, de modo que los scrapers tengan que hacer un trabajo real antes de obtener su contenido. Se configura en Componentes &rarr; Cybersalt Page Protector &rarr; Opciones."
