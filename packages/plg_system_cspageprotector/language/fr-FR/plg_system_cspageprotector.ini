PLG_SYSTEM_CSPAGEPROTECTOR="Système - Cybersalt Page Protector"
PLG_SYSTEM_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>Par <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Contrôle d'accès de Cybersalt Page Protector. Affiche une vérification par preuve de travail sur les pages de votre choix, pour que les scrapers doivent fournir un vrai travail avant d'obtenir votre contenu. Configurez-le dans Composants &rarr; Cybersalt Page Protector &rarr; Options."
PLG_SYSTEM_CSPAGEPROTECTOR_NOTE_LABEL="Les réglages se trouvent dans le composant"
PLG_SYSTEM_CSPAGEPROTECTOR_NOTE_DESC="Ce plugin n'a pas de réglages propres. Il doit seulement être activé. Choisissez les pages à protéger, le captcha, les exemptions et la journalisation dans <a href=\"index.php?option=com_config&amp;view=component&amp;component=com_cspageprotector\">Composants &rarr; Cybersalt Page Protector &rarr; Options</a>."
