PLG_SYSTEM_CSPAGEPROTECTOR="システム - Cybersalt Page Protector"
PLG_SYSTEM_CSPAGEPROTECTOR_XML_DESCRIPTION="<strong>開発元: <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a></strong> Cybersalt Page Protector のゲートキーパーです。選んだページにプルーフ・オブ・ワークのチェックを表示し、スクレイパーがコンテンツを取得する前に実際の処理を行わせます。設定は コンポーネント &rarr; Cybersalt Page Protector &rarr; オプション で行います。"
