PLG_SYSTEM_CSPAGEPROTECTOR_NOTE_DESC="このプラグインには独自の設定がなく、有効にするだけで動作します。保護するページ、キャプチャ、除外、ログの設定は <a href=\"index.php?option=com_config&amp;view=component&amp;component=com_cspageprotector\">コンポーネント &rarr; Cybersalt Page Protector &rarr; オプション</a> で行います。"
PLG_SYSTEM_CSPAGEPROTECTOR_BLOCKED_MESSAGE="このページを表示するには、簡単なブラウザチェックが必要です。JavaScript を有効にしたウェブブラウザで開いてください。"
